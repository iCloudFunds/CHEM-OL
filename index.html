member of the homologous series with general formula CₙH₂ₙ:",options:["C₄H₈","C₅H₁₀","C₅H₁₂","C₆H₁₂"],answer:1,explanation:"B — C₅H₁₀. For n = 5, CₙH₂ₙ gives C₅H₁₀, an alkene."},{q:"Two air pollutants responsible for acid rain:",options:["CO and CO₂","NO₂ and SO₂","CO₂ and SO₂","NO₂ and CO"],answer:1,explanation:"B — NO₂ and SO₂. These gases dissolve in rain water to form acids."},{q:"Substance that will burn with a smoky and luminous flame:",options:["Methane","Propene","Ethane","Hydrogen"],answer:1,explanation:"B — Propene. C₃H₆ is unsaturated with a high C : H ratio, so it burns with a smoky, luminous flame."},{q:"Amount of substance in moles in 25 cm³ of 0.1 M HCl(aq):",options:["0.025","0.0025","0.25","0.00025"],answer:1,explanation:"B — 0.0025 mol. Moles = 0.1 × 0.025 = 0.0025 mol."},{q:"When excess carbon dioxide is passed through lime water, the milky colour disappears due to formation of:",options:["CaCO₃","Ca(HCO₃)₂","CaO","Ca(OH)₂"],answer:1,explanation:"B — Ca(HCO₃)₂. Excess CO₂ converts insoluble CaCO₃ to soluble calcium hydrogen carbonate."},{q:"Colour imparted to a Bunsen flame by a copper(II) salt:",options:["Bluish green","Golden yellow","Brick red","Lilac"],answer:0,explanation:"A — Bluish green. Cu²⁺ gives a bluish-green flame."},{q:"Apparatus used in preparing a standard solution:",options:["Burette","Pipette","Conical flask","Volumetric flask"],answer:3,explanation:"D — Volumetric flask. A standard solution is made up to the mark in a volumetric flask."},{q:"During an oxidation reaction, an oxidising agent:",options:["Gains oxygen","Loses oxygen","Gains electrons","Loses hydrogen"],answer:1,explanation:"B — Loses oxygen. An oxidising agent provides oxygen to oxidise another substance and is itself reduced."},{q:"Quantity of electricity when a current of 0.5 A is passed through an electrolyte for 15 minutes:",options:["75 C","150 C","450 C","900 C"],answer:2,explanation:"C — 450 C. Q = It = 0.5 × 900 = 450 C."},{q:"Number of unshared hydrogen atoms in a molecule of methane:",options:["4","0","2","1"],answer:1,explanation:"B — 0. In CH₄ all 4 hydrogen atoms are bonded to carbon; none is unshared."},{q:"Impurity left in the glass tube when excess dry hydrogen is passed over heated copper(II) oxide:",options:["Copper(II) oxide","Water","Hydrogen","Metallic copper"],answer:3,explanation:"D — Metallic copper. CuO + H₂ → Cu + H₂O; copper metal is left in the tube."},{q:"Function of limestone in the extraction of iron:",options:["Oxidising agent","Removes impurities","Reducing agent","Catalyst"],answer:1,explanation:"B — Removes impurities. Limestone acts as a flux and forms slag, CaSiO₃, with sandy impurities."},{q:"Factors that influence preferential discharge of ions during electrolysis: 1) concentration of the ion, 2) nature of the electrode, 3) position in the electrochemical series, 4) charge on the ion. Which are correct?",options:["If only 1, 2 and 3 are correct","If only 1 and 2 are correct","If only 2 and 3 are correct","If only 1 and 3 are correct"],answer:0,explanation:"A — If only 1, 2 and 3 are correct. Concentration, nature of the electrode and position in the electrochemical series matter; charge on the ion does not."},{q:"A catalyst is a substance which: 1) increases the rate of reaction, 2) increases the yield, 3) is used up in the reaction, 4) remains chemically unchanged at the end. Which are correct?",options:["If only 1 and 2 are correct","If only 1 and 3 are correct","If only 1 and 4 are correct","If only 2 and 4 are correct"],answer:2,explanation:"C — If only 1 and 4 are correct. A catalyst increases the rate of reaction and remains chemically unchanged at the end; it does not increase the yield."},{q:"Components of crude oil can be separated by:",options:["Filtration","Sublimation","Evaporation","Fractional distillation"],answer:3,explanation:"D — Fractional distillation. Crude oil is separated into fractions by fractional distillation."},{q:"Empirical formula of an organic compound with relative molecular mass 78, containing 92.3% carbon:",options:["C₆H₅","C₆H₆","CH","C₃H₃"],answer:1,explanation:"B — C₆H₆. C: 92.3 / 12 = 7.69, H: 7.7 / 1 = 7.7, ratio 1 : 1, so empirical formula CH; (CH)ₙ with 13n = 78 gives n = 6, so C₆H₆ (benzene)."},{q:"Carbon is prepared in the laboratory by the action of concentrated sulphuric acid on:",options:["Sulphur","Sugar / Sucrose","Ethanol","Copper(II) oxide"],answer:1,explanation:"B — Sugar / Sucrose. Concentrated H₂SO₄ is a dehydrating agent; it chars sugar to carbon."},{q:"Carbonate that will NOT decompose on heating in an open crucible:",options:["CaCO₃","Na₂CO₃","ZnCO₃","CuCO₃"],answer:1,explanation:"B — Na₂CO₃. Group I carbonates are stable to heat."},{q:"Which will produce steamy fumes with PCl₅?",options:["Methane","Ethane","Ethene","Ethanol"],answer:3,explanation:"D — Ethanol. An alcohol with an –OH group reacts with PCl₅ to give steamy fumes of HCl."},{q:"Which will turn moist red litmus paper blue?",options:["Ammonia gas","Sulphur dioxide","Hydrogen chloride","Carbon dioxide"],answer:0,explanation:"A — Ammonia gas. NH₃ is alkaline, so it turns moist red litmus blue."},{q:"Which will turn blue litmus paper red?",options:["Sodium hydroxide","Lemon juice","Ammonia","Soapy water"],answer:1,explanation:"B — Lemon juice. Lemon juice is acidic (citric acid), so it turns blue litmus red."},{q:"Percentage by mass of nitrogen in NH₄NO₃ (RMM 80):",options:["14%","28%","35%","70%"],answer:2,explanation:"C — 35%. Nitrogen mass = 28, 28 / 80 × 100 = 35%."},{q:"Which of the following is the least reactive?",options:["Fluorine","Chlorine","Bromine","Iodine"],answer:3,explanation:"D — Iodine. Halogen reactivity decreases down the group: F > Cl > Br > I."},{q:"Reaction that occurs during electrolysis of aqueous copper(II) sulphate:",options:["Cathode increases in size","Cathode decreases in size","Anode increases in size","No change at the cathode"],answer:0,explanation:"A — Cathode increases in size. Copper is deposited at the cathode: Cu²⁺ + 2e⁻ → Cu."},{q:"Compound most likely to be present in a bag of fertiliser:",options:["NaCl","(NH₄)₂SO₄","CaCO₃","CuSO₄"],answer:1,explanation:"B — (NH₄)₂SO₄. Ammonium sulphate is a nitrogen fertiliser."},{q:"Statement 1: Elements of Group VII have similar chemical properties. Statement 2: Group VII elements all have 7 electrons in the outer shell.",options:["Both statements True, second is correct explanation","Both statements True, second is NOT correct explanation","First True, second False","First False, second True"],answer:0,explanation:"A — Both statements True, second is correct explanation. Group VII elements have similar properties because they all have 7 outer electrons."},{q:"Statement 1: The presence of Cl⁻ ions can be tested using AgNO₃. Statement 2: Chlorides form a white AgCl precipitate with AgNO₃.",options:["Both statements True, second is correct explanation","Both statements True, second is NOT correct explanation","First True, second False","First False, second True"],answer:0,explanation:"A — Both statements True, second is correct explanation. Chlorides form a white AgCl precipitate with AgNO₃."},{q:"Statement 1: Copper will displace magnesium from magnesium salt solution. Statement 2: Copper is below magnesium in the electrochemical series.",options:["Both statements True, second is correct explanation","Both statements True, second is NOT correct explanation","First True, second False","First False, second True, second is correct explanation"],answer:3,explanation:"D — First False, second True, second is correct explanation. Copper will NOT displace magnesium, because copper is below magnesium in the electrochemical series."},{q:"Palm wine goes sour when exposed to air for some days because:",options:["Ethanol is converted to ethanoic acid","Ethanol is converted to ethanol","Ethanoic acid is converted to ethanol","Water is converted to ethanol"],answer:0,explanation:"A — Ethanol is converted to ethanoic acid, by oxidation by bacteria — vinegar forms."},{q:"Mass of zinc that will produce 16 g of copper according to Zn + CuSO₄ → ZnSO₄ + Cu:",options:["16 g","16.25 g","32.5 g","65 g"],answer:1,explanation:"B — 16.25 g. Moles Cu = 16 / 64 = 0.25 mol, moles Zn = 0.25 mol, mass Zn = 0.25 × 65 = 16.25 g."},{q:"Which of the following is a basic oxide?",options:["CO₂","SO₂","Na₂O","Al₂O₃"],answer:2,explanation:"C — Na₂O. Sodium oxide is a basic oxide."},{q:"Mass of 0.1 mole of Na₂CO₃ (RMM 106):",options:["10.6 g","1.06 g","106 g","0.106 g"],answer:0,explanation:"A — 10.6 g. Mass = 0.1 × 106 = 10.6 g."},{q:"Plastics pollute the environment because they are:",options:["Biodegradable","Soluble","Colourful","Non-biodegradable"],answer:3,explanation:"D — Non-biodegradable. Plastics do not break down naturally, so they persist in the environment."},{q:"Different components of universal indicator can be separated by:",options:["Filtration","Sublimation","Chromatography","Fractional distillation"],answer:2,explanation:"C — Chromatography. Paper chromatography separates the dye mixture in universal indicator."},{q:"For the formation of NaCl, ΔH is negative. What is true of the reactants?",options:["Energy content of reactants is more than that of products","Energy content of products is more than that of reactants","Energy content of reactants equals that of products","There is no heat change"],answer:0,explanation:"A — Energy content of reactants is more than that of products. The reaction is exothermic, so heat is given out."},{q:"Reaction with powdered Na₂CO₃: Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂. How can the reaction be made to go faster?",options:["Using 0.3 M HCl","Using 0.1 M HCl","Using larger lumps of Na₂CO₃","Decreasing the temperature"],answer:0,explanation:"A — Using 0.3 M HCl. Higher concentration gives more collisions per second, so a faster rate."},{q:"How many particles of NaOH are contained in 0.1 mole of NaOH?",options:["6.02 × 10²³","6.02 × 10²⁴","6.02 × 10²¹","6.02 × 10²²"],answer:3,explanation:"D — 6.02 × 10²². Particles = 0.1 × 6.02 × 10²³ = 6.02 × 10²²."},{q:"Method of separation illustrated (dish over boiling water, salt solution):",options:["Filtration","Sublimation","Fractional distillation","Evaporation to dryness"],answer:3,explanation:"D — Evaporation to dryness. The water evaporates and the salt remains in the dish."},{q:"Example of a mixture that can be separated by this method:",options:["Water and oil","Ethanol and water","Sand and water","NaCl and H₂O"],answer:3,explanation:"D — NaCl and H₂O. A salt solution is separated by evaporation to dryness: water evaporates, salt remains."},{q:"Process that involves a physical change:",options:["Heating a wax cake","Rusting of iron","Burning of wood","Neutralisation"],answer:0,explanation:"A — Heating a wax cake. Melting is a physical change; no new substance is formed."},{q:"Isotopes of a given element have the same:",options:["Mass number","Number of neutrons","Atomic mass","Chemical properties"],answer:3,explanation:"D — Chemical properties. Isotopes have the same protons and electrons, so the same electronic configuration and chemical properties."}],Pf=[{n:"1",title:"Choose your year",text:"Pick 2019, 2020, 2021, 2022, 2024, 2025 or 2026 above. Each year shows only its own lectures and papers — years never mix."},{n:"2",title:"Read one lesson per page",text:"12 lessons for your year, each matched to that year's paper. Move forward or back with Next / Previous."},{n:"3",title:"Answer one question per page",text:"In Paper 2, read one question, try it, then Show / Hide the model answer. In Paper 1 2019 / 2020 / 2021 / 2022 / 2024 / 2025, answer one MCQ per page."},{n:"4",title:"Have your paper at hand",text:"Keep your printed exam paper beside you for reference while you work through each page."}];function Ts(){let[e,t]=nt.useState("2026"),[n,o]=nt.useState("home"),[i,a]=nt.useState(0),[r,s]=nt.useState(0),[l,p]=nt.useState(!1),[g,w]=nt.useState(!1),[f,b]=nt.useState(0),[O,S]=nt.useState({}),
