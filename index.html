:root {

  --red: #B71C1C;
  --red-deep: #7F0000;
  --blue: #FFC107;
  --blue-deep: #FFD54F;
  --yellow: #FFC107;
  --yellow-soft: #FFD54F;
  --paper: #4A148C;
  --surface: #6A1B9A;
  --surface-2: #7B1FA2;
  --ink: #FFFFFF;
  --muted: #FFFFFF;
  --line: #FFC107;
  --gold: #FFC107;
  --gold-light: #FFD54F;
  --green: #2E7D32;
  --green-deep: #1B5E20;
  --font-display: Georgia, "Times New Roman", serif;
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #4A148C;
    --surface: #6A1B9A;
    --surface-2: #7B1FA2;
    --ink: #FFFFFF;
    --muted: #FFFFFF;
    --line: #FFC107;
    --yellow-soft: #FFD54F;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: #4A148C;
  font-size: 20px;
}

body {
  margin: 0;
  background: #4A148C;
  color: #FFFFFF;
  font-family: var(--font-sans);
  font-size: 20px;
  line-height: 1.6;
  font-weight: 700;
}

button, select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

p, li, span, h1, h2, h3, h4 {
  color: #FFFFFF;
}

.font-display {
  font-family: var(--font-display);
}

.paper-grid {
  background-image: linear-gradient(to right, rgba(255,193,7,.18) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,193,7,.18) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* Large card-buttons */

.card-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  border: 3px solid #FFC107;
  background: #6A0F0F;
  color: #FFFFFF;
  border-radius: 22px;
  padding: 20px 22px;
  font-size: 22px;
  font-weight: 900;
  line-height: 1.4;
  text-align: center;
  box-shadow: 0 7px 0 rgba(0,0,0,.38);
  transition: transform .08s ease, background .15s ease;
}

.card-btn:hover {
  background: #8E0E00;
  transform: translateY(-2px);
}

.card-btn:active {
  transform: translateY(2px);
  box-shadow: 0 3px 0 rgba(0,0,0,.38);
}

.card-btn-purple {
  background: #6A1B9A;
  border-color: #FFC107;
}

.card-btn-purple:hover {
  background: #7B1FA2;
}

.card-btn-gold {
  background: #6A0F0F;
  border-color: #FFFFFF;
}

.card-btn.is-active {
  background: #8E0E00;
  border-color: #FFFFFF;
  color: #FFD54F;
  box-shadow: 0 7px 0 rgba(0,0,0,.38), 0 0 0 4px rgba(255,193,7,.55);
}

.card-btn-purple.is-active {
  background: #4A148C;
}

.card-btn:disabled {
  opacity: .55;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 3px solid #FFC107;
  background: #6A0F0F;
  color: #FFFFFF;
  border-radius: 999px;
  padding: 12px 18px;
  font-size: 20px;
  font-weight: 900;
  line-height: 1.4;
}

/* Tall summary / count cards (home hero): keep every label word complete.
   The grid auto-fits wider cards and wraps whole cards to the next row on
   very narrow phones, instead of squeezing a card until a word must break. */

.count-cards {
  display: grid;
  gap: 0.75rem;
  grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
}

.count-card {
  box-sizing: border-box;
  min-width: 138px;
}

.count-label {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  -moz-column-gap: 0.35em;
       column-gap: 0.35em;
  row-gap: 0;
}

.count-word, .count-value {
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
  hyphens: none;
}

.chip {
  display: inline-flex;
  align-items: center;
  border: 3px solid #FFC107;
  background: #7B1FA2;
  color: #FFFFFF;
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.5;
}

,t)i[o]===void 0&&(i[o]=t[o]);return{$$typeof:jm,type:e,key:a,ref:r,props:i,_owner:nf.current}}var kt=ef,h=bd,m=bd;var af=["1 Faraday = 96,500 C","Molar volume at R.T.P. = 24,000 cm³","Specific heat capacity of water = 4.2 J/g/K","Avogadro = 6.02 × 10²³","0 °C = 273 K","RAM: H 1 · C 12 · O 16 · N 14 · Na 23 · S 32 · Cl 35.5 · Ca 40"],rf=["1 Faraday = 96,500 C","Molar volume at R.T.P. = 24,000 cm³","Specific heat capacity of water = 4.2 J/g/K","Avogadro = 6.02 × 10²³","0 °C = 273 K","RAM: H 1 · C 12 · O 16 · Cl 35.5 · Ag 108 · Ca 40"],sf=["1 Faraday = 96,000 C","Molar volume at R.T.P. = 24,000 cm³","Specific heat capacity of water = 4.2 J/g/K","Avogadro = 6.02 × 10²³","0 °C = 273 K","RAM: H 1 · C 12 · O 16 · N 14 · Na 23 · S 32 · Cl 35.5 · Ca 40"],lf=["1 Faraday = 96,000 C","Molar volume at s.t.p. = 24,000 cm³","Specific heat capacity of water = 4.2 J/g/K","Avogadro = 6.02 × 10²³","0 °C = 273 K","RAM: H 1 · C 12 · O 16 · Cl 35.5 · Ag 108"],uf=["1 Faraday = 96,000 C","Molar volume at s.t.p. = 24,000 cm³","Specific heat capacity of water = 4.2 J/g/K","Avogadro = 6.02 × 10²³","0 °C = 273 K","RAM: H 1 · C 12 · O 16 · N 14 · Na 23 · Cu 64"],cf=["1 Faraday = 96,000 C","Molar volume at R.T.P. = 24,000 cm³","Specific heat capacity of water = 4.2 J/g/K","Avogadro = 6.02 × 10²³","0 °C = 273 K","RAM: H 1 · C 12 · O 16 · Na 23 · N 14 · Cu 64"],df=["1 Faraday = 96,000 C","Molar volume at R.T.P. = 24,000 cm³","Specific heat capacity of water = 4.2 J/g/K","Avogadro = 6.02 × 10²³","0 °C = 273 K","RAM: H 1 · C 12 · O 16 · N 14 · Na 23 · S 32 · Cl 35.5 · Ca 40 · Cu 64 · Zn 65"],pf=[{title:"Solution / Uniform Mixture",tag:"Paper 1 · Q1 · Paper 2",intro:"A solution is a uniform mixture of a solute and a solvent. The solute is spread evenly through the solvent, so every part of the solution has the same composition.",points:["Solution: a uniform (homogeneous) mixture of a solute dissolved in a solvent.","Solute: the substance that dissolves, e.g. salt in salt water. Solvent: the substance that dissolves it, e.g. water.","In a solution the solute particles are evenly spread — the mixture looks like one substance throughout.","A solution is not a compound: no chemical bond is formed, and the solute can be recovered, e.g. by evaporation.","Example: salt + water → salt solution. The salt is the solute, water is the solvent."],example:"Exam line: a uniform mixture of solute and solvent = a solution."},{title:"Group I Stored Under Paraffin Oil",tag:"Paper 1 · Q2 · Paper 2 · Q2",intro:"Group I metals are so reactive that they must be kept away from air and water. Paraffin oil keeps both out.",points:["Group I = the alkali metals: lithium, sodium, potassium, rubidium, caesium, francium.","They react vigorously with air / oxygen and with water / moisture, so they are stored under paraffin oil / kerosene.","The oil forms a layer that stops air and water reaching the metal.","Reactivity increases down Group I: Li < Na < K < Rb < Cs.","Potassium reacts more vigorously with water than sodium does — it floats, melts to a ball, and may catch fire."],example:"Exam line: element stored under paraffin oil = potassium (a Group I metal, reactive with air and water)."},{title:"Neutralisation",tag:"Paper 1 · Q3 · Paper 2 · Q4",intro:"Neutralisation: acid + base → salt + water. If only a salt and water are formed, that is the clue in the question.",points:["Neutralisation: an acid reacts with a base (or alkali) to give a salt and water only.","Example: HCl + KOH → KCl + H₂O. Dilute HCl + potassium hydroxide is a neutralisation reaction.","Acid + metal carbonate → salt + water + carbon dioxide is also an acid reaction, but it is not neutralisation alone — CO₂ is also formed.","Acid + metal → salt + hydrogen is not neutralisation — no water is formed.","The salt is named from the acid and the base: e.g. sulphuric acid + sodium hydroxide → sodium sulphate + water."],example:"Exam line: dilute HCl + KOH → KCl + H₂O — a neutralisation reaction."},{title:"Acid Rain / NO₂ + SO₂",tag:"Paper 1 · Q4",intro:"Acid rain is caused mainly by two gases from burning fuels: nitrogen dioxide and sulphur dioxide.",points:["Major causes of acid rain: nitrogen dioxide, NO₂, and sulphur dioxide, SO₂.","SO₂ comes from burning fossil fuels that contain sulphur, e.g. coal and oil.","NO₂ comes from high-temperature burning in car engines and factories, where nitrogen and oxygen in the air combine.","Both gases dissolve in rain water to form acids — sulphurous / sulphuric acid and nitrous / nitric acid.","Acid rain damages buildings, lakes, plants and soil. It is much more acidic than natural rain, which is only slightly acidic from CO₂."],example:"Exam line: the pair that constitutes the major cause of acid rain = NO₂ and SO₂."},{title:"Ethene Decolourises Bromine Water",tag:"Paper 1 · Q5 · Paper 2 · Q3",intro:"The double bond is the test. Alkenes decolourise bromine water by addition; alkanes do not.",points:["Ethene, C₂H₄, is an alkene — it has a carbon–carbon double bond.","Ethene rapidly decolourises bromine water: the orange bromine is used up in an addition reaction across the double bond.","Equation: C₂H₄ + Br₂ → C₂H₄Br₂ (1,2-dibromoethane).","Alkanes such as methane, ethane and propane are saturated — they do not decolourise bromine water.","This is the standard test to distinguish an alkene from an alkane."],example:"Exam line: hydrocarbon that rapidly decolourises bromine water = ethene — an alkene, addition reaction."},{title:"Reactivity Series / Halogens",tag:"Paper 1 · Q6",intro:"A more reactive halogen displaces a less reactive one from its salt. A less reactive halogen cannot displace a more reactive one.",points:["Halogen reactivity decreases down Group VII: F > Cl > Br > I.","Chlorine displaces bromine and iodine from their salts; bromine displaces iodine, but not chlorine.","Iodine is less reactive than bromine, so iodine cannot displace bromine from potassium bromide.","So I₂ + 2KBr → 2KI + Br₂ will NOT occur — iodine cannot push bromine out.","Check the direction: the free halogen must be more reactive than the halogen in the salt."],example:"Exam line: I₂ + 2KBr → 2KI + Br₂ will NOT occur — iodine is less reactive than bromine."},{title:"Zymase / Fermentation",tag:"Paper 1 · Q7",intro:"Fermentation turns glucose into ethanol. The enzyme in yeast that does the second step is zymase.",points:["Fermentation: glucose → ethanol + carbon dioxide, using yeast, at 30–37 °C, without air (anaerobic).","Equation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂.","Zymase is the enzyme (from yeast) that converts glucose to ethanol.","Diastase breaks down starch to glucose first: starch → glucose, then zymase acts on the glucose.","Do not confuse them: diastase = starch to glucose; zymase = glucose to ethanol."],example:"Exam line: the enzyme that converts glucose to ethanol = zymase — fermentation."},{title:"Water of Crystallisation — CuSO₄·5H₂O",tag:"Paper 1 · Q8",intro:"Water of crystallisation is water built into the crystal. Its mass is part of the formula mass, so include it in every percentage.",points:["Hydrated copper(II) sulphate is CuSO₄·5H₂O — five water molecules are part of each formula unit.","Mr of CuSO₄ = 64 + 32 + (4 × 16) = 160. Mr of 5H₂O = 5 × 18 = 90.","Total Mr of CuSO₄·5H₂O = 160 + 90 = 250.","Percentage of water of crystallisation = 90 / 250 × 100 = 36.0%.","Heating drives the water off: blue CuSO₄·5H₂O → white anhydrous CuSO₄ + 5H₂O."],example:"Exam line: % water in CuSO₄·5H₂O = 90 / 250 × 100 = 36.0%."},{title:"Equilibrium / Forward = Backward Rate",tag:"Paper 1 · Q9",intro:"Equilibrium is not when the reaction stops — it is when the forward and backward reactions run at the same rate.",points:["A reversible reaction can go forwards and backwards: reactants ⇌ products.","At equilibrium, the rate of the forward reaction = the rate of the backward reaction.","The amounts of reactants and products stay constant, but both reactions are still happening.","Equilibrium is reached in a closed system — nothing escapes.","Le Chatelier's principle: if the equilibrium is disturbed, it shifts to counteract the change."],example:"Exam line: equilibrium is attained when the rate of the forward and backward reactions are the same."},{title:"Oxidation State — Fe₂O₃",tag:"Paper 1 · Q10",intro:"Oxidation state: use the rules and one equation. Oxygen is −2, the total for a neutral compound is 0.",points:["Rule: in a neutral compound, the oxidation states add up to 0.","Rule: oxygen is usually −2 in compounds (except in peroxides).","Let the oxidation state of Fe in Fe₂O₃ be x: 2x + 3(−2) = 0.","So 2x = +6, and x = +3. The oxidation state of iron in Fe₂O₃ is +3.","Fe₂O₃ is iron(III) oxide — the (III) tells you the oxidation state."],example:"Exam line: 2x + 3(−2) = 0 → x = +3 for Fe in Fe₂O₃."},{title:"Preparation of Cl₂",tag:"Paper 1 · Q11 · Paper 2",intro:"In the laboratory, chlorine is made by oxidising chloride. MnO₂ is the oxidising agent; heating drives the reaction.",points:["Laboratory preparation: sodium chloride + concentrated sulphuric acid + manganese(IV) oxide, with heat.","First, HCl is formed in situ: NaCl + H₂SO₄ → NaHSO₄ + HCl.","Then MnO₂ oxidises the HCl: MnO₂ + 4HCl → MnCl₂ + Cl₂ + 2H₂O.","MnO₂ is the oxidising agent — it oxidises chloride ions to chlorine gas.","The chlorine is washed (water removes HCl fumes), dried, and collected by downward delivery because it is denser than air."],example:"Exam line: MnO₂, H₂SO₄, NaCl and heat — HCl formed in situ is oxidised by MnO₂ to Cl₂."},{title:"NH₃ Collected by Upward Delivery",tag:"Paper 1 · Q12",intro:"How a gas is collected depends on its density and solubility. Ammonia is lighter than air and very soluble — so it rises, and it is never collected over water.",points:["Ammonia, NH₃, is lighter (less dense) than air, so it rises.","It is collected by upward delivery — the gas jar is held upside down, and the ammonia displaces the air downwards.","Upward delivery is also called downward displacement of air.","Ammonia is very soluble in water, so it cannot be collected over water.","Gases denser than air, such as CO₂, SO₂ and Cl₂, are collected by downward delivery instead."],example:"Exam line: NH₃ is collected by upward delivery — it is lighter than air."}],hf=[{title:"Sub-Atomic Particles / The Nucleus",tag:"Paper 1 · Q1 · Paper 2",intro:"Protons, neutrons and electrons are the sub-atomic particles. The nucleus is the structure that holds protons and neutrons — it is not itself a particle.",points:["Proton: positive charge, mass 1, found in the nucleus.","Neutron: no charge, mass 1, found in the nucleus.","Electron: negative charge, very small mass, found in shells around the nucleus.","Proton number = number of protons. In a neutral atom, electrons = protons.","Mass number = protons + neutrons. Neutrons = mass number − proton number."],example:"Atom with mass 35 and atomic number 17: protons 17, electrons 17, neutrons 35 − 17 = 18."},{title:"Glowing Splint / Oxygen",tag:"Paper 1 · Q2",intro:"A glowing splint relights in oxygen. That is the test for oxygen — learn it as one quick observation.",points:["Test for oxygen: a glowing splint relights / bursts into flame in oxygen.","Test for hydrogen: a burning splint gives a squeaky pop.","Test for carbon dioxide: it turns limewater milky.","Oxygen is colourless, odourless, and supports combustion — it does not itself burn.","Oxygen makes up about 21% of the air."],example:"Exam line: glowing splint relights → oxygen (O₂) is present."},{title:"Ammonia — Alkaline Gas / Litmus",tag:"Paper 1 · Q3",intro:"Ammonia is the classic alkaline gas. Its litmus test is the opposite of the test for an acidic gas.",points:["Ammonia is an alkaline gas: it turns damp red litmus paper blue.","Acidic gases, such as SO₂ and HCl gas, turn damp blue litmus red.","Ammonia is less dense than air and very soluble in water, so it is collected by downward delivery.","Ammonia is dried with quicklime (CaO) — never with concentrated sulphuric acid or calcium chloride.","Ammonia + acid → ammonium salt, e.g. NH₃ + HCl → NH₄Cl."],example:"Damp red litmus turns blue → alkaline gas present, e.g. ammonia."},{title:"Fertilisers from Sulphuric Acid",tag:"Paper 1 · Q4",intro:"Sulphuric acid makes sulphate fertilisers. Ammonium sulphate is the one to remember from this paper.",points:["Ammonium sulphate, (NH₄)₂SO₄, is made from sulphuric acid and ammonia.","Equation: 2NH₃ + H₂SO₄ → (NH₄)₂SO₄.","It supplies nitrogen, one of the three main elements plants need: nitrogen, phosphorus, potassium (N, P, K).","Percentage of nitrogen in (NH₄)₂SO₄: Mr = 132, N = 28/132 × 100 = 21.2%.","Ammonium nitrate, NH₄NO₃, has more nitrogen: 28/80 × 100 = 35%."],example:"Fertiliser made from sulphuric acid = ammonium sulphate, (NH₄)₂SO₄."},{title:"Hardness in Water",tag:"Paper 1 · Q5",intro:"Hard water contains dissolved calcium or magnesium salts. Those ions cause the hardness.",points:["Hardness is caused by dissolved Ca²⁺ and Mg²⁺ salts, e.g. MgSO₄ and Ca(HCO₃)₂.","Hard water forms scum with soap, so soap does not lather easily.","Temporary hardness is caused by dissolved calcium / magnesium hydrogencarbonate and is removed by boiling.","Permanent hardness is caused by dissolved calcium / magnesium sulphates and is not removed by boiling.","Permanent hardness is removed by ion exchange or by adding washing soda."],example:"Substance that causes hardness in water = MgSO₄ — a magnesium salt in solution."},{title:"Neutrons / Mass − Atomic Number",tag:"Paper 1 · Q6 · Paper 2 · Q1",intro:"One subtraction gives the neutron number. Never guess — calculate.",points:["Proton number = atomic number = number of protons.","Mass number = nucleon number = protons + neutrons.","Neutrons = mass number − atomic number.","Electrons in a neutral atom = protons = atomic number.","In an ion, electrons change: a positive ion has lost electrons, a negative ion has gained electrons."],example:"Mass 35, atomic number 17 → neutrons = 35 − 17 = 18."},{title:"Chlorine / Water Treatment",tag:"Paper 1 · Q7",intro:"Chlorine is added to drinking water for one reason: to kill germs.",points:["Chlorine in water treatment kills germs / bacteria — it sterilises the water.","Chlorine is a poisonous, greenish-yellow gas, denser than air.","Chlorine is collected by downward delivery (upward displacement of air) because it is denser than air.","Chlorine bleaches damp litmus paper — it turns it white.","Chlorine displaces bromine and iodine from their salts because it is more reactive."],example:"Exam line: chlorine is used in water treatment to kill germs."},{title:"Copper Purification / Electrolysis",tag:"Paper 1 · Q8 · Paper 2",intro:"Impure copper dissolves at the anode and pure copper deposits at the cathode. Learn both half-equations.",points:["Set-up: impure copper anode, pure copper cathode, copper(II) sulphate electrolyte.","Anode: Cu → Cu²⁺ + 2e⁻ — impure copper dissolves.","Cathode: Cu²⁺ + 2e⁻ → Cu — pure copper deposits.","Impurities fall to the bottom as anode sludge.","Quantity of electricity: Q = I × t. 1 Faraday = 96,500 C deposits 1 mole of singly charged ions."],example:"1.5 A for 1 h 30 min: Q = 1.5 × 5400 = 8100 C. Moles Cu = 8100 / (96,500 × 2) = 0.042 mol. Mass = 0.042 × 64 = 2.70 g."},{title:"Empirical Formula — CH₂",tag:"Paper 1 · Q13",intro:"Empirical formula = the simplest whole-number ratio of atoms. Divide by RAM, then divide by the smallest.",points:["Step 1: divide each mass (or percentage) by its relative atomic mass to get moles.","Step 2: divide each mole value by the smallest mole value to get the ratio.","Step 3: if needed, multiply to get whole numbers.","Example: 85.7% C, 14.3% H → C: 85.7/12 = 7.14, H: 14.3/1 = 14.3. Ratio 7.14 : 14.3 = 1 : 2.","So the empirical formula is CH₂. The molecular formula could be a multiple, e.g. C₂H₄."],example:"85.7% C, 14.3% H → CH₂. Show the working: 85.7/12 = 7.14 and 14.3/1 = 14.3, ratio 1 : 2."},{title:"Silver Halides / Yellow AgI",tag:"Paper 1 · Q14",intro:"Acidified silver nitrate is the test for halides. The colour of the precipitate tells you which halide is present.",points:["Chloride: white precipitate, AgCl.","Bromide: cream / pale yellow precipitate, AgBr.","Iodide: yellow precipitate, AgI.","The precipitate dissolves in ammonia if it is AgCl, but AgI does not dissolve.","Silver halides darken in sunlight — they are used in photography."],example:"Yellow precipitate with AgNO₃ → iodide ion present (AgI)."},{title:"Frasch Process / Super-Heated Water",tag:"Paper 1 · Q15",intro:"Sulphur is extracted by the Frasch process: super-heated water melts underground sulphur so it can be forced up.",points:["Super-heated water is pumped down to melt the sulphur underground.","Compressed air is pumped down to force the molten sulphur up to the surface.","Sulphur melts at about 115 °C, so super-heated water is hot enough to melt it.","The sulphur is then cooled and solidifies as pure sulphur.","Sulphur is insoluble in water, so it does not dissolve in the super-heated water."],example:"Function of super-heated water in the Frasch process = to melt sulphur."},{title:"Distillation / Boiling Points",tag:"Paper 1 · Q17–Q18",intro:"Fractional distillation separates miscible liquids with different boiling points. The difference in boiling points is what makes it work.",points:["Fractional distillation separates miscible liquids, e.g. ethanol and petrol.","The liquids must have different boiling points.","The liquid with the lower boiling point distils over first.","A fractionating column gives repeated condensation and evaporation, improving the separation.","Simple distillation separates a solvent from a dissolved solid; fractional distillation separates two liquids."],example:"Ethanol and petrol are separated by fractional distillation because they have different boiling points."}],mf=[{title:"Thermal Reduction / Copper",tag:"Paper 1 · Q1 · Paper 2",intro:"Copper is extracted by thermal reduction: its oxide is heated with carbon, and carbon removes the oxygen.",points:["Thermal reduction: a metal oxide is heated with a reducing agent, usually carbon, to give the metal.","Copper(II) oxide + carbon: 2CuO + C → 2Cu + CO₂ (also written CuO + C → Cu + CO).","Carbon is the reducing agent — it removes oxygen from CuO and is itself oxidised.","CuO is reduced to copper: Cu²⁺ gains electrons to become Cu.","This method works for metals below carbon in the reactivity series. Very reactive metals need electrolysis instead."],example:"Exam line: copper is extracted by thermal reduction — CuO + C → Cu + CO."},{title:"Oxidation / Loss of Electrons",tag:"Paper 1 · Q2",intro:"Oxidation can be defined in three ways. The electron definition is the one to use for electrolysis and redox equations.",points:["Oxidation: loss of electrons. Reduction: gain of electrons.","Oxidation: gain of oxygen. Reduction: loss of oxygen.","Oxidation: loss of hydrogen. Reduction: gain of hydrogen.","Remember OIL RIG: Oxidation Is Loss (of electrons), Reduction Is Gain (of electrons).","A reducing agent is oxidised; an oxidising agent is reduced."],example:"Na → Na⁺ + e⁻ is oxidation — sodium loses an electron. Cl + e⁻ → Cl⁻ is reduction."},{title:"Sublimation",tag:"Paper 1 · Q3",intro:"Sublimation is a change of state from solid straight to gas, without melting first.",points:["Sublimation: solid → gas directly, without passing through the liquid state.","The reverse — gas → solid directly — is also called sublimation (deposition).","Substances that sublime: ammonium chloride, iodine, dry ice (solid carbon dioxide), naphthalene.","Sublimation separates a mixture such as NH₄Cl + NaCl: NH₄Cl sublimes on heating and condenses on a cold surface; NaCl stays behind.","Melting is solid → liquid; boiling / evaporation is liquid → gas. Do not confuse them with sublimation."],example:"Exam line: solid → gas directly = sublimation."},{title:"Inactive Air / Nitrogen",tag:"Paper 1 · Q4",intro:"Most of the air is inactive — it does not support combustion. That inactive gas is nitrogen.",points:["Air is about 78% nitrogen and 21% oxygen, plus small amounts of carbon dioxide, argon and water vapour.","Nitrogen is the main component of air and is often called the inactive part of air.","Nitrogen does not support combustion — a burning splint goes out in nitrogen.","Oxygen, about 21% of air, is the gas that supports combustion and relights a glowing splint.","Nitrogen is used where an unreactive atmosphere is needed, for example in food packaging and in the Haber process."],example:"Exam line: main component of inactive air = nitrogen, about 78% of air."},{title:"Isotopes",tag:"Paper 1 · Q5",intro:"Isotopes: same element, same protons, different neutrons. One word answers a whole family of questions.",points:["Isotopes = atoms of the same element with the same atomic number but different mass numbers.","Same atomic number means the same number of protons and the same number of electrons.","Different mass numbers mean different numbers of neutrons.","Example: ¹⁷³⁵X and ¹⁷³⁷X are isotopes — both have 17 protons; one has 18 neutrons, the other has 20 neutrons.","Isotopes of an element have the same chemical properties, because chemistry depends on electrons."],example:"Isotope of ¹⁷³⁵X = ¹⁷³⁷X — same protons (17), different neutrons."},{title:"Hydrogen Lighter Than Air",tag:"Paper 1 · Q6",intro:"How a gas is collected depends on its density and its solubility. Hydrogen is lighter than air, so it rises.",points:["Hydrogen is lighter (less dense) than air, so it rises and displaces air downwards.","Hydrogen is collected by upward delivery / downward displacement of air — the gas jar is held upside down.","Hydrogen is insoluble in water, so it can also be collected over water.","Gases denser than air, such as CO₂, SO₂ and Cl₂, are collected by downward delivery / upward displacement of air.","Very soluble gases, such as ammonia, cannot be collected over water."],example:"Exam line: hydrogen is collected by upward delivery because it is lighter than air."},{title:"BaSO₄ Insoluble in Acid",tag:"Paper 1 · Q7",intro:"Barium sulphate is the white precipitate that does not dissolve in acid. That one property identifies the sulphate ion.",points:["Test for sulphate: add BaCl₂, then dilute HCl. A white precipitate of BaSO₄ forms and does NOT dissolve in the acid.","Equation: Ba²⁺ + SO₄²⁻ → BaSO₄ (white precipitate).","If the white precipitate dissolves in dilute acid, it is not BaSO₄ — it could be BaSO₃ or BaCO₃.","Acidified barium chloride is used so that carbonate and sulphite precipitates do not give a false result.","The same idea is used the other way round: BaCl₂ solution gives a white precipitate with aqueous Na₂SO₄."],example:"Anion that forms a precipitate with barium ion in acid medium = sulphate ion, BaSO₄."},{title:"Moles / 4.5 g Water",tag:"Paper 1 · Q8",intro:"Moles = mass / Mr. Then multiply by Avogadro's number to get the number of particles.",points:["Mr of water, H₂O = (2 × 1) + 16 = 18.","Moles in 4.5 g of water = 4.5 / 18 = 0.25 mol.","One mole contains 6.02 × 10²³ particles (Avogadro's number).","Number of molecules = 0.25 × 6.02 × 10²³ = 1.5 × 10²³ molecules.","The same method works for any substance: moles = mass / Mr, then particles = moles × 6.02 × 10²³."],example:"4.5 g water → 0.25 mol → 1.5 × 10²³ molecules."},{title:"CO₂ Makes Rain Slightly Acidic",tag:"Paper 1 · Q9",intro:"Pure rain water is not neutral — dissolved carbon dioxide makes it slightly acidic.",points:["Carbon dioxide dissolves in rain water to form carbonic acid: CO₂ + H₂O → H₂CO₃.","Carbonic acid is a weak acid, so natural rain water is slightly acidic, about pH 5.6.","That is natural — it is not the same as acid rain from sulphur dioxide and nitrogen oxides.","Acid rain is much more acidic and damages buildings, lakes and plants.","Test: CO₂ turns limewater milky because insoluble CaCO₃ forms."],example:"Exam line: gas that naturally makes rain water slightly acidic = carbon dioxide."},{title:"Dibasic Acid H₂SO₄",tag:"Paper 1 · Q10",intro:"Basicity is the number of replaceable hydrogen ions in one molecule of the acid.",points:["Monobasic acids give 1 H⁺ per molecule, e.g. HCl, HNO₃, CH₃COOH.","Dibasic acids give 2 H⁺ per molecule, e.g. H₂SO₄.","Tribasic acids give 3 H⁺ per molecule, e.g. H₃PO₄.","H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O — one mole of H₂SO₄ neutralises two moles of NaOH.","Do not confuse basicity with strength: H₂SO₄ is both dibasic and a strong acid, but ethanoic acid is monobasic and weak."],example:"Exam line: dibasic acid = H₂SO₄ — it gives 2 H⁺ ions."},{title:"Neutrons / Argon-40",tag:"Paper 1 · Q11",intro:"One subtraction gives the neutron number. Never guess — calculate.",points:["Proton number = atomic number = number of protons in the atom.","Mass number = nucleon number = protons + neutrons.","Neutrons = mass number − atomic number.","For argon-40, ¹⁸⁴⁰Ar: protons = 18, mass number = 40, so neutrons = 40 − 18 = 22.","In a neutral atom, electrons = protons = 18 for argon."],example:"¹⁸⁴⁰Ar → neutrons = 40 − 18 = 22."},{title:"Rate / Temperature and Grinding",tag:"Paper 1 · Q12",intro:"Rate is about collisions. Heating and grinding both make collisions more frequent or more successful.",points:["Increasing temperature: particles gain kinetic energy, move faster, collide more often, and more collisions have the activation energy — so the rate increases.","Grinding / powdering a solid: increases the total surface area exposed, so there are more collisions per second — so the rate increases.","Increasing concentration also increases the rate: more particles per unit volume, more collisions per second.","A catalyst lowers the activation energy, so more particles can react — the rate increases, and the catalyst is not used up.","For CaCO₃ + HCl, both increasing the temperature and grinding the CaCO₃ increase the rate."],example:"Exam line: rate of CaCO₃ + HCl can be increased by increasing the temperature (grinding also increases the rate)."}],ff=[{title:"Electronic Configuration, Groups & Periods",tag:"Paper 2 · Q1",intro:"How proton number decides electronic arrangement — and how arrangement decides position in the Periodic Table.",points:["Electronic configuration lists electrons shell by shell. X (proton number 12) is 2,8,2. Y (proton number 9) is 2,7.","The number of occupied shells = the period. X has 3 shells → Period 3. Y has 2 shells → Period 2.","The number of outer-shell electrons = the group (for main-group elements). X has 2 outer electrons → Group II. Y has 7 → Group VII.","Mass number = protons + neutrons. For X: 24 − 12 = 12 neutrons. For Y: protons = 9.","Nucleon number is another name for mass number — the total number of protons + neutrons in the nucleus."],example:"Check: X = 2,8,2 → Group II, Period 3 (magnesium). Y = 2,7 → Group VII, Period 2 (fluorine). Never confuse mass number (24) with proton number (12)."},{title:"Ionic Bonding — Dot-and-Cross, MgF₂",tag:"Paper 2 · Q1(d)",intro:"A metal atom transfers electrons to non-metal atoms. Opposite ions attract — that is ionic bonding.",points:["Mg atom (2,8,2) gives away its 2 outer electrons — one to each of two F atoms (2,7).","Result: Mg²⁺ with configuration [2,8]²⁺ and two F⁻ ions, each [2,8]⁻.","Draw dot-and-cross diagrams showing the transferred electrons and the full outer shells of the ions.","The compound is MgF₂ — one Mg²⁺ for every two F⁻, so the charges balance: +2 + 2(−1) = 0.","Ionic bonding = strong electrostatic attraction between oppositely charged ions, in a giant lattice."],example:"Dot-and-cross: Mg ×× + 2 F (seven crosses/dots each) → [Mg]²⁺ + 2 [F]⁻, each fluoride ion with 8 electrons in its outer shell."},{title:"Manufacture of Nitric Acid",tag:"Paper 2 · Q2",intro:"Haber → Ostwald → absorption. Learn the sequence, the catalyst, and every balanced equation.",points:["Step A — Haber: N₂ + 3H₂ ⇌ 2NH₃. Catalyst: finely divided iron, about 450 °C, about 200 atm.","Step B — Ostwald, first stage: ammonia is oxidised in oxygen / air over a platinum catalyst: 4NH₃ + 5O₂ → 4NO + 6H₂O.","Step C — NO is oxidised in air: 2NO + O₂ → 2NO₂.","Absorption: 4NO₂ + O₂ + 2H₂O → 4HNO₃ (also accepted: 3NO₂ + H₂O → 2HNO₃ + NO).","Laboratory nitric acid looks yellow / brownish-yellow because nitrogen dioxide is dissolved in it."],example:"Uses of nitric acid: fertilisers such as ammonium nitrate, and explosives such as TNT / nitroglycerine."},{title:"Energy — Exothermic, Heat of Combustion, Energy Level Diagrams",tag:"Paper 2 · Q3",intro:"Read an energy level diagram like a graph: reactants up, products down, the drop is the heat given out.",points:["Exothermic: a reaction that gives out heat to the surroundings. The surroundings get hotter.","Heat of combustion: heat evolved when 1 mole of a substance burns completely in oxygen.","For 2CH₃OH + 3O₂ → 2CO₂ + 4H₂O, ΔH = −726 kJ/mol: reactants are higher than products; the drop is 726 kJ/mol.","The hump between them is the activation energy — the minimum energy needed to start the reaction.","q = mcΔT: mass of water (g) × 4.2 J/g/K × temperature rise. Here 200 × 4.2 × 25.4 = 21,336 J = 21.3 kJ evolved."],example:"Ag⁺ + Cl⁻ → AgCl, ΔH = −657 kJ/mol: exothermic, products lower in energy. 657 kJ is evolved per mole of AgCl formed."},{title:"Group I Alkali Metals — Rubidium",tag:"Paper 2 · Q4",intro:"Rubidium sits below potassium in Group I — so it is even more reactive. Predict from the trend, don't memorise in isolation.",points:["Storage: under kerosene / paraffin oil — it reacts vigorously with air / oxygen and with water, so air and moisture must be excluded.","Reactivity increases down Group I. Rubidium reacts more vigorously than potassium.","Other Group I elements: lithium, sodium, caesium, francium (any one is accepted).","Rubidium oxide is Rb₂O — a basic / alkaline oxide (it reacts with acids to form a salt + water).","Thermal decomposition: 2RbNO₃ → 2RbNO₂ + O₂. Extraction: electrolysis of molten rubidium chloride / molten rubidium hydroxide (fused RbCl)."],example:"Why not electrolysis of solution? Water would be discharged instead — the metal is too reactive. Use the molten salt."},{title:"Homologous Series — Alkanes vs Alkenes",tag:"Paper 2 · Q5",intro:"Same family, same functional group, each member differs by CH₂. Alkenes add across the double bond; alkanes do not.",points:["Homologous series: a family with the same general formula and functional group, differing by CH₂, with similar chemical properties and a gradation in physical properties.","C₂H₆ is an alkane; C₂H₄ is an alkene.","Addition: C₂H₄ + Cl₂ → C₂H₄Cl₂ (1,2-dichloroethane). The double bond opens and one Cl adds to each carbon.","Test: C₂H₄ decolourises bromine water / acidified KMnO₄; C₂H₆ does not.","Hydrogenation: C₂H₄ + H₂ → C₂H₆, with a nickel catalyst at 150–200 °C. It is an addition reaction."],example:"Large-scale use of ethene: manufacture of polythene / ethanol / ethanoic acid."},{title:"Titration — Pipette, Burette, Mean Titre, Mole Calculation",tag:"Paper 2 · Q6(a–d)",intro:"One titration, done carefully: approximate first, then accurate runs, then mean only the accurate titres.",points:["Transfer 25 cm³ of sodium carbonate with a pipette. Fill the acid into a burette.","Rinse the conical flask with distilled water only — never with the solution — so the number of moles is unchanged.","Titres: approximate 22.7 cm³, 1st accurate 22.6 cm³, 2nd accurate 22.6 cm³. Mean titre = (22.6 + 22.6) / 2 = 22.6 cm³. The approximate titre is not used in the mean.","Indicator: methyl orange. Colour change: yellow (in alkali) → orange / pink / orange-red (in acid) at the end point.","Equation: Na₂CO₃ + 2HNO₃ → 2NaNO₃ + CO₂ + H₂O. Mole ratio Na₂CO₃ : HNO₃ = 1 : 2."],example:"Moles HNO₃ = 0.02 × 22.6/1000 = 4.52 × 10⁻⁴ mol. Moles Na₂CO₃ = half = 2.26 × 10⁻⁴ mol in 25 cm³. Concentration = 2.26 × 10⁻⁴ × 1000/25 = 0.00904 mol/dm³."},{title:"Preparation & Collection of Gases — Dry CO₂, Sublimation",tag:"Paper 2 · Q6(e–g)",intro:"Choose the apparatus by the gas's properties — and keep safety equipment on.",points:["Dry CO₂: dilute nitric acid + solid sodium carbonate in a flat-bottom flask, thistle funnel, delivery tube, then through concentrated sulphuric acid (drying agent) in a second flask. Collect by downward delivery / upward displacement in a gas jar.","Equation: Na₂CO₃ + 2HNO₃ → 2NaNO₃ + CO₂ + H₂O.","Separation of NH₄Cl + NaCl: sublimation. Heat the mixture; NH₄Cl changes directly from solid to vapour and condenses on the cold surface (apparatus B — cold surface / inverted funnel / watch glass). NaCl remains behind.","Hand gloves protect hands from corrosive / harmful chemicals and heat.","Safety goggles protect eyes from splashes and harmful vapours."],example:"Why heat? NH₄Cl sublimes on heating and condenses on a cold surface. NaCl does not sublime, so it stays in the dish."},{title:"Qualitative Analysis — Flame Test, Precipitates, Anions & Cations",tag:"Paper 2 · Q7",intro:"Three salts, three tests each. Name the ion the observation proves — and the precipitate's formula.",points:["Salt A: golden / yellow flame → Na⁺ / sodium ions. Dilute HCl gives a gas smelling of burning matches (SO₂) → SO₃²⁻ / sulphite.","Salt B: NaOH gives a blue precipitate Cu(OH)₂ → Cu²⁺. BaCl₂ + dilute HCl gives a white precipitate BaSO₄ → SO₄²⁻ / sulphate.","Salt C: NaOH + warming gives a gas turning damp red litmus blue (NH₃) → NH₄⁺. Acidified AgNO₃ gives a white precipitate AgCl → Cl⁻ / chloride.","Identifications: A = sodium sulphite, Na₂SO₃. B = copper(II) sulphate, CuSO₄. C = ammonium chloride, NH₄Cl.","Collection methods: NH₃ — upward displacement / downward delivery (less dense than air, very soluble, not over water). SO₂ — upward displacement (denser than air, soluble). H₂ — downward displacement / over water (less dense, insoluble)."],example:"Standard solution check: mass weighed = 16.10 − 5.56 = 10.54 g. Amount = 10.54 / 106 (Mr of Na₂CO₃) = 0.0994 mol."},{title:"Standard Solutions — Mass Weighed, Moles = Mass / Mr",tag:"Paper 2 · Q7(f)",intro:"A standard solution has a known concentration. The whole calculation rests on one weighing.",points:["Weigh the solid by difference: mass = final balance reading − initial reading.","Here: 16.10 − 5.56 = 10.54 g of sodium carbonate weighed out.","Moles = mass / Mr. Mr(Na₂CO₃) = (2 × 23) + 12 + (3 × 16) = 106. So moles = 10.54 / 106 = 0.0994 mol.","Dissolve in distilled water, transfer to a volumetric flask, make up to the mark — that gives the standard solution.","If you know the volume, concentration = moles / volume in dm³. Keep units consistent: cm³ ÷ 1000 = dm³."],example:"Weighing by difference avoids losing solid on transfer — everything weighed is what goes into the flask."},{title:"Bonding — Ionic, Covalent, Metallic",tag:"Paper 2 · Q8 · Section C",intro:"Three kinds of bonding, three structures, three sets of properties. Learn one example of each really well.",points:["Ionic — e.g. NaCl: Na loses 1 electron, Cl gains 1 electron → Na⁺ Cl⁻. Strong electrostatic attraction gives a giant lattice, high melting point, conducts when molten or dissolved.","Covalent — e.g. CH₄ / H₂O: atoms share pairs of electrons. Dot-and-cross diagrams show the shared pairs. Simple molecules → low melting point, poor conductors.","Metallic — e.g. Mg / Fe: positive ions in a sea of delocalised electrons. The attraction holds the lattice together; the free electrons conduct electricity and let layers slide, so metals are malleable and ductile.","Compare: giant structures (ionic, metallic) are strong; simple covalent molecules are held together weakly between molecules.","In diagrams, label electrons clearly — dots for one atom, crosses for the other — and show charges on ions."],example:"NaCl conducts when molten because the ions are free to move; solid NaCl does not conduct because the ions are fixed in the lattice."},{title:"Industrial Chemistry — Conversions, NaOH, Uses",tag:"Paper 2 · Q9–Q10 · Section C",intro:"Section C is about making useful chemicals on a large scale: conditions, catalysts, and why the products matter.",points:["Ethanol → ethanoic acid: oxidising agent, acidified K₂Cr₂O₇ / KMnO₄, reflux — oxidation.","Methane → chloromethane: Cl₂, UV light — free-radical substitution.","Ethene → ethane: H₂, nickel catalyst — hydrogenation / addition.","Ethanoic acid → ethyl ethanoate: ethanol + concentrated H₂SO₄ catalyst, reflux — esterification.","NaOH — chlor-alkali / Castner–Kellner: electrolysis of concentrated brine (NaCl solution). At the cathode: H₂ + NaOH. At the anode: Cl₂. A diaphragm / membrane / mercury cell keeps the products apart."],example:"Large-scale uses of NaOH: soap / detergents, paper, textiles, aluminium extraction, petroleum refining, drain cleaner (any two)."}],gf=[{title:"Changes of State / Melting",tag:"Paper 1 · Q1 · Paper 2",intro:"Melting is a physical change: solid to liquid, same substance, no new chemical formed.",points:["Melting: solid → liquid on heating. Freezing is the reverse: liquid → solid on cooling.","Boiling / evaporation: liquid → gas. Condensation: gas → liquid.","Sublimation: solid → gas directly, without melting first.","During a change of state the temperature stays constant while the substance changes state.","Chemical change makes a new substance; physical change does not."],example:"Ice melting is physical: H₂O (solid) → H₂O (liquid). The particles gain energy and move more freely, but the substance stays water."},{title:"Compounds vs Mixtures",tag:"Paper 1 · Q2",intro:"A compound is chemically combined. A mixture is only physically mixed — and that one difference decides how each can be separated.",points:["Compound: two or more elements chemically combined in a fixed ratio, with new properties.","The constituents of a compound cannot be separated by physical methods such as filtration or evaporation.","The constituents of a compound can be separated only by chemical reactions.","Mixture: substances physically mixed, variable composition, each keeping its own properties.","A mixture can be separated by physical methods — filtration, evaporation, magnetism, distillation."],example:"Sodium chloride is a compound: Na and Cl lose their own properties. Salt + sand is a mixture: the sand can be filtered out."},{title:"Acidic Gases / Litmus / SO₂",tag:"Paper 1 · Q3",intro:"Damp blue litmus paper is a quick test for an acidic gas. Sulphur dioxide is the classic one to remember.",points:["Acidic gases turn damp blue litmus paper red.","SO₂ is an acidic gas: it dissolves in water to give an acidic solution.","SO₂ has a sharp, choking smell like burning matches.","Alkaline gases, such as ammonia, turn damp red litmus blue — the opposite test.","Neutral gases, such as oxygen and hydrogen, leave both litmus papers unchanged."],example:"Exam line: damp blue litmus turns red → acidic gas present, e.g. SO₂, CO₂ or HCl gas."},{title:"Neutrons / Mass Number",tag:"Paper 1 · Q4 · Paper 2 · Q1",intro:"Mass number, proton number and neutron number are linked by one subtraction. Never guess — calculate.",points:["Proton number = atomic number = number of protons in the atom.","Mass number = nucleon number = protons + neutrons.","Neutrons = Mass number − Atomic number.","Electrons in a neutral atom = protons = atomic number.","In an ion, electrons change: a positive ion has lost electrons, a negative ion has gained electrons."],example:"Element P: neutrons = mass number − atomic number. That subtraction is the whole question — use the exam key."},{title:"Metals Conduct / Free Electrons",tag:"Paper 1 · Q5",intro:"Metals conduct electricity because of their structure — a lattice of positive ions in a sea of free, mobile electrons.",points:["Metallic bonding: positive metal ions in a sea of delocalised (free, mobile) electrons.","The free electrons carry electric charge through the metal.","The same free electrons explain why metals are good conductors of heat.","Delocalised electrons also let layers of ions slide — so metals are malleable and ductile.","Non-metals such as sulphur and plastic have no free electrons, so they do not conduct."],example:"Exam line: metals conduct electricity because they have free mobile electrons."},{title:"Isotopy",tag:"Paper 1 · Q6",intro:"Isotopy: same element, same protons, different neutrons. One word answers a whole family of questions.",points:["Isotopes = atoms of the same element with the same atomic number but different mass numbers.","Same atomic number means the same number of protons and the same number of electrons.","Different mass numbers mean different numbers of neutrons.","Isotopes of an element have the same chemical properties, because chemistry depends on electrons.","Relative atomic mass is the weighted average of the masses of the isotopes."],example:"Chlorine-35 and chlorine-37: both have 17 protons; ³⁵Cl has 18 neutrons, ³⁷Cl has 20 neutrons."},{title:"Chemical vs Physical Change / Rusting",tag:"Paper 1 · Q7",intro:"Rusting is chemical. Melting, boiling and freezing are physical. Learn the test: is a new substance formed?",points:["Chemical change: new substance(s) formed, usually irreversible, with an energy change.","Physical change: no new substance — only a change of state, shape or size, usually reversible.","Rusting of iron: iron + oxygen + water → hydrated iron(III) oxide — a new substance, so it is chemical.","Melting, boiling and freezing are physical: the substance stays the same substance.","Other chemical changes: burning, neutralisation, precipitation, decomposition."],example:"Q-I-Q check: cross out melting, boiling and freezing first — the one left that makes a new substance is the chemical change."},{title:"Natural Water / Spring Water",tag:"Paper 1 · Q8",intro:"Rain water is clean, but the best natural source of good drinking water in the exam is spring water.",points:["Spring water comes from underground — it has been filtered naturally through soil and rock.","It is a good natural source of drinking water, though it still contains dissolved minerals.","Rain water is the cleanest natural water, but it is not collected as a supply in the same way.","Sea water is salty and river water carries mud, waste and germs — neither is good drinking water untreated.","Water for the laboratory is distilled water — pure water with dissolved substances removed."],example:"Exam line: natural source of good drinking water = spring (water)."},{title:"Conc. H₂SO₄ — Drying / Dehydrating",tag:"Paper 1 · Q9",intro:"Concentrated sulphuric acid is a powerful drying agent — but it only dries gases it does not react with.",points:["Concentrated H₂SO₄ removes water, so it is used as a drying agent for gases.","It is used in the preparation of pure, dry CO₂ — it dries the gas without reacting with it.","It cannot dry ammonia: it reacts with NH₃ (an alkaline gas) to form ammonium sulphate.","It cannot dry hydrogen sulphide either — it oxidises it.","Dehydrating is different: conc. H₂SO₄ removes the elements of water (H and O) from a compound, e.g. dehydrating ethanol to ethene."],example:"Dry CO₂: pass the gas through conc. H₂SO₄. Dry NH₃: use quicklime (CaO) instead."},{title:"MnO₂ Oxidising Agent / Chlorine Prep",tag:"Paper 1 · Q10 · Paper 2 · Q2(f)",intro:"Manganese(IV) oxide does not make the chlorine — it oxidises the chloride. Its function is oxidising agent.",points:["In the laboratory preparation of chlorine, MnO₂ is the oxidising agent.","It oxidises chloride ions to chlorine gas: 2Cl⁻ → Cl₂ + 2e⁻.","MnO₂ itself is reduced in the reaction.","Example equation: MnO₂ + 4HCl → MnCl₂ + Cl₂ + 2H₂O.","The chlorine is then washed (water removes HCl fumes) and dried before collection."],example:"Exam line: function of MnO₂ in the lab preparation of chlorine = it acts as an oxidising agent."},{title:"Oxides / Metal Extraction",tag:"Paper 1 · Q11",intro:"Many metals are extracted by reducing their oxides. Copper(II) oxide is the classic exam example.",points:["Metal ores are often metal oxides, e.g. Fe₂O₃ (iron ore) and CuO (copper ore).","Extraction = reduction: the oxide loses oxygen to give the metal.","CuO is used in the extraction of metals: CuO + C → Cu + CO (carbon is the reducing agent).","In iron extraction, carbon monoxide is the reducing agent: Fe₂O₃ + 3CO → 2Fe + 3CO₂.","Very reactive metals (Na, K, Ca, Al) are not extracted by reduction with carbon — they are extracted by electrolysis."],example:"Oxide used in extraction of metals = CuO. It is reduced to copper metal."},{title:"Empirical Formula / CH₃",tag:"Paper 1 · Q12",intro:"Empirical formula = the simplest whole-number ratio of atoms. Divide each mass by its RAM, then divide by the smallest.",points:["Step 1: divide each mass (or percentage) by its relative atomic mass to get moles.","Step 2: divide each mole value by the smallest mole value to get the ratio.","Step 3: if needed, multiply to get whole numbers.","Example: 80% C, 20% H → C: 80/12 = 6.67, H: 20/1 = 20. Ratio 6.67 : 20 = 1 : 3.","So the empirical formula is CH₃. The molecular formula could be a multiple, e.g. C₂H₆."],example:"80% C, 20% H → CH₃. Show the working: 80/12 = 6.67 and 20/1 = 20, ratio 1 : 3."}],yf=[{title:"Changes of State / Melting",tag:"Paper 1 · Q1 · Paper 2",intro:"Melting is a physical change: solid to liquid, same substance, no new chemical formed.",points:["Melting: solid → liquid on heating. Freezing is the reverse: liquid → solid on cooling.","Boiling / evaporation: liquid → gas. Condensation: gas → liquid.","Sublimation: solid → gas directly, without melting first.","During a change of state the temperature stays constant while the substance changes state.","Chemical change makes a new substance (for example, heating blue copper(II) sulphate until it turns white). Physical change does not."],example:"Ice melting is physical: H₂O (solid) → H₂O (liquid). The particles gain energy and move more freely, but the substance stays water."},{title:"NaOH Storage / Deliquescent",tag:"Paper 1 · Q2",intro:"Sodium hydroxide pellets are deliquescent — they pull water from the air until they dissolve in it.",points:["Deliquescent: a substance absorbs so much moisture from the air that it dissolves in the absorbed water.","NaOH also absorbs carbon dioxide from the air, forming sodium carbonate.","So NaOH pellets must be kept in a tightly closed container, away from air and moisture.","If left open, the pellets become wet, sticky, and eventually turn into a solution.","Sodium is also kept away from air and water — stored under paraffin oil (see Lecture 10)."],example:"Exam line: NaOH is stored tightly closed to prevent it turning to solution — it absorbs moisture and CO₂ from the air."},{title:"Titration / Neutralisation Calculations",tag:"Paper 1 · Q3",intro:"Neutralisation: acid + base → salt + water. The mole ratio in the equation controls the calculation.",points:["Moles = concentration (mol/dm³) × volume (dm³). Remember cm³ ÷ 1000 = dm³.","Example: 25 cm³ of 0.1 M Na₂CO₃ = 0.1 × 25/1000 = 0.0025 mol.","Equation: Na₂CO₃ + 2HCl → 2NaCl + CO₂ + H₂O. Mole ratio Na₂CO₃ : HCl = 1 : 2.","So moles HCl = 2 × 0.0025 = 0.005 mol in 25 cm³. Concentration = 0.005 × 1000/25 = 0.20 mol/dm³.","Always write the balanced equation first — the ratio is where most marks are lost."],example:"25 cm³ acid neutralises 25 cm³ of 0.1 M Na₂CO₃ → acid concentration = 0.20 mol/dm³."},{title:"Group I / Periodic Table",tag:"Paper 1 · Q4, Q23",intro:"Group I is the alkali metals: lithium, sodium, potassium, rubidium, caesium, francium.",points:["Group I metals have one electron in their outer shell. They lose it easily to form 1+ ions.","Reactivity increases down Group I: Li < Na < K < Rb < Cs.","Sodium belongs to Group I. Calcium and magnesium are Group II; aluminium is Group III.","Group I metals are stored under paraffin oil because they react with air and water.","Their oxides and hydroxides are basic / alkaline — they turn red litmus blue."],example:"Sodium + water → sodium hydroxide + hydrogen, a vigorous reaction that gets more vigorous down the group."},{title:"Allotropes of Sulphur / Plastic Sulphur",tag:"Paper 1 · Q5, Q39",intro:"Allotropes are different forms of the same element. Sulphur has crystalline and non-crystalline forms.",points:["Rhombic sulphur and monoclinic sulphur are crystalline allotropes — regular, ordered structures.","Plastic sulphur is the non-crystalline form — it has no regular crystal shape.","Plastic sulphur is made by heating sulphur until it melts and pouring the liquid into cold water.","It is soft, stretchy, and slowly turns back into rhombic sulphur on standing.","Sulphur is extracted by the Frasch process: superheated water melts underground sulphur, which is forced up by compressed air."],example:"Non-crystalline form of sulphur = plastic sulphur. If a question says “no regular shape”, think plastic sulphur."},{title:"Thermal Stability / Heating Salts",tag:"Paper 1 · Q6",intro:"Some salts break down on heating; others do not. Group I carbonates are the stable ones to remember.",points:["Most metal carbonates decompose on heating: e.g. CaCO₃ → CaO + CO₂.","Group I carbonates — sodium carbonate and potassium carbonate — are stable to heat: no observable change.","Group I nitrates decompose to nitrite + oxygen; most other nitrates give oxide + nitrogen dioxide + oxygen.","“No observable change when heated” usually points to a Group I carbonate.","Heating blue CuSO₄·5H₂O drives off water of crystallisation — a chemical change, not just drying."],example:"Potassium carbonate heated: no observable change. It is stable to heat, unlike calcium, zinc or copper(II) carbonate."},{title:"Ethanol + Sodium → Hydrogen",tag:"Paper 1 · Q7",intro:"Alcohols react with sodium like water does, but more gently — and the gas is still hydrogen.",points:["Ethanol + sodium → sodium ethoxide + hydrogen gas.","The hydrogen comes from the –OH group of the alcohol.","Test for hydrogen: it burns with a squeaky pop.","Adding sodium is also a test for an alcohol: effervescence / hydrogen evolved.","Water reacts more vigorously with sodium than ethanol does."],example:"Gas evolved when ethanol reacts with sodium = hydrogen (H₂)."},{title:"Redox / Q-I-Q Questions",tag:"Paper 1 · Q8 · Paper 2 · Q3",intro:"Redox = oxidation and reduction together. Learn all three definitions and check for a change in oxidation state.",points:["Oxidation: gain of oxygen / loss of hydrogen / loss of electrons. Reduction is the reverse.","Example: 4CoO + H₂ → Co + H₂O is redox — CoO loses oxygen, H₂ gains oxygen.","Neutralisation (acid + base) and precipitation (two salts making an insoluble solid) are NOT redox.","Reducing agent: the substance that causes reduction and is itself oxidised — e.g. carbon in 2CuO + C → 2Cu + CO₂.","Oxidising agent: the substance that causes oxidation and is itself reduced — e.g. CuO in CuO + H₂ → Cu + H₂O."],example:"In Q-I-Q style lists, cross out neutralisation and precipitation first — the one left with oxygen / hydrogen / electron transfer is the redox reaction."},{title:"Exothermic / Bond Energy",tag:"Paper 1 · Q9 · Paper 2",intro:"Exothermic reactions give out heat. Bond energy tells you why: forming bonds releases more energy than breaking bonds uses.",points:["Exothermic: reactants are higher in energy than products. The drop in energy is given out as heat.","Endothermic is the opposite: products higher, heat taken in from the surroundings.","Energy needed to break bonds (bond breaking) vs energy released when bonds form (bond forming).","Exothermic when bond-breaking energy < bond-forming energy — more energy comes out than goes in.","Energy level diagrams: reactants on the left, products on the right, the hump is activation energy."],example:"Exothermic checks: 1) Reactants higher energy than products. 4) Bond breaking energy less than bond forming energy."},{title:"Alkali Metals + Water",tag:"Paper 1 · Q10",intro:"Alkali metals + water → metal hydroxide (alkaline solution) + hydrogen. Reactivity increases down the group.",points:["Sodium + water → sodium hydroxide + hydrogen. The solution is alkaline.","Potassium reacts more vigorously than sodium — it may catch fire.","Copper does NOT react with water at room temperature to give an alkaline solution.","So “1 and 3 only” (sodium and potassium) is the classic answer pattern for this question type.","Test the solution: it turns red litmus blue and has pH greater than 7."],example:"Which react with water at room temperature to form an alkaline solution? Sodium and potassium — copper does not."},{title:"CO as Reducing Agent / Iron Extraction",tag:"Paper 1 · Q11, Q40",intro:"In the blast furnace, carbon monoxide is the reducing agent that turns iron ore into iron.",points:["Iron ore is mainly iron(III) oxide, Fe₂O₃. It must be reduced to iron metal.","Coke burns to CO₂, then CO₂ + C → 2CO. Carbon monoxide is the reducing agent.","Fe₂O₃ + 3CO → 2Fe + 3CO₂. CO removes oxygen from the ore — that is reduction.","Limestone removes impurities as slag. Hot air is blown in at the bottom.","CO is also used industrially as a reducing agent in other processes — remember “CO reduces”."],example:"Function of carbon monoxide in iron extraction: it acts as a reducing agent."},{title:"Isotopes / Halogens Group VII",tag:"Paper 1 · Q12, Q13 · Paper 2 · Q1–Q2",intro:"Isotopes: same element, same protons, different neutrons. Halogens: Group VII, seven outer electrons.",points:["Isotopes = atoms of the same element with different masses — same proton number, different neutron number / mass number.","Chlorine: ³⁵Cl and ³⁷Cl. RAM = (35 × 3 + 37 × 1) / 4 = 35.5 if the ratio is 3 : 1.","Halogens: fluorine, chlorine, bromine, iodine. They are in Group VII because they have seven electrons in the outer shell.","Reactivity decreases down Group VII: fluorine is the most reactive, iodine the least.","A more reactive halogen displaces a less reactive one from its salt — bromine displaces iodine, iodine cannot displace bromine."],example:"³⁷Cl: protons 17, neutrons 20 (37 − 17), electrons 17 in the neutral atom. That neutron count is how the mass number differs from ³⁵Cl."}],wf=[{section:"Section A · Answer ALL",title:"Q1 — Table: W, X, Y, Z",prompt:["Table: W — Atomic number 6, Mass number 12. X — Atomic number 9, Mass number 19. Y — Atomic number 11, Mass number 23. Z — Atomic number 16, Mass number 32.","a) How many electrons and neutrons are found in atom X?","b) Identify an atom of a metal from W, X, Y, Z.","c) Write the electronic configuration of Z.","d) Identify the bond type and the formula of the compound formed between W and X.","e) Y forms a basic oxide: (i) Write the formula of the oxide.  (ii) Write the equation to show the reaction of the oxide with water.","f) To which group of the Periodic Table would element Z be classified? Give an explanation."],answer:["a) Atom X: electrons = 9 (atomic number). Neutrons = 19 − 9 = 10.","b) Metal: Y — sodium, a Group I metal.","c) Electronic configuration of Z: 2,8,6 — Z is sulphur, atomic number 16.","d) W = carbon, X = fluorine. Bond type = covalent bonding. Formula = CF₄ — carbon tetrafluoride.","e) (i) Formula of the oxide: Na₂O — sodium oxide.  (ii) Na₂O + H₂O → 2NaOH.","f) Group VI. Explanation: 6 electrons in the outer shell / valence shell."]},{section:"Section A · Answer ALL",title:"Q2 — Group I: Na, Li, K, Cs",prompt:["Sodium (Na), Lithium (Li), Potassium (K) and Caesium (Cs) are found in Group I.","a) (i) State the common name given to this group of elements.  (ii) Why are the elements placed in the same group?","b) (i) How are they stored in the laboratory?  (ii) Explain why they are stored this way.","c) (i) Arrange the elements in order of reactivity, starting with the least reactive.  (ii) State one similarity in the reactivity of sodium and potassium with water.","d) (i) How is sodium extracted?  (ii) State one large-scale use of sodium metal.","e) Write balanced equations to show the effect of heat on: (i) KNO₃.  (ii) Na₂CO₃."],answer:["a) (i) Common name: alkali metals.  (ii) They are in the same group because they have the same number of electrons in the outer shell (1) and similar chemical properties.","b) (i) Stored under paraffin oil / kerosene.  (ii) They are reactive with air / moisture / water, so the oil prevents contact with air and water.","c) (i) Order of reactivity, least reactive first: Lithium, Sodium, Potassium, Caesium — Li < Na < K < Cs.  (ii) Similarity: both react vigorously with water to produce hydrogen gas and an alkaline solution, float and melt to a ball on the water surface.","d) (i) Sodium is extracted by electrolysis of molten / fused sodium chloride (Downs process, electrolysis of fused NaCl with CaCl₂).  (ii) One large-scale use: manufacture of sodium hydroxide / soap, sodium vapour lamps / street lights, coolant in nuclear reactors (any one).","e) (i) 2KNO₃ → 2KNO₂ + O₂ — a Group I nitrate gives a nitrite + oxygen on heating.  (ii) Na₂CO₃: no reaction / no decomposition — a Group I carbonate is stable to heat, Na₂CO₃ remains Na₂CO₃."]},{section:"Section A · Answer ALL",title:"Q3 — Organic: A CₙH₂ₙ, B CₙH₂ₙ₊₁COOH, C CₙH₂ₙ₊₂, D CₙH₂ₙ₊₁OH",prompt:["General formulae: A = CₙH₂ₙ, B = CₙH₂ₙ₊₁COOH, C = CₙH₂ₙ₊₂, D = CₙH₂ₙ₊₁OH.","a) Identify the homologous series to which A and D belong.","b) Give the formula of the third member of B and of C.","c) Give the reagent and reaction condition for the conversion of A to C.","d) Name the type of reaction that occurs in the conversion of D to B.","e) The second member of B reacts with the third member of D to produce a compound: (i) Name the compound and write the equation.  (ii) How can you easily identify this compound?  (iii) Identify the catalyst for this reaction.","f) Give a reagent that can be used to distinguish between A and C."],answer:["a) A = alkenes. D = alcohols / alkanols.","b) B: third member = C₂H₅COOH — propanoic acid, C₃H₆O₂ (first HCOOH, second CH₃COOH, third C₂H₅COOH). C: third member = C₃H₈ — propane (first CH₄, second C₂H₆, third C₃H₈).","c) Reagent: hydrogen, H₂. Condition: nickel catalyst, 150–200 °C (or platinum catalyst, room temperature). Reaction: CₙH₂ₙ + H₂ → CₙH₂ₙ₊₂ — hydrogenation.","d) Oxidation — an alcohol is oxidised to a carboxylic acid.","e) Second member of B = CH₃COOH (ethanoic acid). Third member of D = C₃H₇OH (propanol). (i) Compound: propyl ethanoate — propyl acetate, an ester. Equation: CH₃COOH + C₃H₇OH → CH₃COOC₃H₇ + H₂O.  (ii) Sweet, fruity smell / pleasant fruity smell.  (iii) Catalyst: concentrated sulphuric acid (conc. H₂SO₄).","f) Bromine water / aqueous bromine. A (alkene) decolourises bromine water; C (alkane) does NOT decolourise bromine water."]},{section:"Section A · Answer ALL",title:"Q4 — Acids and Bases",prompt:["a) Classify vinegar, soapy water, lemon juice and bitter leaf juice into acid / base.","b) State two physical properties of acids.","c) State the effect of lemon juice and soapy water on red litmus paper.","d) Sodium hydroxide reacts with sulphuric acid to form a salt and water only: (i) Name the reaction type.  (ii) Identify the salt formed.  (iii) Write the equation.  (iv) State how salt crystals can be obtained from the salt solution."],answer:["a) Acid: vinegar, lemon juice. Base: soapy water, bitter leaf juice.","b) Two physical properties of acids: sour taste, turn blue litmus red, corrosive, pH less than 7, conduct electricity in solution, react with metals to give H₂, react with carbonates to give CO₂ (any two).","c) Lemon juice (acid) on red litmus: no change / remains red. Soapy water (base) on red litmus: turns blue.","d) (i) Reaction type: neutralisation.  (ii) Salt formed: sodium sulphate, Na₂SO₄.  (iii) 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O.  (iv) Evaporation / evaporate to the crystallisation point, cool, filter, dry the crystals — crystallisation."]},{section:"Section A · Answer ALL",title:"Q5 — Electrolysis of Dilute NaCl with Copper Electrodes",prompt:["A dilute solution of sodium chloride is electrolysed using copper electrodes.","a) State one common observation at the cathode and anode.","b) Write the equation for the reaction at each electrode.","c) A steady current of 2 A is passed through the electrolyte for 1 hour 16 minutes: (i) Calculate the quantity of electricity in Coulombs.  (ii) Calculate the number of Faradays of electricity used.  (iii) What volume of gas will be liberated at the cathode at R.T.P.?"],answer:["a) Common observation: bubbles / gas evolved / effervescence at the electrodes.","b) Cathode: 2H⁺ + 2e⁻ → H₂ (or 2H₂O + 2e⁻ → H₂ + 2OH⁻). Anode: Cu → Cu²⁺ + 2e⁻ — the copper anode dissolves (with an inert anode: 2Cl⁻ → Cl₂ + 2e⁻).","c) (i) Q = It = 2 × (76 × 60) = 2 × 4560 = 9120 C.  (ii) Number of Faradays = 9120 / 96,500 = 0.0945 F (about 0.095 F).  (iii) Moles of electrons = 0.0945, moles of H₂ = 0.0945 / 2 = 0.04725 mol, volume = 0.04725 × 24,000 = 1134 cm³ (about 1134 cm³)."]},{section:"Section B · Answer ALL 2",title:"Q6 — Titration: NaOH vs Dilute HCl",prompt:["In order to determine the concentration of a dilute acid solution, a student is provided with: 0.25 M NaOH, dilute HCl, pipette, burette, conical flask, phenolphthalein indicator, clamp and stand.","a) Draw the experimental set-up you would use.","b) 25 cm³ of 0.25 M NaOH was transferred into a conical flask and 3 drops of phenolphthalein indicator were added: (i) Name the apparatus used to transfer the NaOH solution.  (ii) State the colour change in the conical flask.","c) Dilute acid is run from the burette into the conical flask, and two accurate results are recorded as burette diagrams: (i) Read and record the results in the table.  (ii) Determine the titre of the dilute hydrochloric acid used.  (iii) What will be the colour change to indicate the end of the experiment?  (iv) Calculate the concentration of the dilute HCl solution if 25 cm³ of 0.25 M NaOH was required.  (v) In carrying out this experiment the acid accidentally spilled on the student's hands. Advise the student on what should be done.","d) A graph drawn by the student using the result obtained for the reaction between zinc and dilute HCl(aq) shows volume of H₂ against time, with two curves A (upper, steeper) and B (lower, slower), both reaching the same final volume: (i) In two separate experiments zinc granules and powdered zinc were used. Which curve represents the result from the use of granulated zinc, and which curve represents powdered zinc?  (ii) Using your graph, determine the total volume of hydrogen gas collected at the end of the reaction.","e) Complete the table to show how you will separate these mixtures: ethanol and water; stones and grains / rice and stones."],answer:["a) Set-up: burette with dilute HCl, clamped on a stand, with a conical flask containing NaOH + phenolphthalein on a white tile below it. Label all parts: burette, dilute HCl, clamp and stand, conical flask, NaOH + phenolphthalein, white tile.","b) (i) Apparatus used to transfer the NaOH solution: pipette (25 cm³ pipette).  (ii) Colour change: pink to colourless — phenolphthalein is pink in alkali and colourless at the end point when the acid neutralises the alkali.","c) (i) Experiment 1: Final reading 16.0 cm³, Initial reading 0.0 cm³, Titre = 16.0 − 0.0 = 16.0 cm³. Experiment 2: Final reading 26.0 cm³, Initial reading 10.0 cm³, Titre = 26.0 − 10.0 = 16.0 cm³. Mean titre = 16.0 cm³.","c) (ii) Titre of the dilute hydrochloric acid used = 16.0 cm³ (the mean titre).","c) (iii) Colour change at the end: pink to colourless — phenolphthalein is pink in NaOH and becomes colourless when the acid neutralises the alkali.","c) (iv) NaOH + HCl → NaCl + H₂O (1 : 1). Moles NaOH = 0.25 × 25/1000 = 0.00625 mol. Moles HCl = 0.00625 mol. Concentration of HCl = 0.00625 × 1000 / 16.0 = 0.39 mol/dm³.","c) (v) Wash immediately with plenty of cold running water, do NOT rub, and report to the teacher / first aid. Do NOT neutralise the acid with concentrated alkali on the skin.","d) (i) Granulated zinc: Curve B — larger pieces, smaller surface area, slower rate. Powdered zinc: Curve A — smaller particles, larger surface area, faster rate, steeper curve.","d) (ii) Total volume of hydrogen gas collected at the end of the reaction: about 60 cm³ — both curves level off at the same total volume, because the same amount of zinc was used.","e) Ethanol and water: fractional distillation — different boiling points, ethanol 78 °C and water 100 °C, using a fractionating column; collect ethanol first. Stones and grains / rice and stones: hand picking — large solid pieces differing in size / colour, picked out by hand."]},{section:"Section B · Answer ALL 2",title:"Q7 — Chemical Composition of Three Unknown Substances A, B and X",prompt:["Determine the chemical composition of three unknown substances A, B and X. Study the table and complete the information.","(i) To 2 cm³ solution A added 5 drops NaOH(aq): state the observation and the inference.","(ii) To 2 cm³ solution A added 2 drops BaCl₂(aq) followed by dilute HCl(aq): state the observation and the inference.","(iii) To 2 cm³ solution B added 2 cm³ NaOH(aq): state the observation and the inference.","(iv) To 2 cm³ solution B added a few drops AgNO₃(aq) followed by dilute HNO₃(aq): state the observation and the inference.","(v) A solid sample of X strongly heated in a test tube / flame test: state the observation and the inference.","(vi) A solid sample of X strongly heated in a test tube: state the observation and the inference.","b) Give the chemical identity of A, B and X.","c) To determine the chemical formula of an oxide of copper, a student passed dry hydrogen gas through copper oxide in a porcelain boat in a hard glass tube. Results: Mass of empty boat = 14.6 g. Mass of boat + copper oxide sample before heating = 18.4 g. Mass of boat + copper at the end of the experiment = 17.6 g. Determine the empirical formula of the oxide of copper.","d) Why is it advisable to wear eye goggles when working in the laboratory?"],answer:["(i) Observation: a colourless pungent gas is evolved, and damp red litmus paper turns blue. Inference: presence of ammonium ion, NH₄⁺ — NH₃ gas, alkaline, turns red litmus blue.","(ii) Observation: a white precipitate is formed — BaSO₄, insoluble in dilute HCl. Inference: presence of SO₄²⁻ ions (given).","(iii) Observation: a dirty-green precipitate is formed. Inference: presence of iron(II) ion, Fe²⁺ — Fe(OH)₂, dirty-green.","(iv) Observation: a white precipitate is formed — AgCl, insoluble in dilute HNO₃. Inference: presence of chloride ion, Cl⁻.","(v) Observation: X gives a brick-red flame colour. Inference: presence of calcium ion, Ca²⁺.","(vi) Observation: a brown gas is evolved — NO₂. Inference: presence of nitrate ion, NO₃⁻.","b) A: ammonium sulphate, (NH₄)₂SO₄ — contains NH₄⁺ and SO₄²⁻. B: iron(II) chloride, FeCl₂ — contains Fe²⁺ and Cl⁻. X: calcium nitrate, Ca(NO₃)₂ — contains Ca²⁺ and NO₃⁻.","c) Mass of oxide = 18.4 − 14.6 = 3.8 g. Mass of copper = 17.6 − 14.6 = 3.0 g. Mass of oxygen = 3.8 − 3.0 = 0.8 g. Moles Cu = 3.0 / 64 = 0.0469 mol. Moles O = 0.8 / 16 = 0.05 mol. Ratio Cu : O = 0.0469 : 0.05 = about 1 : 1. Empirical formula = CuO — copper(II) oxide.","d) To protect the eyes from splashes of corrosive / harmful chemicals, flying glass / particles, and fumes."]},{section:"Section C · Answer ANY TWO questions",title:"Q8 — Concepts: Isomerism, Esterification, Polymorphism, Thermal Decomposition, Addition Polymerisation",prompt:["With the help of suitable examples and/or equations, explain the following concepts in chemistry:","a) Isomerism.","b) Esterification.","c) Polymorphism.","d) Thermal decomposition.","e) Addition polymerisation."],answer:["a) Isomerism: compounds with the same molecular formula but a different structural formula / arrangement of atoms. Example: C₄H₁₀ — butane, CH₃CH₂CH₂CH₃, and 2-methylpropane, CH₃CH(CH₃)CH₃. Example: C₂H₆O — ethanol, CH₃CH₂OH, and methoxymethane, CH₃–O–CH₃.","b) Esterification: reaction between an alcohol and a carboxylic acid to form an ester and water, catalyst concentrated sulphuric acid. Example: CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O — ethyl ethanoate.","c) Polymorphism: an element or compound exists in more than one crystalline form. Example: carbon — diamond and graphite. Sulphur — rhombic and monoclinic sulphur. CaCO₃ — calcite and aragonite.","d) Thermal decomposition: a compound breaks down on heating into simpler substances. Example: CaCO₃ → CaO + CO₂. Example: 2KClO₃ → 2KCl + 3O₂.","e) Addition polymerisation: many small unsaturated monomer molecules join together to form a large polymer molecule, with no by-product, as the double bond opens. Example: nC₂H₄ → (C₂H₄)ₙ — polyethene / polythene. Example: nC₃H₆ → polypropene."]},{section:"Section C · Answer ANY TWO questions",title:"Q9 — Extraction of Metals: Chemical and Electrolytic Reduction",prompt:["Chemical and electrolytic reduction are used in the extraction of metals.","For each method, choose a suitable example and describe how the metal is extracted from its ore."],answer:["Chemical reduction: example — iron. Ore: haematite, Fe₂O₃, in the blast furnace with coke and limestone, heated. Carbon / carbon monoxide reduces Fe₂O₃: Fe₂O₃ + 3CO → 2Fe + 3CO₂. Molten iron is tapped off, and slag formed from the limestone removes impurities.","Electrolytic reduction: example — aluminium. Ore: bauxite, Al₂O₃, dissolved in molten cryolite and electrolysed (Hall–Heroult process), graphite electrodes, high temperature: 2Al₂O₃ → 4Al + 3O₂. At the cathode: Al³⁺ + 3e⁻ → Al (molten aluminium tapped off). At the anode: 2O²⁻ → O₂ + 4e⁻."]},{section:"Section C · Answer ANY TWO questions",title:"Q10 — Bonding: Magnesium Chloride, Copper, Methane (d) and (e) only",prompt:["You are given the substances: magnesium chloride, copper, methane.","Note: Only parts (d) and (e) were sent for Q10. Parts (a)–(c) are not included here.","d) For each substance, identify the chemical bond holding the particles and describe how the bond is formed.","e) Give one physical property of each substance."],answer:["d) Magnesium chloride, MgCl₂: ionic / electrovalent bond. A magnesium atom loses 2 outer electrons → Mg²⁺, and two chlorine atoms each gain 1 electron → 2Cl⁻. Electrostatic attraction between Mg²⁺ and 2Cl⁻ holds them together: Mg + 2Cl → Mg²⁺ + 2Cl⁻ → MgCl₂.","d) Copper, Cu: metallic bond. Copper atoms lose outer electrons to form positive ions in a sea of delocalised electrons. Electrostatic attraction between the Cu⁺ ions and the delocalised electrons holds the metal together, and gives malleability and conductivity.","d) Methane, CH₄: covalent bond. A carbon atom shares its 4 outer electrons with 4 hydrogen atoms, and each hydrogen shares its 1 electron. Carbon attains an octet, each hydrogen attains a duplet, with 4 single covalent bonds: CH₄.","e) Magnesium chloride: white crystalline solid, high melting point, soluble in water, conducts electricity when molten or dissolved, not when solid.","e) Copper: hard, malleable, ductile, shiny, high melting point, good conductor of heat and electricity.","e) Methane: colourless gas, low melting / boiling point, insoluble in water, does not conduct electricity."]}],Cf=[{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q1 — Table A–E: Electronic Configuration",prompt:["Table A–E (letters are NOT the usual symbols): A has electronic configuration 2,8,1. B has atomic number 12. C has electronic configuration 2,8,4. D has atomic number 18. E has atomic number 17.","a) i) State the atomic number of C.  ii) Give the electronic configuration of D.  iii) Give the electronic configuration of the ion of B.","b) Which element does not form compounds? Explain why.","c) i) Which element is a halogen?  ii) Write the balanced equation for the reaction of hydrogen with halogen E.","d) i) Give the formula of the compound formed between B and E.  ii) State the bond type in that compound."],answer:["a) i) Atomic number of C = 14 — configuration 2,8,4 adds to 14.  ii) Electronic configuration of D = 2,8,8 — atomic number 18.  iii) Electronic configuration of the ion of B = 2,8 — B is Mg (2,8,2), Mg²⁺ loses 2 electrons.","b) Element that does not form compounds: D — argon, a noble gas, with a full outer shell (2,8,8), so it is stable.","c) i) Halogen: E — chlorine, Group VII.  ii) Balanced equation: H₂ + Cl₂ → 2HCl.","d) i) Formula of the compound of B and E: MgCl₂ — Mg²⁺ + 2Cl⁻.  ii) Bond type: ionic bonding."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q2 — Metals: Cu, Na, Mg, K, Fe, Zn",prompt:["Metals given: copper, sodium, magnesium, potassium, iron, zinc.","a) i) Which metal dissolves in cold water to form an alkali?  ii) Which metal forms a blue hydrated compound?  iii) Which metal's ions cause hardness in water?  iv) Which metal is used as a catalyst?","b) i) State the method by which copper is extracted.  ii) Name the main ore of copper.  iii) Write the balanced equation for the main process.","c) State two uses of copper, each related to a property."],answer:["a) i) Dissolves in cold water to form an alkali: sodium (Na) — 2Na + 2H₂O → 2NaOH + H₂ (potassium also does this).  ii) Forms a blue hydrated compound: copper — CuSO₄·5H₂O, blue.  iii) Ions cause hardness in water: magnesium — Mg²⁺ (with Ca²⁺).  iv) Used as a catalyst: iron — Fe, Haber process.","b) i) Method copper is extracted: roasting / smelting / thermal reduction — roast the sulphide ore, then reduce the oxide with carbon.  ii) Main ore: chalcopyrite, CuFeS₂ / copper pyrites (also malachite).  iii) Balanced equation for the main process: Cu₂S + O₂ → 2Cu + SO₂ (or 2CuO + C → 2Cu + CO₂).","c) Two uses of copper related to properties: electrical wires — good conductor of electricity. Cooking utensils / pipes — good conductor of heat, ductile, corrosion resistant."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q3 — Electrolysis: Current, Faradays & Electroplating",prompt:["A current of 2.5 A is passed through a solution of a salt of element X for one hour. X is deposited at the cathode.","a) i) Is X a metal or a non-metal?  ii) Give a reason for your answer.","b) Calculate: i) the quantity of electricity passed,  ii) the number of Faradays passed.","c) If 10.8 g of X is collected, calculate the number of moles of X (RMM of X = 108, silver Ag).","d) Describe how to electroplate an iron spoon with silver. Draw and label the set-up."],answer:["a) i) X is a metal.  ii) Reason: metals form positive ions, which are discharged / reduced at the cathode and deposited as metal.","b) i) Quantity of electricity: Q = I × t = 2.5 × 3600 = 9000 C.  ii) Number of Faradays: 9000 / 96,500 = 0.093 F.","c) Moles of X = 10.8 / 108 = 0.1 mol (RMM of X = 108, silver, Ag).","d) Electroplate an iron spoon with silver: spoon as cathode (negative), silver as anode (positive), electrolyte silver nitrate, AgNO₃, solution, battery. Ag⁺ ions are discharged on the spoon and silver coats the spoon. Draw and label: spoon (cathode), silver (anode), AgNO₃ electrolyte, battery."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q4 — Nitric Acid: NaNO₃ + Conc. H₂SO₄",prompt:["Nitric acid is prepared by heating sodium nitrate with concentrated sulphuric acid in a retort over a sand-bath. It is collected in a receiver as a yellow liquid.","a) Write the balanced equation for the reaction in the flask.","b) State one precaution taken during the preparation and explain why it is needed.","c) i) Why is the nitric acid collected yellow instead of colourless?  ii) How can the acid be purified?"],answer:["a) Balanced equation in the flask: NaNO₃ + H₂SO₄ → NaHSO₄ + HNO₃ (or 2NaNO₃ + H₂SO₄ → Na₂SO₄ + 2HNO₃).","b) Precaution: do NOT heat strongly / use a sand-bath, heat gently, use a fume cupboard, wear gloves / goggles. Explanation: strong heating decomposes HNO₃ to NO₂ + O₂ + H₂O, reducing the yield; NO₂ is poisonous and the acid is corrosive.","c) i) Nitric acid is collected yellow because of dissolved nitrogen dioxide, NO₂, from decomposition — NO₂ gives the yellow colour.  ii) Purify the acid: bubble
