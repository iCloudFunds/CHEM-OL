hydrogen. What is its empirical formula?",options:["CH₂","CH","C₂H₃","CH₃"],answer:0,explanation:"A — CH₂. C: 85.7/12 = 7.14, H: 14.3/1 = 14.3, ratio 1 : 2."},{q:"A few drops of silver nitrate give a yellow precipitate. Which anion is present?",options:["Chloride ion","Bromide ion","Iodide ion","Sulphate ion"],answer:2,explanation:"C — Iodide ion. AgI is a yellow precipitate."},{q:"What is the function of super-heated water in the extraction of sulphur (Frasch process)?",options:["To melt sulphur","To cool sulphur","To dissolve sulphur","To oxidise sulphur"],answer:0,explanation:"A — To melt sulphur. The Frasch process uses super-heated water to melt underground sulphur."},{q:"From the equation Ca + 2H₂O → Ca(OH)₂ + H₂, which is the oxidising agent?",options:["Calcium","Hydrogen","Calcium hydroxide","Water, H₂O"],answer:3,explanation:"D — H₂O. Water oxidises calcium: Ca loses electrons, water is the oxidising agent."},{q:"Which pair X and Y can be separated by fractional distillation?",options:["Ethanol and petrol","Salt and water","Sand and water","Iron and sulphur"],answer:0,explanation:"A — Ethanol and petrol. They are miscible liquids with different boiling points."},{q:"Which property of X and Y makes fractional distillation suitable for separating them?",options:["Difference in colour","Difference in boiling points","Difference in density","Difference in solubility"],answer:1,explanation:"B — Difference in boiling points. Fractional distillation separates miscible liquids with different boiling points."},{q:"Which shows Ca, Fe, Na and Zn in order of increasing reactivity?",options:["Sodium, Calcium, Iron, Zinc","Zinc, Iron, Calcium, Sodium","Iron, Zinc, Sodium, Calcium","Calcium, Zinc, Iron, Sodium"],answer:1,explanation:"B — Zinc, Iron, Calcium, Sodium. Reactivity increases in that order."},{q:"Statement 1: Alkali metals are very good reducing agents. Statement 2: Alkali metals are easily oxidised.",options:["Both statements True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:0,explanation:"A — Both statements True, second is correct explanation. Alkali metals are easily oxidised, and a reducing agent is oxidised."},{q:"Statement 1: C₂H₆ and C₄H₁₀ have the same percentage by mass of H and C. Statement 2: Both are alkanes with the general formula CₙH₂ₙ₊₂.",options:["Both True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:0,explanation:"A — Both True, second is correct explanation. Both are alkanes, CₙH₂ₙ₊₂, so they have the same percentage composition."},{q:"Statement 1: Acid / base indicators are dyes. Statement 2: Indicators change colour only in strong alkali.",options:["Both True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:2,explanation:"C — First True, second False. Indicators are dyes, but they change colour in acid or alkali, not only in strong alkali."},{q:"Which carbonate is stable on heating?",options:["Calcium carbonate","Sodium carbonate","Zinc carbonate","Copper(II) carbonate"],answer:1,explanation:"B — Sodium carbonate. Group I carbonates are stable to heat."},{q:"Which substance decolourises bromine water?",options:["Ethene","Ethane","Methane","Propane"],answer:0,explanation:"A — Ethene. Ethene is an alkene — its double bond decolourises bromine water. Alkanes do not."},{q:"In an energy level diagram, the products are higher in energy than the reactants. What is the heat change?",options:["Heat is absorbed during the reaction","Heat is given out during the reaction","There is no heat change","Heat is absorbed then given out"],answer:0,explanation:"A — Heat is absorbed during the reaction. Products higher than reactants means the reaction is endothermic."},{q:"For an equilibrium where the forward reaction makes more gas moles, what is the effect of increasing the pressure?",options:["Equilibrium shifts to the left","Equilibrium shifts to the right","Equilibrium does not move","The reaction stops"],answer:0,explanation:"A — Equilibrium shifts to the left. Increased pressure favours the side with fewer gas moles."},{q:"What is the percentage of oxygen in air?",options:["78%","21%","1%","0.04%"],answer:1,explanation:"B — 21%. Air is about 78% nitrogen and 21% oxygen."},{q:"What is the percentage of nitrogen in ammonium phosphate, (NH₄)₃PO₄, RMM = 149?",options:["28.2%","21.2%","35%","14%"],answer:0,explanation:"A — 28.2%. 42/149 × 100 = 28.2%."},{q:"Which substances are allotropes? 1) Carbon  2) Sulphur  3) Phosphorus  4) Calcium carbonate",options:["1 and 2 only","1, 2 and 3 are correct","2 and 3 only","1, 2, 3 and 4 are correct"],answer:1,explanation:"B — 1, 2 and 3 are correct. Carbon, sulphur and phosphorus have allotropes. Calcium carbonate is not an allotrope."},{q:"Which are properties of transition metals? 1) Form coloured compounds  2) Malleable and ductile  3) Variable oxidation states",options:["1 and 2 only","1, 2 and 3 are correct","2 and 3 only","1 and 3 only"],answer:1,explanation:"B — 1, 2 and 3 are correct. Transition metals form coloured compounds, are malleable and ductile, and have variable oxidation states."},{q:"Substance X reacts with dilute H₂SO₄ to produce CuSO₄. Which could X be? 1) Copper metal  2) Copper oxide  3) Copper chloride  4) Copper carbonate",options:["1 and 2 are correct","1 and 3 are correct","2 and 4 are correct","3 and 4 are correct"],answer:2,explanation:"C — 2 and 4 are correct. Copper oxide and copper carbonate react with dilute H₂SO₄ to give CuSO₄. Copper metal does not react with dilute H₂SO₄."},{q:"Powdering marble chips increases the rate of reaction because…",options:["Total surface area increases","Concentration increases","Temperature increases","Pressure increases"],answer:0,explanation:"A — Total surface area increases. More surface is exposed, so there are more collisions."},{q:"Which is a reduction reaction?",options:["HCl + NaOH → NaCl + H₂O","CaCO₃ → CaO + CO₂","CuO + H₂ → Cu + H₂O","CH₄ + 2O₂ → CO₂ + 2H₂O"],answer:2,explanation:"C — CuO + H₂ → Cu + H₂O. CuO is reduced to Cu (it loses oxygen)."},{q:"Chlorine is collected by…",options:["Downward delivery","Over water","Upward delivery","Downward displacement over water"],answer:0,explanation:"A — Downward delivery. Cl₂ is denser than air, so it is collected by upward displacement of air (downward delivery)."},{q:"25 cm³ of 0.1 M NaOH exactly neutralised 20 cm³ of dilute H₂SO₄. What is the concentration of H₂SO₄?",options:["0.025 M","0.05 M","0.125 M","0.0625 M"],answer:3,explanation:"D — 0.0625 M. 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O. Moles NaOH = 0.0025, moles acid = 0.00125, concentration = 0.00125 / 0.020 = 0.0625 M."},{q:"In the reaction 2H₂S + SO₂ → 2H₂O + 3S, which is the oxidising agent?",options:["H₂S","SO₂","H₂O","S"],answer:1,explanation:"B — SO₂. SO₂ oxidises H₂S."},{q:"A mixture is…",options:["A substance that contains one substance only","A substance that contains two or more substances not chemically combined through bond formation","A compound","An element"],answer:1,explanation:"B — A substance that contains two or more substances not chemically combined through bond formation."},{q:"Elements A (atomic number 12) and B (atomic number 16) combine. What type of bonding is in the compound?",options:["Covalent bonding","Metallic bonding","Hydrogen bonding","Ionic bonding"],answer:3,explanation:"D — Ionic bonding. Mg + S → MgS, ionic."},{q:"Which pair of electronic configurations are in the same period?",options:["2,8,2 and 2,8,3","2,8,1 and 2,8","2,8,3 and 2,7","2,8,2 and 2,8,8,2"],answer:0,explanation:"A — 2,8,2 and 2,8,3. Both have 3 shells, so both are in Period 3."},{q:"Gas A is dried with drying agent B and collected by downward displacement. Gas A is…",options:["Carbon dioxide","Ammonia, NH₃","Sulphur dioxide","Chlorine"],answer:1,explanation:"B — NH₃. Ammonia is less dense than air and is collected by downward displacement."},{q:"Drying agent B (used to dry ammonia) is…",options:["Quicklime, CaO","Concentrated sulphuric acid","Calcium chloride","Silica gel"],answer:0,explanation:"A — Quicklime. CaO dries NH₃. Concentrated sulphuric acid and calcium chloride react with ammonia."},{q:"Which is the balanced equation?",options:["Fe + H₂O → FeO + H₂","2Fe + 3H₂O → Fe₂O₃ + 3H₂","3Fe + 4H₂O → Fe₃O₄ + 4H₂","Fe + 2H₂O → Fe(OH)₂ + H₂"],answer:2,explanation:"C — 3Fe + 4H₂O → Fe₃O₄ + 4H₂. This equation is balanced."},{q:"A salt exposed to air forms a solution. The salt is…",options:["Deliquescent","Efflorescent","Hygroscopic","Anhydrous"],answer:0,explanation:"A — Deliquescent. A deliquescent salt absorbs moisture from the air and dissolves in it."},{q:"A graph of volume of gas against time shows three curves X, Y and Z. Which reaction is the fastest?",options:["Y","X","Z","All are the same"],answer:0,explanation:"A — Y. Y is the steepest curve, so it is the fastest reaction."},{q:"On the same rate graph, which curve shows the lowest concentration of acid?",options:["X","Y","Z","Cannot tell"],answer:2,explanation:"C — Z. Z is the shallowest curve, the slowest reaction, so it has the lowest concentration."},{q:"What is the product of hexane-1,6-diamine and hexanedioic acid?",options:["Terylene","Polythene","PVC","Nylon 6,6"],answer:3,explanation:"D — Nylon 6,6. A condensation polymer from the two 6-carbon monomers."},{q:"What gas is given off when a metal nitrate is heated?",options:["Oxygen","Nitrogen dioxide, NO₂","Ammonia","Carbon dioxide"],answer:1,explanation:"B — NO₂. A metal nitrate heated gives NO₂ + O₂ + metal oxide."},{q:"A current of 2 A flows for 90 minutes. What quantity of electricity is passed?",options:["180 C","3600 C","5400 C","10800 C"],answer:3,explanation:"D — 10800 C. Q = 2 × 5400 = 10800 C."},{q:"What is the charge on a proton?",options:["Negative","Neutral","Positive","No charge"],answer:2,explanation:"C — Positive. A proton carries a positive charge."},{q:"What is the change of state called when a solid changes to a liquid?",options:["Freezing","Melting","Sublimation","Condensation"],answer:1,explanation:"B — Melting. Solid → liquid is melting."}],Nf=[{q:"Which metal is extracted by thermal reduction?",options:["Sodium","Copper","Aluminium","Calcium"],answer:1,explanation:"B — Copper. CuO + C → Cu + CO. Copper is extracted by thermal reduction."},{q:"Oxidation can be defined as…",options:["Loss of electrons","Gain of electrons","Loss of oxygen","Gain of hydrogen"],answer:0,explanation:"A — Loss of electrons. Oxidation is loss of electrons (OIL RIG)."},{q:"What is the change of state called when a solid changes directly to a gas?",options:["Sublimation","Melting","Condensation","Freezing"],answer:0,explanation:"A — Sublimation. Solid → gas directly, without melting first."},{q:"What is the main component of inactive air?",options:["Oxygen","Nitrogen","Carbon dioxide","Argon"],answer:1,explanation:"B — Nitrogen. Nitrogen is about 78% of air and is the inactive part."},{q:"Which species is an isotope of ¹⁷³⁵X?",options:["¹⁷³⁷X","¹⁸³⁵X","¹⁶³⁵X","¹⁷³⁴X"],answer:0,explanation:"A — ¹⁷³⁷X. Same protons (17), different neutrons — an isotope."},{q:"Hydrogen is collected by upward delivery because…",options:["It is soluble in water","It is denser than air","It is lighter than air","It is acidic"],answer:2,explanation:"C — It is lighter than air. Hydrogen rises, so it is collected by upward delivery."},{q:"Which anion forms a precipitate with barium ion in acid medium?",options:["Chloride ion","Sulphate ion","Nitrate ion","Hydroxide ion"],answer:1,explanation:"B — Sulphate ion. BaSO₄ is white and insoluble in acid."},{q:"How many molecules are in 4.5 g of water?",options:["6.02 × 10²³","3.01 × 10²³","6.02 × 10²²","1.5 × 10²³"],answer:3,explanation:"D — 1.5 × 10²³. 4.5/18 = 0.25 mol × 6.02 × 10²³ = 1.5 × 10²³."},{q:"Which gas naturally makes rain water slightly acidic?",options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],answer:1,explanation:"B — Carbon dioxide. CO₂ + H₂O → carbonic acid."},{q:"Select the dibasic acid.",options:["HCl","H₂SO₄","HNO₃","CH₃COOH"],answer:1,explanation:"B — H₂SO₄. It gives 2 H⁺ ions per molecule."},{q:"How many neutrons are in an atom of argon-40, ¹⁸⁴⁰Ar?",options:["18","40","22","58"],answer:2,explanation:"C — 22. Neutrons = 40 − 18 = 22."},{q:"The rate of reaction between CaCO₃ and HCl can be increased by…",options:["Decreasing the temperature","Increasing the temperature","Using larger lumps of CaCO₃","Decreasing the concentration of HCl"],answer:1,explanation:"B — Increasing the temperature. Particles gain energy, so there are more successful collisions. (Grinding also increases the rate.)"},{q:"Which salt gives a brick-red flame?",options:["CaCO₃","NaCl","CuSO₄","ZnCO₃"],answer:0,explanation:"A — CaCO₃. Ca²⁺ gives a brick-red flame."},{q:"Solid S is heated. The gas given off turns limewater milky. What is solid S?",options:["Sodium chloride","Copper(II) oxide","Zinc carbonate","Calcium carbonate"],answer:3,explanation:"D — Calcium carbonate. CaCO₃ → CaO + CO₂, and CO₂ turns limewater milky."},{q:"Why does limewater turn milky when CO₂ is passed through it?",options:["A gas is formed","An insoluble solid is formed","A soluble salt is formed","Water is formed"],answer:1,explanation:"B — An insoluble solid is formed. CaCO₃ precipitate makes the limewater milky."},{q:"Compound X decolourises bromine water. X could be…",options:["C₂H₄","C₂H₆","CH₄","C₃H₈"],answer:0,explanation:"A — C₂H₄. Ethene is an alkene — its double bond decolourises bromine water."},{q:"Which pair have the same number of particles?",options:["1 mole of water and 40 g of NaOH","1 mole of water and 23 g of Na","2 moles of water and 40 g of NaOH","1 mole of water and 80 g of NaOH"],answer:0,explanation:"A — 1 mole of water and 40 g of NaOH. 40 g of NaOH = 1 mole, so both have 6.02 × 10²³ particles."},{q:"What is the colour change when phenolphthalein is added to NaOH?",options:["Pink to colourless","Colourless to colourless","Colourless to pink","Pink to pink"],answer:2,explanation:"C — Colourless to pink. Phenolphthalein is pink in alkali."},{q:"How much heat is evolved when 2.9 g of C₃H₈ is completely burnt? (Heat of combustion = 1410 kJ/mol; C₃H₈ = 44)",options:["1410 kJ","46 kJ","93 kJ","2210 kJ"],answer:2,explanation:"C — 93 kJ. 2.9/44 = 0.0659 mol × 1410 kJ/mol = 93 kJ."},{q:"Which apparatus is used to measure the temperature of a liquid in the laboratory?",options:["Burette","Thermometer","Pipette","Balance"],answer:1,explanation:"B — Thermometer. It measures temperature."},{q:"What is a common use of ammonium sulphate?",options:["A bleach","A drying agent","A fertiliser","A fuel"],answer:2,explanation:"C — A fertiliser. Ammonium sulphate supplies nitrogen to plants."},{q:"Decane → octane + ethene. What is process P?",options:["Hydrogenation","Cracking","Esterification","Neutralisation"],answer:1,explanation:"B — Cracking. A long-chain alkane is broken into a shorter alkane + an alkene."},{q:"Identify compound X in the diagram (C₂H₄).",options:["Ethene","Ethane","Ethanol","Ethanoic acid"],answer:0,explanation:"A — Ethene. C₂H₄ is ethene, an alkene with a double bond."},{q:"For N₂ + 3H₂ ⇌ 2NH₃, which change increases the yield of NH₃?",options:["Decreasing pressure","Increasing temperature","Adding a catalyst","Increasing pressure"],answer:3,explanation:"D — Increasing pressure. There are fewer moles on the right, so higher pressure shifts equilibrium right."},{q:"Which metal is used to make kitchen utensils, and in alloy form in the construction of aircraft?",options:["Iron","Copper","Aluminium","Zinc"],answer:2,explanation:"C — Al. Aluminium utensils; duralumin (aluminium alloy) for aircraft."},{q:"A graph of volume against 1/P is a straight line. Which law is represented?",options:["Charles's law","Avogadro's law","Boyle's law","Dalton's law"],answer:2,explanation:"C — Boyle's law. Volume is inversely proportional to pressure at constant temperature."},{q:"Aqueous CuSO₄ is electrolysed with graphite electrodes. What is observed at the cathode?",options:["Cathode decreases in size","Cathode increases in size","Gas bubbles at the cathode","Cathode dissolves"],answer:1,explanation:"B — Cathode increases in size. Copper is deposited: Cu²⁺ + 2e⁻ → Cu."},{q:"CO₂ is heavier than air. How is it collected in the laboratory?",options:["Upward delivery","Over water","Downward delivery","Downward displacement over water"],answer:0,explanation:"A — Upward delivery. CO₂ is denser than air, so it is collected by upward displacement of air."},{q:"Which are decomposed on heating? 1) CaCO₃  2) Ca(HCO₃)₂  3) NaHCO₃",options:["1 only","1, 2 and 3 are correct","2 and 3 only","1 and 2 only"],answer:1,explanation:"B — 1, 2 and 3 are correct. CaCO₃, Ca(HCO₃)₂ and NaHCO₃ all decompose on heating."},{q:"Consider: 1) Sodium gains one electron. 2) Chlorine gains one electron. 3) Sodium and chloride ions are formed.",options:["1 True, 2 False, 3 False","1 False, 2 True, 3 True","1 True, 2 True, 3 False","1 False, 2 False, 3 True"],answer:1,explanation:"B — 1 False, 2 True, 3 True. Sodium loses one electron; chlorine gains one electron; Na⁺ and Cl⁻ are formed."},{q:"Which industrial processes use electrolysis? 1) Electroplating  2) Manufacture of NaOH  3) Extraction of Al  4) Extraction of Cu",options:["All are correct","1 and 2 only","3 and 4 only","1, 2 and 3 only"],answer:0,explanation:"A — All are correct. Electroplating, manufacture of NaOH, extraction of Al and extraction of Cu all use electrolysis."},{q:"Which is one common property of metals?",options:["They are insulators","They are brittle","They are gases at room temperature","They conduct electricity and are malleable"],answer:3,explanation:"D — They conduct electricity and are malleable."},{q:"Compound X gives a golden-yellow flame. X could be…",options:["CaCO₃","CuSO₄","Na₂SO₄","ZnCO₃"],answer:2,explanation:"C — Na₂SO₄. Na⁺ gives a golden-yellow flame."},{q:"What is the molar mass of ammonium nitrate, NH₄NO₃?",options:["48 g/mol","64 g/mol","132 g/mol","80 g/mol"],answer:3,explanation:"D — 80 g/mol. NH₄NO₃ = 14 + 4 + 14 + 48 = 80."},{q:"In the Mg + dilute HCl set-up, there is a gradual loss in mass because…",options:["Water evaporates","Mg dissolves","HCl evaporates","H₂ escapes"],answer:3,explanation:"D — H₂ escapes. Hydrogen gas escapes from the apparatus."},{q:"Why is dilute sulphuric acid not suitable for this experiment with CaCO₃?",options:["Sulphuric acid forms an insoluble salt","Sulphuric acid is too weak","Sulphuric acid is too strong","Sulphuric acid evaporates"],answer:0,explanation:"A — Sulphuric acid forms an insoluble salt. CaSO₄ coats the CaCO₃ and stops the reaction."},{q:"Which substance forms a white precipitate with aqueous Na₂SO₄?",options:["NaCl","BaCl₂","KCl","NH₄Cl"],answer:1,explanation:"B — BaCl₂. Ba²⁺ + SO₄²⁻ → BaSO₄, white precipitate."},{q:"Why is SO₃ not dissolved directly in water in the manufacture of H₂SO₄?",options:["It does not dissolve","It is too expensive","Reaction is violent and highly exothermic","It forms a solid"],answer:2,explanation:"C — Reaction is violent and highly exothermic. It forms a mist. SO₃ is dissolved in concentrated acid to form oleum instead."},{q:"20 cm³ of 0.1 M NaOH neutralises 25 cm³ of dilute HCl. What is the molarity of the HCl?",options:["0.1 M","0.2 M","0.08 M","0.125 M"],answer:2,explanation:"C — 0.08 M. Moles NaOH = 0.002, moles HCl = 0.002, concentration = 0.002 / 0.025 = 0.08 M."},{q:"W has electronic configuration 2,8,1 and V has 2,8,6. What is the formula of the compound of W and V?",options:["W₂V","WV₂","WV","W₂V₃"],answer:0,explanation:"A — W₂V. W is sodium (Na⁺) and V is sulphur (S²⁻), so the compound is Na₂S."},{q:"What is the equation for the reaction between hydrogen and V (sulphur)?",options:["H₂ + V → HV","H₂ + V → H₂V₂","H₂ + V → H₂V","2H₂ + V → H₄V"],answer:2,explanation:"C — H₂ + V → H₂V. H₂ + S → H₂S."},{q:"Which compound evolves white fumes with PCl₅?",options:["C₂H₅OH","C₂H₆","C₂H₄","CH₄"],answer:0,explanation:"A — C₂H₅OH. An alcohol + PCl₅ → HCl white fumes."},{q:"Which is a mixture?",options:["Sodium chloride","Distilled water","Sea water","Copper(II) sulphate"],answer:2,explanation:"C — Sea water. It contains dissolved salts and other substances not chemically combined."},{q:"A hydrocarbon contains 0.75 g of carbon and 0.25 g of hydrogen. What is its empirical formula?",options:["CH","CH₂","CH₃","CH₄"],answer:3,explanation:"D — CH₄. C: 0.75/12 = 0.0625, H: 0.25/1 = 0.25, ratio 1 : 4."},{q:"Statement 1: 1 mole of carbon = 6.02 × 10²³ atoms. Statement 2: The amount of substance of 6.02 × 10²³ atoms of carbon is 1 mol.",options:["Both statements True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:0,explanation:"A — Both statements True, second is correct explanation."},{q:"Statement 1: Copper is prepared by the action of Cu on dilute HCl. Statement 2: Copper is below hydrogen in the electrochemical series, so it cannot displace H₂.",options:["Both True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","First False, second True, second is correct explanation"],answer:3,explanation:"D — First False, second True, second is correct explanation. Copper is NOT prepared by action of Cu on dilute HCl; copper is below hydrogen, so it cannot displace H₂."},{q:"Which organic compound evolves white fumes with PCl₅?",options:["C₂H₅OH","C₂H₄","C₂H₆","CH₃COOH"],answer:0,explanation:"A — C₂H₅OH. Ethanol, with its –OH group, gives HCl white fumes with PCl₅."},{q:"In water purification, why is alum added to water in Tank A?",options:["To kill germs","To coagulate tiny particles in suspension","To add taste","To remove colour"],answer:1,explanation:"B — To coagulate tiny particles in suspension. Alum makes tiny particles clump together so they settle."},{q:"Which substance is used to kill germs in Tank B in water purification?",options:["Alum","Oxygen","Chlorine","Lime"],answer:2,explanation:"C — Chlorine. Chlorine kills germs / sterilises the water."},{q:"Which substance in air supports combustion?",options:["Oxygen","Nitrogen","Carbon dioxide","Argon"],answer:0,explanation:"A — Oxygen. Oxygen supports combustion."}],kf=[{q:"What is the change of state called when a solid changes to a liquid?",options:["Freezing","Melting","Sublimation","Condensation"],answer:1,explanation:"Solid → liquid is melting. Freezing is liquid → solid, sublimation is solid → gas."},{q:"Which statement about a compound is correct?",options:["Its constituents can be separated by filtration","It keeps the properties of its elements","It has a variable composition","Its constituents can be separated by chemical reactions"],answer:3,explanation:"A compound is chemically combined, so its constituents can be separated only by chemical reactions."},{q:"Which gas gives the correct information: damp blue litmus paper turns red?",options:["Ammonia","Sulphur dioxide","Oxygen","Hydrogen"],answer:1,explanation:"SO₂ is an acidic gas, so it turns damp blue litmus red."},{q:"Which expression gives the number of neutrons in element P?",options:["Mass number + atomic number","Mass number − atomic number","Atomic number − mass number","Mass number × atomic number"],answer:1,explanation:"Neutrons = mass number − atomic number. Use the exam key: B."},{q:"Metals conduct electricity because they have…",options:["Free mobile electrons","Free mobile protons","Free mobile neutrons","No electrons"],answer:0,explanation:"Metals conduct because of free, mobile (delocalised) electrons in the metallic lattice."},{q:"Atoms of the same element, with the same atomic number but different mass numbers, show…",options:["Isomerism","Allotropy","Isotopy","Polymerisation"],answer:2,explanation:"Same atomic number, different mass numbers = isotopy — the atoms are isotopes."},{q:"Which is a chemical change?",options:["Melting of ice","Boiling of water","Freezing of water","Rusting of iron"],answer:3,explanation:"Rusting forms a new substance (hydrated iron(III) oxide). Melting, boiling and freezing are physical changes."},{q:"Which is a natural source of good drinking water?",options:["Sea water","Spring water","River water","Dirty water"],answer:1,explanation:"Spring water is a natural source of good drinking water — it has been filtered naturally underground."},{q:"Concentrated sulphuric acid acts as a drying agent in the…",options:["Preparation of ammonia","Preparation of pure CO₂ gas","Preparation of hydrogen sulphide","Preparation of chlorine"],answer:1,explanation:"Conc. H₂SO₄ dries CO₂ without reacting with it. It reacts with ammonia, so it cannot dry ammonia."},{q:"What is the function of MnO₂ in the laboratory preparation of chlorine from KClO₃?",options:["Act as an oxidising agent","Act as a reducing agent","Act as a catalyst","Act as a drying agent"],answer:0,explanation:"MnO₂ acts as an oxidising agent — it oxidises chloride ions to chlorine."},{q:"Which oxide is used in the extraction of metals?",options:["Copper(II) oxide, CuO","Sodium oxide, Na₂O","Calcium oxide, CaO","Magnesium oxide, MgO"],answer:0,explanation:"CuO is used in the extraction of metals — it is reduced to copper metal."},{q:"A compound contains 80% carbon and 20% hydrogen. What is its empirical formula?",options:["CH₃","CH₂","CH","C₂H₃"],answer:0,explanation:"C: 80/12 = 6.67 mol. H: 20/1 = 20 mol. Ratio 1 : 3, so the empirical formula is CH₃."},{q:"Which is a suitable drying agent for ammonia?",options:["Quicklime (CaO)","Concentrated sulphuric acid","Calcium chloride","Concentrated hydrochloric acid"],answer:0,explanation:"Quicklime (CaO) does not react with NH₃. Conc. H₂SO₄ and CaCl₂ react with ammonia, so they cannot dry it."},{q:"A table of salts shows: Salt A gives a white precipitate with NaOH and a brick-red flame test. Which salt contains calcium ions?",options:["Salt A","Salt B","Salt C","Salt D"],answer:0,explanation:"Salt A — a brick-red flame shows Ca²⁺ ions. The white precipitate with NaOH fits calcium."},{q:"A table of salts shows: Salt C gives a golden-yellow flame test and a white precipitate with acidified AgNO₃. Which salt could be a sodium salt?",options:["Salt A","Salt B","Salt C","Salt D"],answer:2,explanation:"Salt C — a golden-yellow flame shows Na⁺, and the white AgCl precipitate shows Cl⁻."},{q:"Phosphorus is stored under water because…",options:["It is lighter than water","It ignites at low temperatures","It dissolves in water","It reacts with water"],answer:1,explanation:"Phosphorus ignites at low temperatures, so it is kept under water, away from air."},{q:"What gas is evolved when dilute hydrochloric acid reacts with sodium sulphite?",options:["Sulphur dioxide","Hydrogen","Oxygen","Carbon dioxide"],answer:0,explanation:"Dilute HCl + sodium sulphite gives SO₂ gas, which smells of burning matches."},{q:"What is the name of the alkane drawn as CH₃–CH(CH₃)–CH₂–CH₃?",options:["Pentane","2,2-dimethylpropane","2-methylbutane","Butane"],answer:2,explanation:"The longest chain has 4 carbons with a methyl branch on carbon 2: 2-methylbutane."},{q:"Which carbonate is stable to heat?",options:["Calcium carbonate","Potassium carbonate, K₂CO₃","Zinc carbonate","Copper(II) carbonate"],answer:1,explanation:"K₂CO₃ — Group I carbonates are stable to heat. CaCO₃ decomposes on heating."},{q:"How is Na⁺ formed from a Na atom?",options:["The sodium atom gains an electron","The chlorine atom loses an electron","The sodium atom gives out an electron to the chlorine atom","The sodium atom shares an electron"],answer:2,explanation:"Na loses 1 electron to Cl: the sodium atom gives out an electron to the chlorine atom."},{q:"Which is a crystalline allotrope of sulphur?",options:["Plastic sulphur","Amorphous sulphur","Rhombic sulphur","Colloidal sulphur"],answer:2,explanation:"Rhombic sulphur is crystalline. Plastic sulphur is the non-crystalline form."},{q:"Gas X irritates the respiratory system and smells of burning matches. What is gas X?",options:["Oxygen","Hydrogen","Sulphur dioxide","Nitrogen"],answer:2,explanation:"Gas X is sulphur dioxide (SO₂) — an acidic, choking gas that irritates the respiratory system."},{q:"Which transition metal forms a blue precipitate with aqueous NaOH?",options:["Iron(II)","Zinc","Copper","Iron(III)"],answer:2,explanation:"Cu — Cu²⁺ gives blue Cu(OH)₂ with NaOH. Fe³⁺ gives reddish-brown, Fe²⁺ green, Zn²⁺ white."},{q:"Which element is used as a catalyst in the manufacture of ammonia?",options:["Platinum","Nickel","Iron, Fe","Vanadium(V) oxide"],answer:2,explanation:"Fe — finely divided iron is the Haber catalyst for making ammonia."},{q:"How much heat is evolved when 23 g of ethanol burns? (Heat of combustion of ethanol = 1374 kJ/mol; ethanol = 46 g/mol)",options:["687 kJ","1374 kJ","343.5 kJ","2748 kJ"],answer:0,explanation:"23 g = 0.5 mol. 0.5 × 1374 = 687 kJ evolved."},{q:"Which organic compound decolourises bromine water?",options:["Methane","Ethane","Ethene","Propane"],answer:2,explanation:"Ethene is an alkene — its double bond decolourises bromine water. Alkanes do not."},{q:"Which change produces MORE hydrogen (not just faster) from acid + metal?",options:["Increase in concentration of acid","Increase in temperature","Increase in surface area of metal","Use of a catalyst"],answer:0,explanation:"More concentrated acid means more acid present, so more H₂ is produced. Temperature, surface area and catalyst only change the rate."},{q:"What is the major product when ethanol reacts with concentrated sulphuric acid at 170 °C?",options:["Ethanoic acid","Ethyl ethanoate","Diethyl ether","Ethene"],answer:3,explanation:"At 170 °C, conc. H₂SO₄ dehydrates ethanol to ethene."},{q:"Which element reacts with the nitrogen of the air?",options:["Copper","Magnesium, Mg","Iron","Zinc"],answer:1,explanation:"Mg + N₂ → Mg₃N₂. Magnesium reacts with nitrogen in the air."},{q:"Oxidation is defined as: 1) Addition of oxygen, 2) Removal of hydrogen, 3) Addition of hydrogen, 4) Removal of electrons. Which are correct?",options:["1, 2, 3 only","2, 3, 4 only","1, 2, 4 only","1, 3, 4 only"],answer:2,explanation:"Oxidation = 1, 2, 4 only: addition of oxygen, removal of hydrogen, removal of electrons."},{q:"For an exothermic reaction with more gas moles on the right, which factors shift equilibrium to the right? 1) Low pressure, 2) High pressure, 3) Low temperature, 4) High temperature.",options:["1 and 2 are correct","1 and 3 are correct","2 and 3 are correct","2 and 4 are correct"],answer:1,explanation:"1 and 3 are correct — low pressure favours more gas moles, and low temperature favours the exothermic forward reaction."},{q:"A mole of oxygen atoms contains…",options:["6.02 × 10²³ atoms","6.02 × 10²³ molecules","12 atoms","16 atoms"],answer:0,explanation:"One mole = 6.02 × 10²³ particles, so a mole of oxygen atoms contains 6.02 × 10²³ atoms."},{q:"Statement 1: Dilute HCl is completely ionised. Statement 2: HCl is a strong acid.",options:["Both statements True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:0,explanation:"Both statements are True, and the second is the correct explanation — strong acids ionise completely."},{q:"Statement 1: The mass of oxygen liberated is directly proportional to the quantity of electricity passed. Statement 2: Oxygen is made in the electrolysis of acidified water.",options:["Both True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:1,explanation:"Both statements are True, but the second is NOT the correct explanation — the first is Faraday's law, not where oxygen is made."},{q:"What is the electronic configuration of the sodium ion, Na⁺?",options:["2,8,1","2,8","2,8,2","2,7"],answer:1,explanation:"Na (2,8,1) loses its outer electron to form Na⁺ with configuration 2,8."},{q:"Which element is extracted by thermal reduction?",options:["Sodium","Aluminium","Calcium","Copper"],answer:3,explanation:"Copper — CuO + C → Cu + CO. Sodium, aluminium and calcium are extracted by electrolysis."},{q:"What is the percentage of nitrogen in NH₄NO₃? (RMM = 80)",options:["21.2%","35%","28%","17.5%"],answer:1,explanation:"28/80 × 100 = 35%."},{q:"Relative atomic mass is defined as…",options:["Mass of one atom relative to 1/12 mass of carbon-12","Mass of one atom relative to 1/12 mass of hydrogen","Mass of one mole of atoms","Mass of one atom in grams"],answer:0,explanation:"RAM = mass of one atom relative to 1/12 of the mass of a carbon-12 atom."},{q:"How many isomers does pentane have?",options:["2","4","3","5"],answer:2,explanation:"3 isomers: n-pentane, 2-methylbutane and 2,2-dimethylpropane."},{q:"What is the most appropriate method of preparing sodium sulphate?",options:["Precipitation","Direct combination","Neutralisation","Displacement"],answer:2,explanation:"Neutralisation — NaOH + H₂SO₄ → Na₂SO₄ + H₂O."},{q:"Which factor affects preferential discharge at an electrode?",options:["Nature of electrolyte","Colour of electrolyte","Size of electrode","Shape of beaker"],answer:0,explanation:"Preferential discharge depends on the nature of the electrolyte (and the electrodes and concentration)."},{q:"What serves as the cathode in the manufacture of NaOH?",options:["Mercury","Platinum","Graphite","Iron"],answer:0,explanation:"Mercury — the mercury cathode in the Castner–Kellner process, where sodium forms an amalgam."},{q:"What is a disadvantage of using soap?",options:["It is biodegradable","It forms scum with hard water","It dissolves in water","It is made from fats"],answer:1,explanation:"Soap forms scum with hard water — the calcium / magnesium salts of soap are insoluble."},{q:"Which polymer is made from hexane-1,6-diamine and hexane-1,6-dioic acid?",options:["Nylon","Polythene","PVC","Terylene"],answer:0,explanation:"Nylon — Nylon 6,6, a condensation polymer from the two 6-carbon monomers."},{q:"What is the concentration when 16 g of NaOH is dissolved in 250 cm³ of solution? (NaOH = 40)",options:["0.4 M","1.6 M","0.16 M","4.0 M"],answer:1,explanation:"16/40 = 0.4 mol in 0.25 dm³. 0.4 / 0.25 = 1.6 M."},{q:"Element M has electronic configuration 2,8,2. Which group is it in?",options:["Group II","Group I","Group III","Group VII"],answer:0,explanation:"2 outer electrons → Group II."},{q:"A catalyst increases the rate of a reaction by…",options:["Increasing the temperature","Increasing the concentration","Increasing the pressure","Lowering the activation energy"],answer:3,explanation:"A catalyst lowers the activation energy, so more particles can react."},{q:"Which homologous series has the general formula CₙH₂ₙ?",options:["Alkanes","Alkenes","Alcohols","Carboxylic acids"],answer:1,explanation:"Alkenes have the general formula CₙH₂ₙ."},{q:"The volume of a fixed mass of gas is inversely proportional to pressure at constant temperature. This is…",options:["Charles's law","Boyle's law","Avogadro's law","Dalton's law"],answer:1,explanation:"Boyle's law: volume ∝ 1/pressure at constant temperature."},{q:"What are the raw materials for the Contact process?",options:["Sulphur and ammonia","Sulphur and water","Sulphur and nitrogen","Sulphur and hydrogen"],answer:1,explanation:"Sulphur and water — sulphur, air and water are used to make sulphuric acid by the Contact process."}],Af=[{q:"What is the change of state called when a solid changes to a liquid?",options:["Freezing","Condensation","Sublimation","Melting"],answer:3,explanation:"Solid → liquid is melting. Freezing is liquid → solid, condensation is gas → liquid."},{q:"Sodium hydroxide pellets are stored in a tightly closed container. Why?",options:["To prevent it turning to solution — it absorbs moisture and CO₂ from the air","To prevent it evaporating","To keep it cold","To prevent it catching fire"],answer:0,explanation:"NaOH is deliquescent: it absorbs moisture and CO₂ from the air and turns into a solution, so the container must stay tightly closed."},{q:"25 cm³ of acid neutralises 25 cm³ of 0.1 mol/dm³ Na₂CO₃. What is the concentration of the acid (HCl)?",options:["0.05 mol/dm³","0.20 mol/dm³","0.10 mol/dm³","0.40 mol/dm³"],answer:1,explanation:"Moles Na₂CO₃ = 0.1 × 25/1000 = 0.0025 mol. HCl needs double (1 : 2 ratio) = 0.005 mol in 25 cm³, so concentration = 0.005 × 1000/25 = 0.20 mol/dm³."},{q:"Which element belongs to Group I?",options:["Sodium","Calcium","Magnesium","Aluminium"],answer:0,explanation:"Sodium is a Group I alkali metal. Calcium and magnesium are Group II; aluminium is Group III."},{q:"Which is the non-crystalline form of sulphur?",options:["Rhombic sulphur","Plastic sulphur","Monoclinic sulphur","Crystalline sulphur"],answer:1,explanation:"Plastic sulphur is non-crystalline — it has no regular crystal shape. Rhombic and monoclinic sulphur are crystalline."},{q:"Which substance shows no observable change when heated?",options:["Copper(II) carbonate","Zinc carbonate","Calcium carbonate","Potassium carbonate"],answer:3,explanation:"Potassium carbonate is stable to heat. Most other carbonates decompose on heating to give an oxide + CO₂."},{q:"What gas is evolved when ethanol reacts with sodium?",options:["Hydrogen","Oxygen","Carbon dioxide","Ethene"],answer:0,explanation:"Ethanol + sodium → sodium ethoxide + hydrogen. The hydrogen comes from the –OH group."},{q:"Consider: 1) acid + base → salt + water, 2) two solutions forming an insoluble solid, 3) acid + carbonate → salt + CO₂ + water, 4) 4CoO + H₂ → Co + H₂O. Which is/are redox?",options:["1 only","1 and 2","2 and 3","4 only"],answer:3,explanation:"4 only: 4CoO + H₂ → Co + H₂O is redox. 1–3 are neutralisation / precipitation, not redox."},{q:"Which statements about an exothermic reaction are correct? 1) Reactants have higher energy than products. 2) Products have higher energy than reactants. 3) Bond-breaking energy is greater than bond-forming energy. 4) Bond-breaking energy is less than bond-forming energy.",options:["1 and 2","2 and 3","1 and 4 only","3 and 4"],answer:2,explanation:"Exothermic: 1) reactants higher energy than products, and 4) bond-breaking energy less than bond-forming energy."},{q:"Which react(s) with water at room temperature to form an alkaline solution? 1) Sodium  2) Copper  3) Potassium",options:["1 only","1 and 3 only","2 and 3","1, 2 and 3"],answer:1,explanation:"1 and 3 only — sodium and potassium. Copper does not react with water at room temperature to form an alkaline solution."},{q:"What is the function of carbon monoxide in the extraction of iron?",options:["It acts as an oxidising agent","It acts as a reducing agent","It acts as a catalyst","It acts as a drying agent"],answer:1,explanation:"CO removes oxygen from iron ore: Fe₂O₃ + 3CO → 2Fe + 3CO₂. That is reduction, so CO is the reducing agent."},{q:"What are isotopes?",options:["Atoms of the same element with different masses","Atoms of different elements with the same mass","Atoms with the same number of neutrons","Molecules with the same formula"],answer:0,explanation:"Isotopes: atoms of the same element with different masses — same protons, different neutrons / mass numbers."},{q:"Chlorine, bromine and iodine are in Group VII because they…",options:["Have seven protons","Have seven neutrons","Have seven electrons in the outer shell","Have seven shells"],answer:2,explanation:"Group VII = seven electrons in the outer shell. That is why chlorine, bromine and iodine are halogens."},{q:"Which substance conducts electricity?",options:["Diamond","Graphite","Sulphur","Plastic"],answer:1,explanation:"Graphite conducts because it has delocalised electrons. Diamond, sulphur and plastic do not."},{q:"Which is the pH of an acid?",options:["2","7","9","13"],answer:0,explanation:"Acids have pH below 7. pH 7 is neutral; pH 9 and 13 are alkaline."},{q:"Which substance is decolourised by bromine water?",options:["CH₄","CH₂=CH₂","C₂H₆","C₃H₈"],answer:1,explanation:"CH₂=CH₂ (ethene) is an alkene — its double bond decolourises bromine water. Alkanes do not."},{q:"Aluminium has 13 protons and a mass number of 27. Which describes its atom?",options:["13 protons and 14 neutrons","14 protons and 13 neutrons","13 protons and 27 neutrons","27 protons and 13 neutrons"],answer:0,explanation:"13 protons and 14 neutrons (27 − 13 = 14). Proton number stays 13."},{q:"Pure, dry ammonia is collected by which method?",options:["Over water","Downward delivery","Upward delivery","Downward displacement over water"],answer:1,explanation:"Downward delivery — NH₃ is less dense than air, so it is collected by downward delivery (upward displacement). It is very soluble, so it is not collected over water."},{q:"Which is a property of a base?",options:["It has a sour taste","It has a bitter taste","It turns blue litmus red","It has pH 2"],answer:1,explanation:"Bases have a bitter taste, turn red litmus blue, and have pH above 7. Sour taste and pH 2 are acids."},{q:"A salt gives a brick-red flame test and a white precipitate that dissolves in excess dilute hydrochloric acid. What is the salt?",options:["Sodium chloride","Copper(II) sulphate","Calcium carbonate","Zinc carbonate"],answer:2,explanation:"Brick-red flame = Ca²⁺. White precipitate (CaCO₃) dissolves in excess acid. So the salt is calcium carbonate."},{q:"Statement 1: An alkene decolourises bromine water. Statement 2: Ethene is a saturated hydrocarbon.",options:["Both TRUE","First FALSE, second TRUE","First TRUE, second FALSE","Both FALSE"],answer:2,explanation:"First TRUE, second FALSE — an alkene decolourises bromine water (TRUE); ethene is unsaturated, not saturated (FALSE)."},{q:"Statement 1: Sulphur dioxide is a reducing agent. Statement 2: It turns orange acidified potassium dichromate(VI) green.",options:["TRUE, TRUE and the second is the correct explanation","TRUE, TRUE but the second is not the correct explanation","TRUE, FALSE","FALSE, TRUE"],answer:0,explanation:"TRUE, TRUE and the second is the correct explanation — SO₂ is a reducing agent, and it turns orange acidified dichromate green."},{q:"Which metal is stored under paraffin oil?",options:["Sodium","Iron","Copper","Zinc"],answer:0,explanation:"Sodium (Na) is stored under paraffin oil because it reacts with air and water."},{q:"What is the difference between soaps and detergents?",options:["Soaps are biodegradable while detergents are non-biodegradable","Detergents are biodegradable while soaps are non-biodegradable","Soaps clean better in hard water","Detergents are made from fats only"],answer:0,explanation:"Soaps are biodegradable while detergents are non-biodegradable."},{q:"How many Faradays are needed to deposit 32 g of copper? (Cu = 64; Cu²⁺ + 2e⁻ → Cu)",options:["0.5","1","2","4"],answer:1,explanation:"32 g = 0.5 mol Cu. Cu²⁺ needs 2 electrons per atom, so 0.5 × 2 = 1 Faraday."},{q:"In a titration, the base is usually put in the conical flask rather than the burette because…",options:["It is easier to pipette the base","The base is more concentrated","The acid cannot be pipetted","The flask must contain acid"],answer:0,explanation:"It is easier to pipette the base (a fixed volume into the flask) and run the acid from the burette."},{q:"Which is the cleanest natural water?",options:["Sea water","River water","Rain water","Well water"],answer:2,explanation:"Rain water is the cleanest natural water — it has picked up the fewest dissolved impurities."},{q:"What volume of CO₂ (at R.T.P.) is produced when 5 g of CaCO₃ is heated? (CaCO₃ = 100; molar volume = 24,000 cm³)",options:["1200 cm³","600 cm³","2400 cm³","120 cm³"],answer:0,explanation:"5/100 = 0.05 mol. 0.05 × 24,000 = 1200 cm³."},{q:"Blue copper(II) sulphate is heated and turns white. What type of change is this?",options:["Physical change","No change","Sublimation","Chemical change"],answer:3,explanation:"Chemical change — loss of water of crystallisation. A new substance (white anhydrous CuSO₄) is formed."},{q:"Which reaction is made faster by increasing surface area?",options:["NaOH + HCl → NaCl + H₂O","CaCO₃ + 2HCl → CaCl₂ + CO₂ + H₂O","AgNO₃ + NaCl → AgCl + NaNO₃","NH₃ + HCl → NH₄Cl"],answer:1,explanation:"CaCO₃ + 2HCl — solid + liquid. Increasing the surface area of the solid speeds up the reaction."},{q:"What is the percentage of nitrogen in NaNO₃? (Na = 23, N = 14, O = 16, Mr = 85)",options:["16.5%","14%","23%","28%"],answer:0,explanation:"14/85 × 100 = 16.5%."},{q:"Urea is what type of fertiliser?",options:["Nitrogenous fertiliser","Phosphatic fertiliser","Potassic fertiliser","Compound fertiliser"],answer:0,explanation:"Urea supplies nitrogen, so it is a nitrogenous fertiliser."},{q:"In ZnO + C → Zn + CO, which substance is reduced?",options:["Carbon","ZnO","Zinc","Carbon monoxide"],answer:1,explanation:"ZnO is reduced — Zn²⁺ gains electrons to become Zn. Carbon is oxidised."},{q:"For a reaction with fewer gas moles on the right, what happens when pressure is increased?",options:["Equilibrium shifts to the right","Equilibrium shifts to the left","Equilibrium does not move","The reaction stops"],answer:0,explanation:"Shifts to the right — increased pressure favours the side with fewer gas moles."},{q:"Which gas burns with a smoky flame?",options:["Methane","Ethene","Ethane","Hydrogen"],answer:1,explanation:"Ethene is unsaturated, so it burns with a smoky flame. Saturated methane and ethane burn with cleaner flames."},{q:"Which is a natural substance?",options:["Polythene","Starch","Nylon","PVC"],answer:1,explanation:"Starch is natural (made by plants). Polythene, nylon and PVC are synthetic."},{q:"Why is sodium discharged at a mercury cathode instead of hydrogen during electrolysis of brine?",options:["Sodium is lighter than hydrogen","Sodium has a higher affinity for mercury — it forms an amalgam","Hydrogen is not present","Mercury repels hydrogen"],answer:1,explanation:"Sodium has a higher affinity for mercury — it forms an amalgam, so sodium is discharged instead of hydrogen."},{q:"Which is a suitable method for preparing a sodium hydroxide solution?",options:["Heating sodium carbonate","Electrolysis of molten NaCl","By direct combination — Na₂O + H₂O → 2NaOH / dissolving","Heating sodium metal in air"],answer:2,explanation:"By direct combination — Na₂O + H₂O → 2NaOH (dissolving sodium oxide in water)."},{q:"By which process is sulphur extracted?",options:["Haber process","Ostwald process","Frasch process","Contact process"],answer:2,explanation:"Sulphur is extracted by the Frasch process — superheated water and compressed air."},{q:"What is an industrial use of carbon monoxide?",options:["As an oxidising agent","As a reducing agent","As a catalyst","As a bleach"],answer:1,explanation:"CO is used as a reducing agent, e.g. in iron extraction."},{q:"Adding 2 cm³ of NaOH gives a reddish-brown precipitate. Which ion is present?",options:["Fe²⁺","Cu²⁺","Fe³⁺","Zn²⁺"],answer:2,explanation:"Fe³⁺ gives reddish-brown Fe(OH)₃. Fe²⁺ gives green, Cu²⁺ blue, Zn²⁺ white."},{q:"Phosphorus is stored under water because…",options:["It is lighter than water","It is denser than water — it stays under water, kept away from air","It dissolves in water","It reacts with water"],answer:1,explanation:"It is denser than water — it stays under water, kept away from air, so it cannot catch fire."},{q:"A flame test is used to test for…",options:["Anions","Metal ions","Gases","pH"],answer:1,explanation:"Flame tests identify metal ions (cations) by their flame colours."},{q:"In the laboratory preparation of chlorine, what is the function of water?",options:["To remove hydrogen chloride fumes — water absorbs HCl","To dry the chlorine","To cool the chlorine","To collect the chlorine"],answer:0,explanation:"To remove hydrogen chloride fumes — water absorbs HCl."},{q:"A compound contains 0.80 g of carbon and 0.20 g of hydrogen. What is its empirical formula?",options:["CH","CH₃","CH₂","C₂H₃"],answer:1,explanation:"C: 0.80/12 = 0.0667 mol. H: 0.20/1 = 0.20 mol. Ratio 1 : 3, so CH₃."},{q:"Which is NOT an alcohol?",options:["CH₃OH","CH₃CH₂OH","CH₃CH₂CH₂OH","CH₃CH₂CH₂CH₃"],answer:3,explanation:"CH₃CH₂CH₂CH₃ is an alkane (butane) — it has no –OH group. The others are alcohols."},{q:"Compounds with the same general molecular formula but different methods of preparation are called…",options:["Isomers","Isotopes","Allotropes","Homologues"],answer:3,explanation:"Homologues — members of the same homologous series share a general formula and differ by CH₂."},{q:"A sodium chloride solution is an electrolyte because…",options:["It is covalent","It is insoluble","It is a solid","It is a soluble salt — ionic, it conducts when dissolved"],answer:3,explanation:"It is a soluble salt — ionic, it conducts electricity when dissolved because the ions are free to move."},{q:"Which is a polymer?",options:["Polythene","Ethene","Glucose","Ethanol"],answer:0,explanation:"Polythene is a polymer made from ethene monomers. Ethene, glucose and ethanol are not polymers."},{q:"What is the function of zymase?",options:["It oxidises ethanol","It breaks down starch","It catalyses the decomposition of glucose to ethanol","It preserves food"],answer:2,explanation:"Zymase catalyses the decomposition of glucose to ethanol — glucose → ethanol + CO₂ (fermentation)."}],If=[{title:"Aluminium Overhead Cables",tag:"Paper 1 · Q1 · Paper 2 · Q2",intro:"Aluminium is the metal commonly used for overhead electric cables. It is light, strong enough for overhead lines, and a good conductor of electricity.",points:["Aluminium is light / has a low density, so overhead cables do not sag too much under their own weight.","Aluminium is a good conductor of electricity, so current flows through it easily.","Aluminium is resistant to corrosion — a thin layer of aluminium oxide protects it in air.","Copper conducts better than aluminium, but copper is heavier and more expensive, so aluminium is preferred for long overhead lines.","Overhead cables are often aluminium with a steel core for extra strength."],example:"Exam line: metal commonly used for overhead electric cables = aluminium — light and a good conductor."},{title:"Separating Funnel / Water and Oil",tag:"Paper 1 · Q2",intro:"Water and oil do not mix. They form two layers, so a separating funnel can run one layer off and leave the other behind.",points:["Water and oil are immiscible liquids — they do not mix to form one liquid.","Water is denser than oil, so water forms the lower layer and oil forms the upper layer in a separating funnel.","Open the tap and run off the lower water layer, then close the tap before the oil reaches it.","The oil is then poured out from the top of the funnel.","Use a separating funnel only for immiscible liquids. Miscible liquids, such as ethanol and water, need fractional distillation."],example:"Exam line: mixture of water and oil = separating funnel — immiscible liquids, different densities."},{title:"Atomic Number = Total Electrons",tag:"Paper 1 · Q3",intro:"Electronic configuration adds up to the atomic number. In a neutral atom, the number of electrons equals the atomic number.",points:["Atomic number = number of protons in the nucleus.","In a neutral atom, electrons = protons = atomic number.","Add the electrons in each shell: 2,8,8,2 adds to 2 + 8 + 8 + 2 = 20.","So an atom with configuration 2,8,8,2 has atomic number 20 — calcium.","In an ion the electron number changes: a positive ion has lost electrons, a negative ion has gained electrons."],example:"2,8,8,2 → total electrons = 20 → atomic number = 20."},{title:"Calcium Nitrate Decomposition",tag:"Paper 1 · Q4",intro:"Most metal nitrates decompose on heating to the metal oxide, nitrogen dioxide and oxygen. Group I nitrates are the exception — they give nitrite + oxygen.",points:["Calcium nitrate is a Group II nitrate, so it decomposes fully on heating.","Equation: Ca(NO₃)₂ → CaO + 2NO₂ + O₂.","Nitrogen dioxide, NO₂, is a brown gas with a choking smell.","Oxygen relights a glowing splint; the solid left behind is white calcium oxide, CaO.","Group I nitrates behave differently: 2KNO₃ → 2KNO₂ + O₂ — no NO₂ is formed."],example:"Exam line: Ca(NO₃)₂ heated → CaO + 2NO₂ + O₂."},{title:"Iron Catalyst — Haber Process",tag:"Paper 1 · Q5 · Paper 2 · Q5",intro:"Iron is the transition metal catalyst in the manufacture of ammonia — the Haber process.",points:["Haber process: N₂ + 3H₂ ⇌ 2NH₃.","Catalyst: finely divided iron. Conditions: about 450 °C and about 200 atm.","The catalyst speeds up the reaction but is not used up, and it does not change the yield.","Nitrogen comes from air; hydrogen comes from natural gas / methane / water / steam.","Ammonia is then used to make fertilisers, nitric acid and urea."],example:"Exam line: transition metal used as catalyst in manufacture of ammonia = iron — Haber process."},{title:"Isotopes / Relative Atomic Mass",tag:"Paper 1 · Q6",intro:"Isotopes are atoms of the same element with different mass numbers. Relative atomic mass is the weighted average of the isotope masses.",points:["Isotopes: same element, same number of protons, different numbers of neutrons.","Example: ⁶⁹X and ⁷¹X are isotopes of element X.","If the ratio is 1 : 1, each isotope is 50% abundant.","Relative atomic mass = (69 × 1 + 71 × 1) / 2 = 140 / 2 = 70.","If the ratio were 3 : 1, use (69 × 3 + 71 × 1) / 4 — always weight by abundance."],example:"⁶⁹X and ⁷¹X in ratio 1 : 1 → RAM = (69 + 71) / 2 = 70."},{title:"Noble Gas / Argon",tag:"Paper 1 · Q7",intro:"A noble gas has a full outer shell, so it is stable and will not react easily with other elements.",points:["Noble gases: helium, neon, argon, krypton, xenon — Group 0 / Group VIII.","Argon has electronic configuration 2,8,8 — a full outer shell, a stable octet.","Because the outer shell is full, argon does not gain, lose or share electrons easily.","So argon will not react easily with other elements.","Argon is used where an unreactive atmosphere is needed, for example in light bulbs and welding."],example:"Exam line: element that will not react easily = argon (P) — noble gas, stable octet."},{title:"Group II / Mg and Ca",tag:"Paper 1 · Q8 · Q9",intro:"Elements in the same group have the same number of outer-shell electrons and similar chemical properties.",points:["Magnesium, Mg: configuration 2,8,2 — 2 outer electrons → Group II.","Calcium, Ca: configuration 2,8,8,2 — 2 outer electrons → Group II.","M and Q in the paper are magnesium and calcium, so they belong to the same group — Group II.","Group II metals lose 2 electrons to form 2+ ions: Mg²⁺ and Ca²⁺.","Reactivity increases down Group II, just as it increases down Group I."],example:"M = Mg (2,8,2) and Q = Ca (2,8,8,2) → both Group II, 2 outer electrons."},{title:"MgS / Ionic Compound",tag:"Paper 1 · Q9",intro:"Magnesium forms Mg²⁺ and the non-metal in this question forms a 1− ion, so two of the 1− ions balance one Mg²⁺.",points:["M is magnesium: it loses 2 outer electrons → Mg²⁺.","N has 16 protons and 17 electrons, so it has gained 1 electron → N⁻.","Charges must balance: +2 needs two −1 ions.","So the formula is MN₂ — one M²⁺ for every two N⁻: Mg²⁺ + 2N⁻ → MgN₂.","MgN₂ is an ionic / electrovalent compound — strong electrostatic attraction between oppositely charged ions."],example:"Mg²⁺ + 2N⁻ → MgN₂. Check the charges: +2 + 2(−1) = 0."},{title:"Alkenes CₙH₂ₙ",tag:"Paper 1 · Q10 · Q12",intro:"Alkenes have the general formula CₙH₂ₙ. Put n = 5 and the fifth member is C₅H₁₀.",points:["Alkenes: general formula CₙH₂ₙ, with at least one carbon–carbon double bond.","First member: n = 1 is not possible for an alkene — the series starts at ethene, C₂H₄.","Members: C₂H₄ (ethene), C₃H₆ (propene), C₄H₈ (butene), C₅H₁₀ (pentene).","Fifth member: n = 5 → C₅H₁₀.","Alkenes decolourise bromine water by addition across the double bond; alkanes, CₙH₂ₙ₊₂, do not."],example:"Fifth member of CₙH₂ₙ: n = 5 → C₅H₁₀."},{title:"Acid Rain / NO₂ + SO₂",tag:"Paper 1 · Q11",intro:"Acid rain is caused mainly by two gases from burning fuels: nitrogen dioxide and sulphur dioxide.",points:["Major causes of acid rain: nitrogen dioxide, NO₂, and sulphur dioxide, SO₂.","SO₂ comes from burning fossil fuels that contain sulphur, e.g. coal and oil.","NO₂ comes from high-temperature burning in car engines and factories, where nitrogen and oxygen in the air combine.","Both gases dissolve in rain water to form acids — sulphurous / sulphuric acid and nitrous / nitric acid.","Acid rain damages buildings, lakes, plants and soil. It is much more acidic than natural rain, which is only slightly acidic from CO₂."],example:"Exam line: the pair that causes acid rain = NO₂ and SO₂."},{title:"Smoky Flame / Propene",tag:"Paper 1 · Q12",intro:"Unsaturated hydrocarbons with a high carbon-to-hydrogen ratio burn with a smoky, luminous flame.",points:["Propene, C₃H₆, is an alkene — unsaturated, with a carbon–carbon double bond.","Its carbon : hydrogen ratio is high, so it does not burn completely in air.","Incomplete combustion produces soot (carbon particles), which glows and makes the flame luminous and smoky.","Saturated hydrocarbons such as methane and ethane burn with a cleaner, less smoky flame.","The smoky flame is a sign of unsaturation and a high proportion of carbon."],example:"Exam line: substance that burns with a smoky and luminous flame = propene, C₃H₆."}],Ef=[{section:"Section A · Answer ALL questions in this section",title:"Q1 — Group I: Li, Na, K, Rb",prompt:["Table: Lithium (Li) atomic number 3, Sodium (Na) 11, Potassium (K) 19, Rubidium (Rb) 37.","a) (i) Why are they classified as Group I elements? (ii) Which of the elements is the least reactive? (iii) Write the electronic configuration of potassium (K).","b) (i) These elements are usually stored under paraffin oil. Explain. (ii) Write the equation for the reaction between sodium and water.","c) Lithium although in Group I resembles Mg in Group II in its chemical properties. (i) What name is given to this resemblance? (ii) State the products formed when carbonates of Li and Na are strongly heated.","d) State the type of compound formed when Group I elements combine with non-metals."],answer:["a) (i) They are classified as Group I because they have the same number of electrons in the outer shell (1), and similar chemical properties.","a) (ii) Least reactive: Lithium (Li) — reactivity increases down Group I.","a) (iii) Electronic configuration of potassium (K): 2,8,8,1.","b) (i) They are reactive with air / moisture / water, so paraffin oil prevents contact with air and water.","b) (ii) 2Na + 2H₂O → 2NaOH + H₂.","c) (i) Name given to this resemblance: diagonal relationship.","c) (ii) Li₂CO₃ heated: Li₂O + CO₂ — lithium carbonate decomposes like a Group II carbonate. Na₂CO₃ heated: no decomposition / no reaction — sodium carbonate is stable to heat.","d) Type of compound: ionic / electrovalent compounds — e.g. NaCl."]},{section:"Section A · Answer ALL questions in this section",title:"Q2 — Aluminium from Bauxite",prompt:["Aluminium is prepared industrially from purified bauxite by electrolytic reduction.","a) (i) Write the formula of the oxide. (ii) Write the cathode half equation for the process.","b) (i) Can chemical reduction be used to extract Al from its ore? (ii) Explain.","c) (i) Why are Al extraction plants usually located near a power station?","d) Give one large-scale use of Al and relate this use to its property.","e) (i) State one metal that can be extracted by chemical reduction. (ii) Name an ore from which this metal is extracted. (iii) Write the equation for the extraction process."],answer:["a) (i) Formula of the oxide: Al₂O₃ — aluminium oxide / alumina.","a) (ii) Cathode half equation: Al³⁺ + 3e⁻ → Al.","b) (i) No — chemical reduction cannot be used to extract Al from its ore.","b) (ii) Aluminium is very reactive / high in the electrochemical series, carbon / CO cannot reduce Al₂O₃, Al₂O₃ is very stable, only electrolysis can reduce it.","c) (i) Electrolysis uses a large amount of electricity, so plants need cheap / abundant electricity, which a power station provides.","d) One large-scale use: aeroplane bodies / aircraft — light / low density, strong. Or overhead cables — good conductor of electricity, light. Or cooking utensils — good conductor of heat, light, resistant to corrosion. Or cans / roofing — malleable, resistant to corrosion.","e) (i) Metal extracted by chemical reduction: iron (Fe) / copper / zinc.","e) (ii) Ore: iron — haematite, Fe₂O₃. Copper — malachite / copper pyrites. Zinc — zinc blende, ZnS.","e) (iii) Equation for extraction: Fe₂O₃ + 3CO → 2Fe + 3CO₂."]},{section:"Section A · Answer ALL questions in this section",title:"Q3 — Homologous Series CₙH₂ₙ₊₁OH",prompt:["A homologous series of organic compounds has general formula CₙH₂ₙ₊₁OH.","a) (i) What is a homologous series? (ii) Give the general name of this homologous series. (iii) Name the second member of this series.","b) Members of the above series can react with metals. (i) Show how the second member reacts with sodium. (ii) Name the non-gaseous product formed.","c) The second member of the series reacts with ethanoic acid. (i) What name is given to this type of reaction? (ii) Write the equation for the reaction.","d) State one simple test for members of this homologous series.","e) State two large-scale uses of the second member of this homologous series."],answer:["a) (i) A homologous series is a series of organic compounds with the same general formula, the same functional group, similar chemical properties, differing by CH₂, showing a gradation in physical properties.","a) (ii) General name: alcohols / alkanols.","a) (iii) Second member: ethanol (C₂H₅OH) — first is methanol, CH₃OH; second is ethanol, C₂H₅OH.","b) (i) 2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂ — sodium ethoxide + hydrogen.","b) (ii) Non-gaseous product: sodium ethoxide, C₂H₅ONa — sodium ethanolate.","c) (i) Name of reaction: esterification.","c) (ii) C₂H₅OH + CH₃COOH ⇌ CH₃COOC₂H₅ + H₂O — ethyl ethanoate + water.","d) One simple test: add a piece of sodium — effervescence / hydrogen gas evolved. Or add PCl₅ — white steamy fumes of HCl evolved.","e) Two large-scale uses: manufacture of alcoholic drinks / beverages. Manufacture of methylated spirit / fuel / solvent. Disinfectant / hand sanitiser. Manufacture of esters / ethanoic acid (any two)."]},{section:"Section A · Answer ALL questions in this section",title:"Q4 — Laboratory Preparation of Ammonia",prompt:["Ammonia (NH₃) is prepared in the laboratory by reacting a mixture of ammonium chloride and calcium hydroxide.","a) (i) Why is it advisable to grind the mixture of ammonium chloride and calcium hydroxide? (ii) State the reaction condition. (iii) Write the equation for the reaction. (iv) State the drying agent used.","d) Ammonia gas is used as a reducing agent for copper(II) oxide. (i) Write the equation to show the reduction of NH₃. (ii) State one observation when the copper(II) oxide is reduced.","e) Give one large-scale use of: (i) nitrogen, (ii) ammonia."],answer:["a) (i) Grinding increases the surface area, increases the rate of reaction, and ensures intimate contact / mixing.","a) (ii) Reaction condition: heat — strongly heat / heat gently.","a) (iii) 2NH₄Cl + Ca(OH)₂ → CaCl₂ + 2NH₃ + 2H₂O (on heating).","a) (iv) Drying agent: calcium oxide, CaO — quicklime. NOT CaCl₂ (absorbs NH₃), NOT concentrated H₂SO₄ (reacts with NH₃).","d) (i) 2NH₃ + 3CuO → 3Cu + N₂ + 3H₂O — NH₃ is oxidised to N₂, CuO is reduced to Cu.","d) (ii) Observation: black solid turns brown / reddish-brown — CuO (black) to Cu (brown), water droplets formed.","e) (i) Nitrogen: manufacture of ammonia (Haber), manufacture of fertilisers, inert atmosphere / food packaging, cooling (liquid nitrogen) (any one).","e) (ii) Ammonia: manufacture of fertilisers (ammonium sulphate / nitrate), manufacture of nitric acid, manufacture of urea, refrigerant, cleaning agent (any one)."]},{section:"Section A · Answer ALL questions in this section",title:"Q5 — Sulphur Dioxide Equilibrium",prompt:["Sulphur dioxide reacts with air according to the equation: 2SO₂ + O₂ ⇌ 2SO₃, ΔH = −196 kJ/mol.","a) (i) Explain the meaning of ΔH = −196 kJ/mol. (ii) State two reaction conditions for the above reaction.","b) (i) State Le Chatelier's principle. (ii) What will happen to the equilibrium position when: pressure is increased? Temperature is increased?","c) What volume of oxygen is required to produce 300 cm³ of SO₃ at room temperature and pressure?","d) State one environmental hazard of SO₂.","e) Give one large-scale use of SO₂."],answer:["a) (i) ΔH = −196 kJ/mol means the reaction is exothermic — 196 kJ of heat is released per mole of reaction as written (2 mol SO₂ → 2 mol SO₃), heat is given out to the surroundings.","a) (ii) Two reaction conditions: temperature 450 °C (400–500 °C), pressure 1–2 atm, catalyst vanadium(V) oxide, V₂O₅ — Contact Process conditions (any two).","b) (i) Le Chatelier's principle: when a system at equilibrium is disturbed, it shifts to counteract / oppose the change.","b) (ii) Pressure increased: shifts to the right, more SO₃, fewer gas moles. Temperature increased: shifts to the left, less SO₃, more SO₂ and O₂ (forward reaction is exothermic).","c) Ratio O₂ : SO₃ = 1 : 2. Volume of O₂ = 300 / 2 = 150 cm³.","d) One environmental hazard: acid rain, respiratory problems / air pollution, corrodes buildings, damages plants (any one).","e) One large-scale use: manufacture of sulphuric acid (Contact Process), manufacture of SO₃ / sulphur trioxide, bleaching / preservative / disinfectant, manufacture of sodium sulphite (any one)."]},{section:"Section B · Answer ANY TWO questions",title:"Q6 — Bonding: Ionic, Simple Covalent, Metallic",prompt:["Section B — Answer ANY TWO questions. All questions carry equal marks. Where appropriate, equations and diagrams should be used to illustrate your answer. Write your answer on the sheets that follow Section C.","Bonding can either be ionic, simple covalent or metallic.","a) Define chemical bond.","b) Using appropriate diagrams, describe how each bond type occurs in a named substance: ionic, covalent / simple covalent, metallic.","c) Give one property of each substance, stating how this property is related to the bond type."],answer:["a) A chemical bond is a force of attraction holding atoms / ions together in a compound / molecule.","b) IONIC: Transfer of electrons from a metal to a non-metal; oppositely charged ions are attracted. Example NaCl: Na → Na⁺ + e⁻, Cl + e⁻ → Cl⁻. Na⁺ and Cl⁻ are attracted. Diagram: Na [2,8,1] + Cl [2,8,7] → Na⁺ [2,8] Cl⁻ [2,8,8].","b) COVALENT / SIMPLE COVALENT: Sharing of pairs of electrons between non-metal atoms. Example CH₄ / H₂O / Cl₂. H₂O — O shares one pair with each H. CH₄ — C shares 4 pairs with 4 H. Diagram: dot-and-cross.","b) METALLIC: Positive metal ions in a sea of delocalised / mobile electrons; attraction between the ions and the electrons. Example Cu / Al / Fe / Mg: Mg²⁺ ions surrounded by delocalised electrons.","c) NaCl (ionic): High melting / boiling point — strong electrostatic forces between ions need much energy to break. OR Conducts electricity when molten / in solution — free ions move, but NOT in the solid — ions are fixed.","c) CH₄ / H₂O / Cl₂ (simple covalent): Low melting / boiling point — weak intermolecular forces between molecules, little energy to overcome. OR Does NOT conduct electricity — no free ions / electrons, molecules are neutral.","c) Cu / Al (metallic): Good conductor of heat / electricity — delocalised electrons move freely. OR Malleable / ductile — layers of ions slide without breaking the bond; the sea of electrons holds them. OR High melting point — strong attraction between ions and delocalised electrons."]},{section:"Section B · Answer ANY TWO questions",title:"Q7 — Solubility & Solubility Curve: KNO₃",prompt:["Section B — Answer ANY TWO questions. All questions carry equal marks.","a) Define: (i) Solubility. (ii) Solubility curve.","b) Table shows solubility of potassium nitrate (KNO₃) in grams per 100 g of water at different temperatures: 0 °C — 16, 10 °C — 21, 20 °C — 31, 30 °C — 45, 40 °C — 62, 50 °C — 81, 60 °C — 106. Plot solubility of KNO₃ against temperature (X-axis).","c) From the graph determine: (i) The solubility of the salt at 40 °C. (ii) The temperature at which 40 g of KNO₃ will saturate 100 g of water.","d) (i) What mass of KNO₃ would be obtained when a saturated solution is cooled from 50 °C to 15 °C? (ii) Calculate amount of substance in KNO₃ in the mass obtained in d(i).","e) State one use of solubility curves."],answer:["a) (i) Solubility: mass of solute in grams that dissolves in 100 g of water / solvent at a given temperature to form a saturated solution.","a) (ii) Solubility curve: graph / curve of solubility against temperature — shows how solubility of a solute changes with temperature.","b) Axes: X-axis Temperature 0 to 60 °C, Y-axis Solubility 0 to 110 g / 100 g H₂O. Plot points (0, 16), (10, 21), (20, 31), (30, 45), (40, 62), (50, 81), (60, 106). Join with a smooth rising curve, steepening as temperature rises. KNO₃ solubility increases rapidly with temperature.","c) (i) Solubility at 40 °C: 62 g per 100 g of water — read from the curve at 40 °C.","c) (ii) Temperature at which 40 g of KNO₃ will saturate 100 g of water: about 26–27 °C — read from the curve at solubility 40 g, between 20 °C (31 g) and 30 °C (45 g), about 26 °C.","(d)(i) Mass obtained on cooling saturated solution from 50C to 15C: At 50C: 81g per 100g water. At 15C: about 26g per 100g water (between 21 at 10C and 31 at 20C). Mass crystallised = 81 - 26 = 55g per 100g water.","(d)(ii) Calculate amount of substance in KNO3 in the mass obtained in d(i): RMM KNO3 = 101 (K 39 + N 14 + O3 48). Moles = Mass / RMM = 55 / 101 = 0.54 mol. For reference, in 100g water at 50C the saturated solution holds 81g = 81/101 = 0.80 mol.","e) One use of solubility curves: to determine solubility of a solute at any temperature. To determine the temperature at which a given mass will saturate. To determine mass of crystals obtained on cooling a saturated solution. To compare solubilities of different solutes. To plan crystallisation / purification."]},{section:"Section B · Answer ANY TWO questions",title:"Q8 — Short Notes: Polymerisation, Saponification, Isotopes, Hydrolysis",prompt:["Section B — Answer ANY TWO questions. All questions carry equal marks.","Write short notes on each of the following: (a) Polymerisation. (b) Saponification. (c) Isotopes. (d) Hydrolysis."],answer:["a) Polymerisation: process of joining many small molecules (monomers) into a large molecule (polymer). Addition polymerisation: monomers with C=C join without loss, e.g. ethene → poly(ethene), nC₂H₄ → (C₂H₄)ₙ. Condensation polymerisation: monomers join with loss of a small molecule e.g. H₂O, e.g. nylon, terylene.","b) Saponification: hydrolysis of fats / oils / esters with concentrated alkali (NaOH / KOH) to form soap + glycerol. Example: fat + NaOH → sodium salt of fatty acid (soap) + glycerol (propane-1,2,3-triol). Soap is sodium stearate / palmitate.","c) Isotopes: atoms of the same element with the same atomic number / same number of protons, but different mass number / different number of neutrons. Example: ¹²C and ¹⁴C, ³⁵Cl and ³⁷Cl, ¹H and ²H. Same chemical properties, different physical properties, different relative atomic mass.","d) Hydrolysis: chemical reaction of a substance with water, breaking it into two parts. Example: ester + water → acid + alcohol, CH₃COOC₂H₅ + H₂O → CH₃COOH + C₂H₅OH. Salt hydrolysis: NH₄Cl + H₂O → NH₄OH + HCl. Sucrose + water → glucose + fructose."]},{section:"Section C · Answer ALL questions in this section",title:"Q9 — Titration: Dilute H₂SO₄ vs 0.25 M NaOH",prompt:["Section C — Answer ALL questions in this section.","In order to determine concentration of a dilute sulphuric acid solution, a student is provided with: 0.25 M NaOH, dilute HCl, dilute H₂SO₄, pipette, burette, conical flask, phenolphthalein indicator, clamp and stand.","a) Draw experimental set up you would use.","b) 25 cm³ of 0.25 M NaOH was transferred into a conical flask and 3 drops of phenolphthalein indicator were added. (i) Sketch and name apparatus used to transfer NaOH solution. (ii) Identify liquid used to rinse conical flask.","c) Dilute acid was run from burette and two accurate results were recorded: Experiment 1 — Initial 0.0 cm³, Final 16.5 cm³. Experiment 2 — Initial 10.5 cm³, Final 26.5 cm³. (i) Read and record results in table. (ii) Determine mean titre of dilute sulphuric acid used. (iii) What will be colour change to indicate end of experiment? (iv) Calculate concentration of dilute sulphuric solution if 25 cm³ of 0.25 M NaOH was required. (v) In carrying out experiment acid accidentally spilled on student's hands. Advise student on what should be done.","d) You are given gases: H₂, SO₂, NH₃. Sketch apparatus you would use to collect a pure sample of each gas in laboratory."],answer:["a) Describe / label diagram — burette clamped vertically on clamp and stand, filled with dilute H₂SO₄, tip above conical flask. Conical flask below burette on white tile, containing 25 cm³ 0.25 M NaOH + 2–3 drops phenolphthalein (pink). Label all: burette, dilute H₂SO₄, clamp and stand, conical flask, 25 cm³ NaOH + phenolphthalein, white tile.","b) (i) Pipette — 25 cm³ pipette, with pipette filler / teat. Label: pipette, 25 cm³ mark.","b) (ii) Distilled / deionised water — NOT NaOH, NOT acid, NOT tap water — rinsing with NaOH would add extra alkali and change the titre.","c) (i) Experiment 1: Initial reading 0.0 cm3, Final reading 16.5 cm3, Titre = 16.5 - 0.0 = 16.5 cm3. Experiment 2: Initial reading 10.5 cm3, Final reading 26.5 cm3, Titre = 26.5 - 10.5 = 16.0 cm3.","c) (ii) Mean titre = (16.5 + 16.0) / 2 = 16.25 cm3.","c) (iii) Colour change: Pink to Colourless.","c) (iv) Calculation: H2SO4 + 2NaOH -> Na2SO4 + 2H2O. Moles NaOH = 0.25 x 25/1000 = 0.00625 mol. Moles H2SO4 = 0.00625 / 2 = 0.003125 mol. Volume acid = 16.25 cm3 = 0.01625 dm3. Concentration = 0.003125 / 0.01625 = 0.19 mol/dm3. Answer: 0.19M H2SO4.","c) (v) Wash immediately with plenty of cold running water for several minutes, remove contaminated clothing / jewellery, do NOT rub, seek medical help / tell teacher, if available apply dilute sodium hydrogen carbonate solution after washing.","d) H₂: collect over water / downward displacement of water — H₂ insoluble in water, lighter than air, gas jar inverted over water trough, delivery tube bubbles H₂ into jar.","d) SO₂: upward displacement of air / downward delivery — SO₂ denser than air, soluble in water so NOT over water, gas jar upright, delivery tube to bottom of jar, SO₂ sinks and pushes air up.","d) NH₃: downward displacement of air / upward delivery — NH₃ lighter than air, very soluble in water so NOT over water, gas jar inverted, delivery tube to top of jar, NH₃ rises and pushes air down. Label each diagram: gas jar, delivery tube, trough / stand, gas."]},{section:"Section C · Answer ALL questions in this section",title:"Q10 — Unknown Substances X, Y, Z & Separations",prompt:["Section C — Answer ALL questions in this section.","In order to determine chemical composition of three unknown substances X, Y and Z, a student carried out following tests:","(i) To 2 cm³ solution of X are added a few drops of NaOH(aq), mixture warmed: a colourless pungent gas is evolved, which turns damp red litmus paper blue.","(ii) To 2 cm³ solution of X are added a few drops of BaCl₂(aq) followed by dilute HCl: white precipitate formed, insoluble in dilute HCl.","(iii) To 2 cm³ solution of X are added a few drops of NaOH(aq): green precipitate formed.","(iv) To 2 cm³ solution of Y are added a few drops of AgNO₃(aq) followed by dilute HNO₃: a white ppt is formed.","(v) A solid sample of Z gives a brick red flame colour.","(vi) A solid sample of Z is strongly heated in a test tube: a colourless gas is evolved.","b) Give chemical identity of X, Y, Z.","c) Complete table to show how you will separate these mixtures: kerosene and water; water and ethanol / salt solution / ethanol and water; ink / dyes / colours / leaf pigments; groundnut and its peels.","d) (i) In order to dilute acid, a student added 410 cm³ of distilled water to 10 cm³ of concentrated sulphuric acid. State and justify what is wrong with this procedure. (ii) Why is it advisable to wear eye goggles when working in laboratory?"],answer:["(i) Inference: NH₄⁺ ions present — gas is NH₃, NH₄⁺ + OH⁻ → NH₃ + H₂O.","(ii) Inference: SO₄²⁻ ions present — Ba²⁺ + SO₄²⁻ → BaSO₄ white ppt.","(iii) Inference: Fe²⁺ ions present — Fe²⁺ + 2OH⁻ → Fe(OH)₂ green ppt.","(iv) Inference: Cl⁻ ions present — Ag⁺ + Cl⁻ → AgCl white ppt.","(v) Inference: Ca²⁺ ions present — calcium gives brick red flame.","(vi) Inference: NO₃⁻ ions present — nitrate decomposes on heating to give O₂ (colourless gas, relights glowing splint), e.g. 2Ca(NO₃)₂ → 2CaO + 4NO₂ + O₂.","b) X: ammonium iron(II) sulphate — (NH₄)₂Fe(SO₄)₂ — Mohr's salt — contains NH₄⁺, Fe²⁺, SO₄²⁻. Y: a chloride — e.g. sodium chloride NaCl — contains Cl⁻, cation not identified by tests given, a soluble chloride. Z: calcium nitrate — Ca(NO₃)₂ — contains Ca²⁺ and NO₃⁻.","c) Kerosene and water - Separating funnel.","c) Salt solution / Ethanol and water - Simple distillation.","c) Ink / Dyes / Colours - Paper chromatography.","c) Groundnut and its peels - Winnowing / Hand picking / Sieving.","d) (i) WRONG — DANGEROUS. Never add water to concentrated acid. Always add acid to water slowly with stirring. Dilution of conc. H₂SO₄ is highly exothermic, water added boils suddenly, acid sprays out and causes burns. Acid should be added to water so heat is spread in large volume of water.","d) (ii) To protect eyes from corrosive / splashing chemicals, acids, alkalis, hot liquids, broken glass, fumes. Eyes are delicate, chemical burns can cause blindness."]}],Tf=[{q:"Metal commonly used for overhead electric cables:",options:["Copper","Aluminium","Iron","Zinc"],answer:1,explanation:"B — Aluminium. Aluminium is light and a good conductor of electricity, so it is used for overhead cables."},{q:"Method to separate a mixture of water and oil:",options:["Filtration","Separating funnel","Fractional distillation","Evaporation"],answer:1,explanation:"B — Separating funnel. Water and oil are immiscible liquids, so they form two layers that can be separated in a separating funnel."},{q:"Atomic number of an atom with electronic configuration 2,8,8,2:",options:["20","18","16","10"],answer:0,explanation:"A — 20. Total electrons = 2 + 8 + 8 + 2 = 20, and in a neutral atom the atomic number equals the number of electrons."},{q:"Thermal decomposition of calcium nitrate will produce:",options:["CaO, NO₂ and O₂","CaO and CO₂","Ca(NO₂)₂ and O₂","CaO, NO and O₂"],answer:0,explanation:"A — CaO, NO₂ and O₂. Ca(NO₃)₂ → CaO + 2NO₂ + O₂."},{q:"Transition metal used as a catalyst in the manufacture of ammonia:",options:["Copper","Iron","Zinc","Nickel"],answer:1,explanation:"B — Iron. Iron is the catalyst in the Haber process: N₂ + 3H₂ ⇌ 2NH₃."},{q:"Element X occurs naturally as two isotopes ⁶⁹X and ⁷¹X in ratio 1 : 1. What is the relative atomic mass of X?",options:["69","70","71","69.5"],answer:1,explanation:"B — 70. RAM = (69 + 71) / 2 = 70."},{q:"Element P will not react easily with other elements. P is:",options:["Sodium","Chlorine","Magnesium","Argon"],answer:3,explanation:"D — Argon. P is argon, a noble gas with a stable octet, so it will not react easily."},{q:"Elements that belong to the same group of the Periodic Table:",options:["M and N","N and Q","M and Q","M and P"],answer:2,explanation:"C — M and Q. M is Mg (2,8,2) and Q is Ca (2,8,8,2); both have 2 outer electrons, so both are Group II."},{q:"Formula of the compound formed between M and N (M = Mg, N has 16 protons and 17 electrons):",options:["MN","M₂N","MN₂","M₂N₃"],answer:2,explanation:"C — MN₂. M forms Mg²⁺ and N forms N⁻, so Mg²⁺ + 2N⁻ → MgN₂."},{q:"Formula of the fifth
