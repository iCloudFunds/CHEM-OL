 air / oxygen through the warm acid to drive out NO₂, or redistil / heat gently to expel NO₂.","d) Example reaction where nitric acid acts as an acid: HNO₃ + NaOH → NaNO₃ + H₂O (neutralisation) — or HNO₃ + CaCO₃ → Ca(NO₃)₂ + CO₂ + H₂O.","e) Two uses of nitric acid: manufacture of fertilisers (NH₄NO₃), manufacture of explosives (TNT), manufacture of dyes / plastics / medicines.","f) One large-scale use of nitrogen: manufacture of fertilisers / ammonia, manufacture of explosives, inert atmosphere / food packaging."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q5 — Homologous Series: Alcohols, CₙH₂ₙ₊₁OH",prompt:["A homologous series has the general formula CₙH₂ₙ₊₁OH.","a) Give the general name of the members of this series.","b) i) State one difference between members.  ii) State what is similar between members.","c) Members react with metals such as sodium: i) Write the balanced equation for the second member (ethanol) with sodium.  ii) Name the other product formed in addition to hydrogen.","d) The second member reacts with ethanoic acid, catalysed by concentrated sulphuric acid: i) Name this type of reaction.  ii) Write the equation.  iii) Name the organic product.","e) Give the general name for the homologous series with general formula CₙH₂ₙ₊₁COOCₘH₂ₘ₊₁."],answer:["a) General name: alcohols / alkanols.","b) i) One difference: members differ by CH₂, differ in molecular mass / number of carbons / boiling point increases down the series.  ii) What is similar: same general formula, same functional group –OH, similar chemical properties / same type of reactions.","c) i) Balanced equation for ethanol with sodium: 2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂.  ii) Other product in addition to hydrogen: sodium ethoxide.","d) i) Type of reaction: esterification.  ii) Equation: CH₃CH₂OH + CH₃COOH ⇌ CH₃COOC₂H₅ + H₂O.  iii) Organic product: ethyl ethanoate.","e) General name: esters."]},{section:"Section B · Answer ALL 2",title:"Q6 — Titration, Dry Gases & Temperature",prompt:["Apparatus provided: pipette, burette, conical flask, indicator, 0.1 M Na₂CO₃, dilute HCl.","a) Identify each apparatus and give one use: conical flask, pipette (25 cm³), burette.","b) 25 cm³ of 0.1 M Na₂CO₃ is transferred into a conical flask + 3 drops of indicator, then titrated with dilute HCl to the end point: i) Name a suitable indicator.  ii) State the colour change at the end point.  iii) Results — Approximate: Final 23.5, Initial 0.0, Titre 23.5.  1st Accurate: Final 46.8, Initial 23.5, Titre 23.3.  2nd Accurate: Final 46.5, Initial 23.5, Titre 23.0. From the table, state the volume of HCl used (mean of the accurate titres).  iv) Calculate the concentration of HCl.","c) Describe how dry samples are prepared and collected: chlorine, Cl₂, and ammonia, NH₃.","d) A diagram shows the apparatus used to measure the temperature of a reaction mixture: i) Name the apparatus.  ii) Complete the table: temperature after addition = 36 °C, temperature before addition = 32 °C. What is the temperature change?"],answer:["a) Conical flask — holds the solution to be titrated / receives acid from the burette. Pipette (25 cm³) — transfers an accurate volume of Na₂CO₃ into the conical flask. Burette — delivers / measures the volume of dilute HCl added.","b) i) Suitable indicator: methyl orange.  ii) Colour change at the end point: yellow to orange / pink (yellow in alkali, orange / pink in acid).","b) iii) Volume of HCl used (mean of accurate titres) = (23.3 + 23.0) / 2 = 23.15 cm³.","b) iv) Na₂CO₃ + 2HCl → 2NaCl + CO₂ + H₂O. Moles Na₂CO₃ = 0.1 × 25/1000 = 0.0025 mol. Moles HCl = 2 × 0.0025 = 0.005 mol. Concentration of HCl = 0.005 × 1000 / 23.15 = 0.216 mol/dm³ (about 0.22 mol/dm³).","c) Chlorine, Cl₂ — upward displacement of air / downward delivery (denser than air, soluble, cannot be collected over water). Ammonia, NH₃ — downward displacement of air / upward delivery (less dense than air, very soluble).","d) i) Apparatus: thermometer.  ii) Temperature change = 36 − 32 = +4 °C (temperature rises, exothermic)."]},{section:"Section B · Answer ALL 2",title:"Q7 — Identifying Three Salts, SO₂ & Separation",prompt:["Labels fell off 3 identical bottles: calcium chloride, sodium sulphate, iron(II) bromide. Reagents available: BaCl₂, NaOH, AgNO₃, dilute HCl, flame test.","a) Bottle containing calcium chloride: (i) Flame test.  (ii) Add aqueous AgNO₃.","b) Bottle containing sodium sulphate: (i) Add aqueous BaCl₂.  (ii) Flame test.","c) Bottle containing iron(II) bromide: (i) Add aqueous NaOH.  (ii) Add aqueous AgNO₃.","d) Set-up to prepare and test a gas: Tube A contains a mixture of Na₂SO₃ + HCl, Tube B contains K₂Cr₂O₇ solution. (i) What is observed in the tube containing K₂Cr₂O₇?  (ii) Identify the gas in the first test tube A.  (iii) State one physical property of the gas in Tube A.","e) Suggest a method of separation for: ethanol / water; powdered sulphur / iron filings; solid NH₄Cl / NaCl.","f) Identify the equipment used to protect the eyes in the laboratory."],answer:["a) Calcium chloride: (i) Flame test — brick-red flame = Ca²⁺ ions.  (ii) Add aqueous AgNO₃ — white precipitate AgCl = Cl⁻ ions.","b) Sodium sulphate: (i) Add aqueous BaCl₂ — white precipitate BaSO₄, insoluble in dilute HCl = SO₄²⁻ ions.  (ii) Flame test — golden-yellow flame = Na⁺ ions.","c) Iron(II) bromide: (i) Add aqueous NaOH — green precipitate Fe(OH)₂ = Fe²⁺ ions.  (ii) Add aqueous AgNO₃ — pale-yellow / cream precipitate AgBr = Br⁻ ions.","d) (i) In the tube containing K₂Cr₂O₇: orange to green — the dichromate is reduced by SO₂.  (ii) Gas in Tube A: sulphur dioxide, SO₂.  (iii) One physical property: colourless, pungent / choking smell, denser than air, soluble in water.","e) Ethanol / water: fractional distillation (different boiling points). Powdered sulphur / iron filings: magnetic separation — use a magnet, iron is attracted, sulphur is left. Solid NH₄Cl / NaCl: sublimation — heat, NH₄Cl sublimes, NaCl remains.","f) Equipment to protect the eyes: safety goggles / goggles."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q8 — Four Factors Affecting Rate of Reaction",prompt:["State four factors that affect the rate of a chemical reaction. Using different examples, describe how each factor affects the rate."],answer:["Four factors: temperature, concentration, surface area, catalyst.","Temperature: increase temperature → particles gain kinetic energy, move faster, collide more often, more collisions have the activation energy, so the rate increases (e.g. Mg + acid reacts faster when heated).","Concentration: increase concentration → more particles per unit volume, more collisions per second, so the rate increases (e.g. concentrated acid reacts faster).","Surface area: increase surface area (powder / smaller pieces) → more surface is exposed, more collisions, so the rate increases (e.g. powdered marble chips react faster than lumps).","Catalyst: a catalyst lowers the activation energy, so more particles have enough energy to react, the rate increases, and the catalyst is not used up (e.g. MnO₂ in the decomposition of H₂O₂)."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q9 — Preparing Salts",prompt:["Salts can be prepared in the laboratory by: a) neutralisation, b) action of an acid on an insoluble base, c) double decomposition.","Using a suitable example in each case, describe how a pure, dry sample of each salt can be prepared."],answer:["a) Neutralisation: NaOH + HCl → NaCl + H₂O. Mix the acid and the base, evaporate the solution to the crystallisation point, cool, filter the crystals, wash and dry.","b) Action of an acid on an insoluble base: CuO + H₂SO₄ → CuSO₄ + H₂O. Add excess CuO to warm acid, stir, filter off the excess base, evaporate the filtrate, cool, filter the crystals and dry.","c) Double decomposition: BaCl₂ + Na₂SO₄ → BaSO₄ + 2NaCl. Mix the solutions, insoluble BaSO₄ precipitates, filter, wash the precipitate with distilled water and dry in an oven."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q10 — Manufacture of Sulphuric Acid",prompt:["The manufacture of H₂SO₄ requires SO₂ as one raw material.","a) Name two principal raw materials.","b) Name another raw material and its source, and describe how sulphuric acid is obtained in industry.","c) State two large-scale uses of sulphuric acid."],answer:["a) Two principal raw materials: sulphur (S) and air / oxygen (O₂).","b) Other raw material = water, source = river / tap water / steam. Contact Process: S + O₂ → SO₂. 2SO₂ + O₂ ⇌ 2SO₃ (V₂O₅ catalyst, 450 °C, 2 atm). SO₃ + H₂SO₄ → H₂S₂O₇ (oleum). H₂S₂O₇ + H₂O → 2H₂SO₄ (dilute the oleum — do NOT add water directly to SO₃).","c) Two large-scale uses: manufacture of fertilisers (ammonium sulphate, superphosphate), manufacture of detergents / soaps, manufacture of dyes / paints / explosives / medicines, pickling metals / car batteries (any two)."]}],vf=[{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q1 — Periodic Table: A–H (letters NOT usual symbols)",prompt:["Elements A–H are not the usual symbols. A: Group I, Period 2. B: Group II, Period 3. E: Group III, Period 3. F is a reddish liquid at room temperature.","a) i) Which element is stored in paraffin oil?  ii) Which element is a reddish liquid at room temperature?","b) i) Give the electronic configuration of B.  ii) Why is B classified in Group II?","c) Element E has RAM 27: i) Number of protons in E?  ii) Number of electrons in E?  iii) Number of neutrons in E?","d) X and Y have atomic numbers 6 and 17: i) Give the formula of the compound formed between X and Y.  ii) State the bond type in that compound.","e) Sodium chloride has formula NaCl. What is the charge of the metallic ion in sodium chloride?"],answer:["a) i) Stored in paraffin oil: A — lithium, a Group I metal, reactive, kept away from air and moisture.  ii) Reddish liquid at room temperature: F — bromine, a halogen, reddish-brown liquid.","b) i) Electronic configuration of B = 2,8,2 — B is magnesium.  ii) B is classified in Group II because it has 2 electrons in its outer shell / valence shell.","c) E is aluminium, RAM 27.  i) Protons = 13.  ii) Electrons = 13.  iii) Neutrons = 27 − 13 = 14.","d) X = carbon (atomic number 6), Y = chlorine (atomic number 17).  i) Formula = CCl₄ — carbon tetrachloride.  ii) Bond type = covalent bonding.","e) Charge of the metallic ion in NaCl = +1 — Na⁺."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q2 — Elements: Sodium, Silver, Calcium, Iron, Aluminium",prompt:["Elements given: sodium, silver, calcium, iron, aluminium.","a) i) Which is a transition metal used as a catalyst?  ii) Which element forms an amphoteric oxide?  iii) Which element is a basic constituent of bones?","b) Arrange the elements in order of decreasing reactivity, most reactive first.","c) Calcium reacts with dilute HCl: i) State an observation.  ii) Write the balanced equation.","d) State the products when a piece of sodium reacts with water.","e) Which element is used for making coins and cups?","f) Which element gives a characteristic intense yellow flame colour?"],answer:["a) i) Transition metal used as a catalyst: iron (Fe) — Haber process.  ii) Element that forms an amphoteric oxide: aluminium (Al) — Al₂O₃ reacts with both acid and alkali.  iii) Basic constituent of bones: calcium (Ca) — bones and teeth.","b) Decreasing reactivity, most reactive first: sodium, calcium, aluminium, iron, silver — Na > Ca > Al > Fe > Ag.","c) i) Observation: effervescence / bubbles, calcium dissolves, gas evolved.  ii) Balanced equation: Ca + 2HCl → CaCl₂ + H₂.","d) Products when sodium reacts with water: sodium hydroxide + hydrogen — 2Na + 2H₂O → 2NaOH + H₂.","e) Element used for making coins and cups: silver (Ag).","f) Element that gives a characteristic intense yellow flame colour: sodium (Na) — golden-yellow."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q3 — Ammonia Equilibrium & Rate: CaCO₃ + HCl",prompt:["N₂ + 3H₂ ⇌ 2NH₃, ΔH = −198 kJ/mol.","a) i) State one source of hydrogen and one source of nitrogen.  ii) What happens to the equilibrium when pressure is increased? What happens when temperature is increased?  iii) The yield of NH₃ is increased by withdrawing NH₃. Name the principle and state it.","b) CaCO₃ + 2HCl → CaCl₂ + CO₂ + H₂O.  i) State two factors that affect the rate of this reaction.  ii) The volume of CO₂ is recorded from a graduated syringe. To obtain more CO₂ in a shorter period, what should be done, and why?"],answer:["a) i) Source of hydrogen: natural gas / methane / water / steam. Source of nitrogen: air.","a) ii) Pressure increased: equilibrium shifts to the right, more NH₃, because there are fewer gas moles on the right. Temperature increased: equilibrium shifts to the left, less NH₃, more N₂ and H₂, because the forward reaction is exothermic.","a) iii) Principle: Le Chatelier's Principle. Statement: when a system at equilibrium is disturbed, it shifts to counteract the change — removing product shifts the equilibrium to the right.","b) i) Two factors that affect the rate: concentration of HCl, temperature, surface area / particle size of CaCO₃ (any two).","b) ii) Increase the concentration of HCl. Explanation: more acid particles per unit volume, more collisions per second, faster rate, more CO₂ sooner."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q4 — Organic: A C₂H₅OH, B CH₃COOH, C C₂H₄, D C₂H₆",prompt:["A: C₂H₅OH (ethanol), B: CH₃COOH (ethanoic acid), C: C₂H₄ (ethene), D: C₂H₆ (ethane).","a) What is a homologous series?","b) Select from A to D: i) The unsaturated compound.  ii) The compound that readily undergoes substitution reaction with halogens.","c) Compounds A and B react in the presence of concentrated sulphuric acid: i) Write the equation.  ii) To which family does the main product belong?","d) i) Give different structural forms of compound A.  ii) How are these structural forms called?","e) Identify a reagent used to distinguish C from D, and state the observation."],answer:["a) Homologous series: a series of organic compounds with the same general formula, the same functional group, similar chemical properties, differing by CH₂, showing a gradation in physical properties.","b) i) Unsaturated compound: C — C₂H₄, ethene, double bond.  ii) Compound that readily undergoes substitution with halogens: D — C₂H₆, ethane, alkane, substitution.","c) i) Equation: CH₃CH₂OH + CH₃COOH ⇌ CH₃COOC₂H₅ + H₂O.  ii) Family of the main product: esters — ethyl ethanoate.","d) i) Different structural forms of A: ethanol CH₃CH₂OH and methoxymethane CH₃–O–CH₃.  ii) These structural forms are called isomers / isomerism / functional group isomerism.","e) Reagent: bromine water / aqueous bromine. Observation: C (ethene) decolourises bromine water — orange to colourless. D (ethane) does NOT decolourise — no change."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q5 — Mole, Magnesium + Acid & Iron Extraction",prompt:["a) Define the mole.","b) 2.4 g of magnesium react with excess dilute hydrochloric acid: (i) Calculate the moles of magnesium in 2.4 g.  (ii) Calculate the volume of hydrogen gas evolved at room temperature and pressure when 2.4 g of Mg completely react.","c) In the extraction of iron, carbon monoxide is used to reduce haematite (Fe₂O₃): (i) Give the equation to show how carbon monoxide is formed in the blast furnace.  (ii) Give the equation for the reduction of haematite to iron.","d) Identify the substance used to remove sandy impurities.","e) Give one use of iron in our homes."],answer:["a) Mole: the amount of substance containing 6.02 × 10²³ particles (Avogadro number) — the amount containing as many particles as there are in 12 g of carbon-12.","b) (i) Moles of magnesium in 2.4 g: moles = 2.4 / 24 = 0.1 mol.  (ii) Mg + 2HCl → MgCl₂ + H₂. Moles H₂ = 0.1 mol. Volume = 0.1 × 24,000 = 2400 cm³.","c) (i) Carbon monoxide formed in the blast furnace: C + CO₂ → 2CO (also 2C + O₂ → 2CO, C + O₂ → CO₂).  (ii) Reduction of haematite: Fe₂O₃ + 3CO → 2Fe + 3CO₂.","d) Substance used to remove sandy impurities: limestone / calcium carbonate, CaCO₃ — it forms slag, CaSiO₃.","e) One use of iron in our homes: cooking pots / pans / utensils / nails / gates / roofing / cutlery / tools (any one)."]},{section:"Section B · Answer ALL 2",title:"Q6 — Titration, Copper Oxide Formula",prompt:["a) Sketch and name the laboratory apparatus used during acid / base titration to: (i) Transfer 25 cm³ of a base into a conical flask.  (ii) Prepare a standard solution.","b) A student transferred 25 cm³ of sodium carbonate solution into a conical flask and titrated it with dilute HCl from equipment P: (i) Draw and name equipment P.  (ii) Results of two accurate titrations — Second reading of P: 24.8, 46.6. First reading of P: 2.5, 22.4. Complete the table, state the volume of dilute HCl used (mean), and calculate the concentration of sodium carbonate if 0.1 M HCl was used.  (iii) Methyl orange was used — state the colour change at the end point.  (iv) During an acid–base titration, how many times do we usually carry out the titration process?","c) Experiment to determine the formula of an oxide of copper: Mass of boat alone = 8.320 g. Mass of boat + oxide = 10.872 g. Mass of boat + copper = 10.568 g. Determine the formula of the oxide."],answer:["a) (i) To transfer 25 cm³ of a base into a conical flask: pipette (25 cm³ pipette).  (ii) To prepare a standard solution: volumetric flask.","b) (i) Equipment P: burette — it delivers / measures the volume of dilute HCl.","b) (ii) Titre volume: 24.8 − 2.5 = 22.3 cm³. 46.6 − 22.4 = 24.2 cm³. Volume of dilute HCl used (mean) = (22.3 + 24.2) / 2 = 23.25 cm³. Na₂CO₃ + 2HCl → 2NaCl + CO₂ + H₂O. Moles HCl = 0.1 × 23.25/1000 = 0.002325 mol. Moles Na₂CO₃ = 0.002325 / 2 = 0.0011625 mol. Concentration of Na₂CO₃ = 0.0011625 × 1000/25 = 0.0465 mol/dm³ (about 0.047 mol/dm³).","b) (iii) Methyl orange: initial colour yellow (in alkali). Final colour orange / pink (in acid).  (iv) Titration is usually carried out 3 times — 1 approximate + 2 accurate.","c) Mass of oxide = 10.872 − 8.320 = 2.552 g. Mass of copper = 10.568 − 8.320 = 2.248 g. Mass of oxygen = 2.552 − 2.248 = 0.304 g. Moles Cu = 2.248 / 64 = 0.0351 mol. Moles O = 0.304 / 16 = 0.019 mol. Ratio Cu : O = 0.0351 : 0.019 = 1.85 : 1 = about 2 : 1. Formula = Cu₂O — copper(I) oxide."]},{section:"Section B · Answer ALL 2",title:"Q7 — Salts A, B, C, Chlorine & Separating Funnel",prompt:["a) A gas X is soluble in water and is ammonia. Draw the apparatus a student will use to dissolve gas X in water, and describe it.","b) A student was provided with three salts A, B and C, laboratory equipment and reagents: concentrated HCl, aqueous NaOH, aqueous BaCl₂, aqueous AgNO₃, dilute HCl. Tests: (a) Flame test on solid sample A. (b) Solid sample A heated in a test tube. (ii) To 2 cm³ of solution B add 3 drops of aqueous NaOH. (iii) To 2 cm³ of solution B add 3 drops of aqueous AgNO₃. (iv) To 2 cm³ of aqueous solution C add 3 drops of aqueous BaCl₂ followed by 2 cm³ of dilute HCl, plus a flame test. (v) To 2 cm³ of C add 5 drops of dilute HCl.","d) Using the information, identify A, B and C.","e) A student was provided with: solid sodium chloride, concentrated H₂SO₄, 2 flat-bottomed flasks / thistle funnel, delivery tubes, gas jar. Draw the experimental set-up used to prepare and collect a dry sample of chlorine gas in the laboratory. Describe and label all parts.","f) A set-up is used to separate a mixture of two liquids A and B (separating funnel diagram). Identify liquids A and B that can be separated using this method."],answer:["a) Dissolving ammonia in water: an inverted funnel just above the water surface in a beaker, with a delivery tube from the gas source to the funnel. The funnel rim just touches the water surface; the gas dissolves in the water. If water rises into the funnel, it breaks the suck-back / prevents suck-back.","b) (a) Flame test on solid sample A: observation — brick-red flame. Conclusion — presence of calcium ion, Ca²⁺. (b) Solid sample A heated in a test tube: observation — a brown gas is evolved. Conclusion — presence of nitrate ion, NO₃⁻ (NO₂, brown gas). So A = calcium nitrate.","b) (ii) To solution B + aqueous NaOH: observation — a reddish-brown precipitate is formed. Conclusion — presence of iron(III) ion, Fe³⁺ — Fe(OH)₃, reddish-brown. (iii) To solution B + aqueous AgNO₃: observation — pale-yellow / cream precipitate, AgBr. Conclusion — presence of bromide ion, Br⁻. So B = iron(III) bromide.","b) (iv) To solution C + aqueous BaCl₂ followed by dilute HCl: observation — a white precipitate is formed (BaSO₃ / BaSO₄), plus a bluish-green flame colour in the flame test. Conclusion — presence of sulphite / sulphate ion and copper(II) ion. (v) To C + dilute HCl: observation — effervescence, a gas with the smell of burnt matches is evolved. Conclusion — presence of sulphite ion, SO₃²⁻ — SO₂ gas. So C = copper(II) sulphite.","d) A: calcium nitrate, Ca(NO₃)₂. B: iron(III) bromide, FeBr₃. C: copper(II) sulphite, CuSO₃.","e) Dry chlorine: a flat-bottomed flask with solid NaCl + concentrated H₂SO₄ added through a thistle funnel, heated gently. The gas is passed through a drying bottle containing concentrated H₂SO₄ to dry it, then collected in a gas jar by upward displacement of air / downward delivery (Cl₂ is denser than air and soluble in water). Equation: 2NaCl + H₂SO₄ → Na₂SO₄ + 2HCl; chlorine gas is evolved on heating with an oxidising agent in the exam set-up, dried and collected as described. Label: flask, thistle funnel, heat, drying bottle with concentrated H₂SO₄, delivery tubes, gas jar.","f) Separating funnel — immiscible liquids. A = oil / petrol / ether (upper layer, less dense). B = water (lower layer, denser). Example: water and oil / water and kerosene."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q8 — Preparing Salts",prompt:["Methods used to prepare salts in the laboratory: neutralisation, action of dilute acids on metals, double decomposition.","a) For each method, name a suitable salt and describe how a pure, dry sample is prepared.","b) State two physical properties of salts."],answer:["a) Neutralisation: sodium chloride, NaCl, from NaOH + HCl → NaCl + H₂O. Mix the acid and the base, evaporate to the crystallisation point, cool, filter the crystals, wash and dry.","a) Action of a dilute acid on a metal: zinc sulphate, ZnSO₄, from Zn + H₂SO₄ → ZnSO₄ + H₂. Add excess zinc to warm dilute acid, filter off the excess zinc, evaporate the filtrate, cool, filter the crystals and dry.","a) Double decomposition: barium sulphate, BaSO₄, from BaCl₂ + Na₂SO₄ → BaSO₄ + 2NaCl. Mix the solutions, insoluble BaSO₄ precipitates, filter, wash the precipitate with distilled water and dry in an oven.","b) Two physical properties of salts: crystalline solids with high melting / boiling points. They conduct electricity when molten or in aqueous solution (dissolved), but not when solid. (Also: some are soluble, some insoluble in water; brittle, hard.)"]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q9 — Ethanol from Starch by Fermentation",prompt:["a) Ethanol is manufactured from starch by fermentation. With the help of chemical equations, describe the manufacturing process.","b) Give two large-scale uses of the ethanol obtained in this way."],answer:["a) Hydrolysis of starch: (C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆ — diastase / acid hydrolysis, glucose is formed.","a) Fermentation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ — zymase / yeast enzyme, 30–37 °C, anaerobic, 2–3 days. Distillation concentrates the ethanol.","b) Two large-scale uses: manufacture of alcoholic drinks / beverages. Manufacture of methylated spirit / fuel / solvent. Manufacture of ethanoic acid / esters / disinfectant / hand sanitiser / bioethanol fuel (any two)."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q10 — Conversions",prompt:["Conversions — describe how each is carried out, the reagents used and the corresponding reactions: a) Fe²⁺ → Fe³⁺,  b) Fe³⁺ → Fe,  c) C₂H₆ → C₂H₄,  d) CH₃COOH → C₂H₅OH."],answer:["a) Fe²⁺ → Fe³⁺: oxidation — add an oxidising agent, e.g. chlorine water / bromine water / acidified KMnO₄ / H₂O₂: 2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻.","b) Fe³⁺ → Fe: reduction — reduce with carbon / carbon monoxide / hydrogen, e.g. in the blast furnace: Fe₂O₃ + 3CO → 2Fe + 3CO₂, or by electrolysis.","c) C₂H₆ → C₂H₄: dehydrogenation / cracking — heat with a catalyst / steam cracking: C₂H₆ → C₂H₄ + H₂ (about 800 °C, catalyst).","d) CH₃COOH → C₂H₅OH: reduction — reduce with a reducing agent / hydrogen + catalyst: CH₃COOH + 4[H] → CH₃CH₂OH + H₂O (or CH₃COOH + 2H₂ → C₂H₅OH + H₂O, catalyst)."]}],bf=[{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q1 — Atoms: X (24/12) and Y (19/9)",prompt:["X has mass number 24 and proton number 12. Y has mass number 19 and proton number 9.","a) Give the electronic configuration of X and of Y.","b) State the group and period of X and of Y.","c) i) What does the number 24 tell you about atom X?  ii) How many protons are in atom Y?  iii) How many neutrons are in atom X?","d) Describe, with a dot-and-cross diagram, the bonding formed when X combines with Y."],answer:["a) X: 2,8,2.  Y: 2,7.","b) X: Group II, Period 3.  Y: Group VII, Period 2.","c) i) 24 = mass number / nucleon number.  ii) Protons in Y = 9.  iii) Neutrons in X = 24 − 12 = 12.","d) Dot-and-cross: the Mg atom gives 2 electrons to 2 F atoms. Mg²⁺ [2,8]²⁺ and each F⁻ [2,8]⁻. The compound is MgF₂. Ionic bonding — strong electrostatic attraction between oppositely charged ions."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q2 — Manufacture of Nitric Acid",prompt:["Flow: N₂ + H₂ —A→ NH₃ —B / X→ nitrogen monoxide —C→ nitrogen dioxide → nitric acid.","a) Name the catalyst used in A.","b) i) Identify X.  ii) Write the equation for the reaction in B.","c) Write the equation for the oxidation of nitrogen monoxide.","d) Write the equation for the formation of nitric acid from nitrogen dioxide.","e) Why is laboratory nitric acid yellow / brownish-yellow?","f) State two large-scale uses of nitric acid."],answer:["a) Catalyst in A = iron (finely divided) — Haber process, 450 °C, 200 atm.","b) i) X = oxygen / air.  ii) 4NH₃ + 5O₂ → 4NO + 6H₂O.","c) NO oxidised: 2NO + O₂ → 2NO₂.","d) 4NO₂ + O₂ + 2H₂O → 4HNO₃  (or 3NO₂ + H₂O → 2HNO₃ + NO).","e) Laboratory nitric acid is yellow / brownish-yellow due to dissolved nitrogen dioxide.","f) Two large-scale uses: fertilisers (ammonium nitrate) and explosives (TNT / nitroglycerine)."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q3 — Energy: Exothermic & Heat of Combustion",prompt:["a) i) Define exothermic.  ii) Define heat of combustion.","b) 2CH₃OH + 3O₂ → 2CO₂ + 4H₂O, ΔH = −726 kJ/mol.  i) Sketch and label the energy level diagram.  ii) Calculate the heat evolved when 200 g of water is heated through 25.4 °C (q = mcΔT).","c) Ag⁺ + Cl⁻ → AgCl, ΔH = −657 kJ/mol.  i) Is this exothermic or endothermic? Explain using energy levels.  ii) How much energy is evolved per mole of AgCl formed?"],answer:["a) i) Exothermic = a reaction that gives out heat to the surroundings.  ii) Heat of combustion = heat evolved when 1 mole of a substance burns completely in oxygen.","b) i) Energy level diagram: reactants higher than products, the drop = 726 kJ/mol, with an activation-energy hump between them.","b) ii) q = mcΔT = 200 × 4.2 × 25.4 = 21,336 J = 21.3 kJ evolved.","c) i) Exothermic — reactants are higher in energy than products; heat is given out.  ii) Energy evolved = 657 kJ per mole of AgCl formed."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q4 — Rubidium, Group I",prompt:["Rubidium is below potassium in Group I.","a) i) How is rubidium stored?  ii) Why is it stored this way?  iii) Compare its reaction with water to that of potassium.  iv) Name one other element in the same group.","b) Give the formula of rubidium oxide and state whether it is acidic or basic.","c) Write the equation for the thermal decomposition of rubidium nitrate.","d) How is rubidium extracted?"],answer:["a) i) Stored under kerosene / paraffin oil.  ii) It reacts vigorously with air / oxygen and water, so air and moisture must be excluded.  iii) It reacts more vigorously than K — reactivity increases down Group I.  iv) One other element in the same group: lithium / sodium / caesium / francium.","b) Formula Rb₂O — basic oxide / alkaline oxide.","c) 2RbNO₃ → 2RbNO₂ + O₂.","d) Electrolysis of molten rubidium chloride / molten rubidium hydroxide (electrolysis of fused RbCl)."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q5 — Homologous Series: C₂H₄ & C₂H₆",prompt:["a) i) Define homologous series.  ii) Name the two homologous series to which C₂H₄ and C₂H₆ belong.","b) Write the equation for the addition of chlorine to C₂H₄.","c) How would you distinguish C₂H₄ from C₂H₆?","d) i) Name the reagent used to convert C₂H₄ to C₂H₆.  ii) Name the type of reaction and state the conditions.","e) State one large-scale use of C₂H₄."],answer:["a) i) Homologous series = a family of compounds with the same general formula and the same functional group, differing by CH₂, with similar chemical properties and a gradation in physical properties.  ii) Two series: alkanes (C₂H₆) and alkenes (C₂H₄).","b) Addition: C₂H₄ + Cl₂ → C₂H₄Cl₂ (1,2-dichloroethane).","c) C₂H₄ decolourises bromine water / acidified KMnO₄; C₂H₆ does not.","d) i) Reagent: hydrogen, H₂.  ii) Hydrogenation / addition, nickel catalyst, 150–200 °C.","e) One large-scale use of C₂H₄: manufacture of polythene / ethanol / ethanoic acid."]},{section:"Section B · Answer ALL 2",title:"Q6 — Titration, Dry CO₂ & Sublimation",prompt:["Titration: 0.02 M HNO₃ against Na₂CO₃. Titres: approximate 22.7 cm³, 1st accurate 22.6 cm³, 2nd accurate 22.6 cm³.","a) i) What apparatus transfers 25 cm³ of Na₂CO₃?  ii) What is the acid filled in?  iii) How should the conical flask be rinsed, and why?","b) i) Complete the table.  ii) Calculate the mean titre.","c) Name the indicator and state its colour change.","d) Write the equation and calculate the concentration of Na₂CO₃ in mol/dm³.","e) Describe how dry CO₂ is prepared and collected. Give the equation.","f) A mixture of NH₄Cl + NaCl is separated by sublimation. i) What is apparatus B? ii) Why is the mixture heated?","g) i) Why wear hand gloves?  ii) Why wear safety goggles?"],answer:["a) i) Transfer 25 cm³ Na₂CO₃: pipette.  ii) Acid filled in: burette.  iii) Conical flask rinsed with distilled water only, not with solution, so the moles are unchanged.","b) i) Table: approximate 22.7, 1st accurate 22.6, 2nd accurate 22.6.  ii) Mean titre = (22.6 + 22.6) / 2 = 22.6 cm³ (approximate not used).","c) Indicator: methyl orange. Colour: yellow (in alkali) → orange / pink / orange-red (in acid) at the end point.","d) Na₂CO₃ + 2HNO₃ → 2NaNO₃ + CO₂ + H₂O. Moles HNO₃ = 0.02 × 22.6/1000 = 4.52 × 10⁻⁴ mol. Moles Na₂CO₃ = half = 2.26 × 10⁻⁴ mol in 25 cm³. Concentration = 2.26 × 10⁻⁴ × 1000/25 = 0.00904 mol/dm³.","e) Dry CO₂: dilute nitric acid + solid sodium carbonate in a flat-bottom flask, thistle funnel, delivery tube, pass the gas through concentrated sulphuric acid (drying agent) in a second flask, collect the dry gas in a gas jar by downward delivery / upward displacement. Equation: Na₂CO₃ + 2HNO₃ → 2NaNO₃ + CO₂ + H₂O.","f) i) Apparatus B = cold surface / inverted funnel / watch glass where NH₄Cl collects.  ii) Heated because NH₄Cl sublimes — changes directly from solid to vapour on heating and condenses on the cold surface; NaCl remains.","g) i) Hand gloves: protect hands from corrosive / harmful chemicals / heat.  ii) Safety goggles: protect eyes from splashes / harmful vapours."]},{section:"Section B · Answer ALL 2",title:"Q7 — Salts A, B, C & Standard Solution",prompt:["Salt A: flame test and dilute HCl test. Salt B: NaOH test and BaCl₂ + dilute HCl test. Salt C: NaOH + litmus test and acidified AgNO₃ test.","a) (i) Flame test on A gives a golden / yellow flame. What does this show?  (ii) Dilute HCl on solid A gives a gas smelling of burning matches. What does this show?","b) (i) NaOH on B gives a blue precipitate. What does this show?  (ii) BaCl₂ + dilute HCl on B gives a white precipitate. What does this show?","c) (i) NaOH on C gives a gas turning damp red litmus blue. What does this show?  (ii) Acidified AgNO₃ on C gives a white precipitate. What does this show?","d) Identify A, B and C.","e) State how ammonia, sulphur dioxide and hydrogen are collected, with a reason for each.","f) Mass of salt weighed = 16.10 − 5.56 g. Calculate the amount in moles (Mr Na₂CO₃ = 106)."],answer:["a) (i) Golden / yellow flame = Na⁺ / sodium ions present.  (ii) Gas with smell of burning matches = SO₂, so SO₃²⁻ / sulphite present.","b) (i) Blue precipitate = Cu(OH)₂, Cu²⁺ present.  (ii) White precipitate BaSO₄ = SO₄²⁻ / sulphate present.","c) (i) Gas turning damp red litmus blue = NH₃, NH₄⁺ present.  (ii) White precipitate AgCl = Cl⁻ / chloride present.","d) A = sodium sulphite, Na₂SO₃.  B = copper(II) sulphate, CuSO₄.  C = ammonium chloride, NH₄Cl.","e) Ammonia NH₃ — upward displacement / downward delivery (less dense than air, very soluble, cannot collect over water). Sulphur dioxide SO₂ — upward displacement (denser than air, soluble). Hydrogen H₂ — downward displacement / over water (less dense, insoluble).","f) Mass salt weighed = 16.10 − 5.56 = 10.54 g. Amount = 10.54 / 106 (Mr Na₂CO₃) = 0.0994 mol."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q8 — Bonding: Ionic, Covalent, Metallic",prompt:["Describe ionic, covalent and metallic bonding, giving one example of each. Use dot-and-cross diagrams where appropriate. State the properties that follow from each type of bonding."],answer:["Ionic — e.g. NaCl: Na loses 1e⁻, Cl gains 1e⁻ → Na⁺ Cl⁻. Strong electrostatic attraction gives a giant lattice, high melting point, conducts when molten / dissolved.","Covalent — e.g. CH₄ / H₂O: sharing electron pairs, dot-and-cross diagrams show the shared pairs. Simple molecules → low melting point, poor conductors.","Metallic — e.g. Mg / Fe: positive ions in a sea of delocalised electrons. The attraction holds the lattice together; the electrons conduct electricity and let layers slide, so metals are malleable / ductile."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q9 — Conversions",prompt:["Give reagents and conditions for: a) ethanol → ethanoic acid,  b) methane → chloromethane,  c) ethene → ethane,  d) ethanoic acid → ethyl ethanoate."],answer:["a) Ethanol to ethanoic acid: oxidising agent — acidified K₂Cr₂O₇ / KMnO₄, reflux, oxidation.","b) Methane to chloromethane: Cl₂, UV light, free-radical substitution.","c) Ethene to ethane: H₂, nickel catalyst, hydrogenation / addition.","d) Ethanoic acid to ethyl ethanoate: ethanol, concentrated H₂SO₄ catalyst, reflux, esterification."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q10 — Sodium Hydroxide: Chlor-Alkali",prompt:["a) Describe the large-scale manufacture of sodium hydroxide.","b) State two large-scale uses of sodium hydroxide."],answer:["a) Chlor-alkali / Castner–Kellner: electrolysis of concentrated brine (NaCl solution). At the cathode: H₂ + NaOH. At the anode: Cl₂. A diaphragm / membrane / mercury cell separates the products.","b) Two large-scale uses: soap / detergents, paper, textiles, aluminium extraction / petroleum refining, drain cleaner (any two)."]}],xf=[{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q1 — Periodic Table: A, B, C, D",prompt:["Table: A — Mass 55, Atomic 17, Proton 17.  B — Mass 24, Atomic 12, Proton 12, Neutron 12, Electron 12.  C — Mass Z, Atomic 3, Proton 3, Neutron 4.  D — Mass 16, Atomic 8, Proton 8, Neutron 8, Electron 8.","a) Complete the table: i) X = neutrons in A.  ii) Y = electrons in A.  iii) Z = mass number of C.","b) A and B bonding: i) Name the compound formed.  ii) State the bond type.","c) Electronic configuration: i) A.  ii) D.","d) Group: i) C.  ii) D.","e) How would element C be stored in the laboratory?"],answer:["a) i) X = neutrons in A = 55 − 17 = 38.  ii) Y = electrons in A = 17 (neutral atom: electrons = protons).  iii) Z = mass number of C = 3 + 4 = 7.","b) i) Compound formed = magnesium chloride, MgCl₂.  ii) Bond type = ionic bonding.","c) i) A = 2,8,7.  ii) D = 2,6.","d) i) C = Group I.  ii) D = Group VI.","e) Element C (lithium) is stored under paraffin oil / kerosene — kept away from air and moisture, because it is reactive."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q2 — Group I Elements",prompt:["Group I elements include sodium. Other elements given: calcium, copper, magnesium.","a) Complete the table: Group I, Element Sodium, General name.","b) State one physical property of Group I metals.","c) State one chemical property of Group I metals.","d) Write equations for the reactions with water: sodium and magnesium.","e) i) Name a compound of sodium and chlorine commonly used in homes.  ii) State the bond type in e(i).","f) In the lab preparation of gas X, NaCl + conc. H₂SO₄ + MnO₂ are mixed: i) Name gas X.  ii) State the function of MnO₂."],answer:["a) Group I, Element Sodium, General name = alkali metals.","b) One physical property of Group I metals: soft / low density / shiny / low melting point (any one).","c) One chemical property: react vigorously with water to form an alkaline solution; lose 1 electron to form +1 ions.","d) Sodium: 2Na + 2H₂O → 2NaOH + H₂.  Magnesium: Mg + 2H₂O → Mg(OH)₂ + H₂ (hot water / steam).","e) i) Sodium chloride / common salt / table salt.  ii) Ionic bonding.","f) i) Gas X = chlorine, Cl₂.  ii) Function of MnO₂ = oxidising agent."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q3 — Hydrocarbon C₄H₁₀",prompt:["Hydrocarbon C₄H₁₀.","a) i) State the general formula of its homologous series.  ii) Name the homologous series.","b) C₄H₁₀ exists in more than one structural form: i) Draw and name the forms.  ii) What name is given to these structural forms?","c) Write the balanced equation for the combustion of C₄H₁₀.","d) State one domestic use of C₄H₁₀."],answer:["a) i) General formula = CₙH₂ₙ₊₂.  ii) Homologous series = alkanes.","b) i) Butane CH₃CH₂CH₂CH₃ and 2-methylpropane CH₃CH(CH₃)CH₃.  ii) Name given to the structural forms = isomers / isomerism.","c) Balanced equation: 2C₄H₁₀ + 13O₂ → 8CO₂ + 10H₂O.","d) Domestic use of C₄H₁₀: cooking gas / LPG / fuel for heating / lighting."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q4 — Isotopes of W & Enthalpy Change",prompt:["Element W (W is not the usual symbol) has isotopes ²⁴W and ²⁶W, with abundances 60% and 40% respectively.","a) i) Define isotopy.  ii) What makes isotopes different?  iii) Calculate the relative atomic mass (RAM) of W.","b) Reaction A: HCl + NaOH → NaCl + H₂O, ΔH = −57.12 kJ/mol.  Reaction B: C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O, ΔH = −1273 kJ/mol.","i) Based on the reactants, name the type of reaction for A and for B.  ii) Based on the energy changes, name the type of reaction for A and for B.  iii) Define enthalpy change.","iv) Calculate the volume of CO₂ evolved when 5.2 g of C₂H₅OH is burnt at room temperature."],answer:["a) i) Isotopy = the existence of atoms of the same element, with the same number of protons, but different numbers of neutrons / different mass numbers.","a) ii) Isotopes are different because they have a different number of neutrons / different mass numbers.","a) iii) RAM of W = (24 × 60 + 26 × 40) / 100 = (1440 + 1040) / 100 = 2480 / 100 = 24.8.","b) i) Based on reactants: A = neutralisation (acid + base).  B = combustion (burning in oxygen).","b) ii) Based on energy changes: both are exothermic — ΔH is negative, heat is given out.","b) iii) Enthalpy change = the heat change at constant pressure when a reaction takes place / the heat evolved or absorbed when 1 mole reacts.","b) iv) Moles ethanol = 5.2 / 46 = 0.113 mol. Moles CO₂ = 2 × 0.113 = 0.226 mol. Volume = 0.226 × 24,000 = 5424 cm³ (about 5420 cm³)."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q5 — Manufacture of Ammonia",prompt:["Flow diagram for the industrial manufacture of ammonia. Raw materials X and Y are fed into the reactor.","a) Name the sources of the raw materials X and Y.","b) i) Write the balanced equation for the reaction in the reactor.  ii) State the function of iron in the reactor.  iii) How is wastage of unreacted N₂ and H₂ minimised?","c) State the function of the cooler.","d) Ammonia is used to produce the nitrogen fertiliser ammonium nitrate, NH₄NO₃ (RMM = 80).  i) Name the substance reacted with ammonia to form ammonium nitrate and write the equation.  ii) Calculate the percentage of nitrogen in ammonium nitrate."],answer:["a) Sources of raw materials: X = air (source of nitrogen).  Y = natural gas / methane / water / steam (source of hydrogen).","b) i) Balanced equation in the reactor: N₂ + 3H₂ ⇌ 2NH₃.","b) ii) Function of iron in the reactor: catalyst — it speeds up the reaction and lowers the activation energy.","b) iii) Wastage is minimised because the unreacted gases are recycled / passed again through the reactor (loop).","c) Function of the cooler: to cool / condense / liquefy ammonia, and so separate NH₃ from the unreacted gases.","d) i) Substance reacted with ammonia to form ammonium nitrate: nitric acid, HNO₃. Equation: NH₃ + HNO₃ → NH₄NO₃.","d) ii) Percentage of nitrogen in ammonium nitrate: %N = 28 / 80 × 100 = 35%."]},{section:"Section B · Answer ALL 2",title:"Q6 — Salts X, Y, Z & Dry Ammonia",prompt:["Three salts X, Y and Z are tested with aqueous NaOH, aqueous BaCl₂ and dilute HCl.","a) X: i) 2 cm³ X + 3 drops NaOH + warmed: a colourless pungent gas is evolved, turning damp red litmus blue.  ii) A sample of X strongly heated: a brown gas is evolved. Identify X.","b) Y: i) 2 cm³ Y + 2 drops NaOH: a green precipitate forms.  ii) 2 cm³ Y + 2 drops BaCl₂ followed by dilute HCl: a white precipitate that dissolves in dilute HCl. Identify Y.","c) Z: i) Z gives a brick-red flame colour.  ii) 2 cm³ Z + 5 drops dilute HCl without heating: a gas is evolved which turns limewater milky. Identify Z.","d) Give the names and formulae of X, Y and Z.","e) Describe how to prepare and collect a dry sample of ammonia in the laboratory, using: round-bottomed flask, delivery tubes, clamp and stand, drying tower, gas jar, solid NH₄Cl, solid Ca(OH)₂, quicklime CaO. Draw and label the set-up.","f) Complete the table on separation of a mixture: name the separation technique and the mixture separated by it."],answer:["a) i) Gas = ammonia, NH₃. Conclusion: X contains ammonium ions, NH₄⁺.","a) ii) Brown gas = nitrogen dioxide, NO₂. Conclusion: X contains nitrate ions, NO₃⁻. So X = ammonium nitrate.","b) i) Green precipitate Fe(OH)₂: Fe²⁺ ions are present.","b) ii) White precipitate that dissolves in dilute HCl (BaSO₃): SO₃²⁻ ions are present — sulphite. So Y = iron(II) sulphite.","c) i) Brick-red flame colour: Ca²⁺ ions are present.","c) ii) Gas turning limewater milky = CO₂. Conclusion: carbonate, CO₃²⁻, is present. So Z = calcium carbonate.","d) From the table: X = ammonium nitrate, NH₄NO₃.  Y = iron(II) sulphite, FeSO₃.  Z = calcium carbonate, CaCO₃.","e) Prepare and collect dry ammonia: heat a mixture of solid NH₄Cl + solid Ca(OH)₂ in a round-bottomed flask clamped on a stand. Equation: 2NH₄Cl + Ca(OH)₂ → CaCl₂ + 2NH₃ + 2H₂O. Pass the gas through a drying tower containing quicklime, CaO (which dries NH₃; CaCl₂ and concentrated H₂SO₄ cannot be used). Collect the dry gas in a gas jar by downward displacement of air (NH₃ is less dense than air and very soluble, so it cannot be collected over water). Draw and label: flask, heat, delivery tube, drying tower with CaO, inverted gas jar.","f) Separation technique = chromatography. Mixture = different coloured pigments in chlorophyll / ink / dyes. Physical property = different solubility in the solvent / different rates of movement / different Rf values / different attraction to the stationary phase."]},{section:"Section B · Answer ALL 2",title:"Q7 — Titration & Collection of Gases",prompt:["Provided: 0.20 M NaOH, dilute HCl, pipette, burette, conical flask, phenolphthalein indicator, clamp, stand. Use them to determine the concentration of the dilute acid.","a) Draw the set-up and describe it in words.","b) 25 cm³ of 0.20 M NaOH is transferred into a conical flask + 3 drops of phenolphthalein.  i) Which apparatus is used to transfer the NaOH?  ii) State the colour change in the conical flask.","c) Dilute acid is run from the burette. Results — Approximate: Final 26.2, Initial 0.2, Titre 26.0.  1st Accurate: Final 46.0, Initial 20.9, Titre 25.1.  2nd Accurate: Final 49.0, Initial 24.1, Titre 24.9.  i) Complete the table.  ii) Calculate the mean titre.","d) Calculate the concentration of the acid if 25 cm³ of 0.20 M NaOH required the mean titre.","e) Diagrams A, B and C show methods of collection of gases. For each, name the method, state which gases it suits, and give an example."],answer:["a) Set-up: burette clamped on a stand, filled with dilute HCl, with a conical flask below containing 25 cm³ of 0.20 M NaOH + phenolphthalein, on a white tile.","b) i) Apparatus used to transfer the NaOH: pipette.  ii) Colour change in the conical flask: pink / purple to colourless (at the end point, the acid neutralises the base).","c) i) Table: Approximate — Final 26.2, Initial 0.2, Titre 26.0.  1st Accurate — Final 46.0, Initial 20.9, Titre 25.1.  2nd Accurate — Final 49.0, Initial 24.1, Titre 24.9.","c) ii) Mean titre = (25.1 + 24.9) / 2 = 25.0 cm³ (the approximate titre is not used).","d) NaOH + HCl → NaCl + H₂O. Moles NaOH = 0.20 × 25/1000 = 0.005 mol. Moles HCl = 0.005 mol (1 : 1). Concentration of HCl = 0.005 × 1000 / 25.0 = 0.20 mol/dm³.","e) 1) A = upward displacement of air / downward delivery — gas denser than air. Example: carbon dioxide, CO₂ / sulphur dioxide, SO₂ / chlorine, Cl₂.","e) 2) B = downward displacement of air / upward delivery — gas less dense than air. Example: ammonia, NH₃ / hydrogen, H₂.","e) 3) C = over water / displacement of water — gas insoluble in water. Example: hydrogen, H₂ / oxygen, O₂."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q8 — Four Factors Affecting Rate of Reaction",prompt:["Describe four factors which affect the rate of a chemical reaction, and for each factor explain how it affects the rate."],answer:["Temperature: increase temperature → particles gain kinetic energy, move faster, collide more often, and more collisions have the activation energy, so the rate increases.","Concentration: increase concentration → more particles per unit volume, more collisions per second, so the rate increases.","Surface area: increase surface area (powder / smaller pieces) → more surface is exposed, more collisions, so the rate increases.","Catalyst: a catalyst lowers the activation energy, so more particles have enough energy to react, the rate increases, and the catalyst is not used up.","Also: pressure for gases, and light."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q9 — Extraction of Aluminium",prompt:["a) Describe the extraction of aluminium from a named ore.","b) State uses of aluminium, relating each use to its property."],answer:["Ore = bauxite, aluminium oxide, Al₂O₃.","1) Purify the bauxite (Bayer process): dissolve Al₂O₃ in hot NaOH, filter off impurities (iron oxide).","2) Electrolysis: dissolve pure Al₂O₃ in molten cryolite (lowers the melting point from 2050 °C to about 950 °C, improves conductivity). Graphite anode, graphite / steel cathode (carbon lining).","Cathode: Al³⁺ + 3e⁻ → Al (molten aluminium tapped off).","Anode: 2O²⁻ → O₂ + 4e⁻. Oxygen reacts with the graphite anode: C + O₂ → CO₂, so the anode burns away and must be replaced.","b) Uses of aluminium, relating each use to its property: Aircraft / aeroplanes — light, strong, corrosion resistant. Cooking utensils / saucepans — good conductor of heat, light, corrosion resistant. Electric cables — good conductor of electricity, light, ductile. Packaging / foil — malleable, light, corrosion resistant. Window frames / doors — light, strong, corrosion resistant."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q10 — Short Notes: Four Reactions",prompt:["Write short notes on each reaction, including the reaction type and observations:","a) KBr + Cl₂ → 2KCl + Br₂.","b) CuO + H₂SO₄ → CuSO₄ + H₂O.","c) CH₂=CH₂ + H₂O → CH₃CH₂OH.","d) CH₃CH₂OH + CH₃COOH ⇌ CH₃COOC₂H₅ + H₂O."],answer:["a) KBr + Cl₂ → 2KCl + Br₂. Type: displacement / redox / halogen displacement. Observation: colourless solution turns brown / orange-brown — bromine is liberated, chlorine is more reactive than bromine.","b) CuO + H₂SO₄ → CuSO₄ + H₂O. Type: neutralisation / acid–base. Observation: black solid dissolves, blue solution formed — copper(II) sulphate.","c) CH₂=CH₂ + H₂O → CH₃CH₂OH. Type: hydration / addition. Observation: ethene + steam → ethanol, H₃PO₄ catalyst, 300 °C, 60 atm, colourless liquid formed.","d) CH₃CH₂OH + CH₃COOH ⇌ CH₃COOC₂H₅ + H₂O. Type: esterification. Observation: ethanol + ethanoic acid → ethyl ethanoate + water, concentrated H₂SO₄ catalyst, reflux, sweet / fruity smell of ester."]}],Of=[{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q1 — Chlorine Isotopes: ³⁵Cl and ³⁷Cl",prompt:["Chlorine has two isotopes, chlorine-35 and chlorine-37.","a) i) Define isotopes.  ii) What is the atomic number of chlorine?  iii) For Cl-37, state the number of protons, neutrons and electrons in a neutral atom.","b) The ratio of ³⁵Cl to ³⁷Cl is 3 : 1. Calculate the relative atomic mass (RAM) of chlorine.","c) i) Define a diatomic molecule.  ii) Name the intermolecular forces between chlorine molecules."],answer:["a) i) Isotopes = atoms of the same element, with the same number of protons, but different numbers of neutrons / different mass numbers.","a) ii) Atomic number = 17.","a) iii) Cl-37: protons 17, neutrons 20 (37 − 17), electrons 17.","b) RAM = (35 × 3 + 37 × 1) / 4 = 142 / 4 = 35.5.","c) i) Diatomic molecule = a molecule made of 2 atoms.  ii) Intermolecular forces = Van der Waals / London dispersion forces."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q2 — Fluorine, Bromine, Iodine Family",prompt:["Fluorine, bromine and iodine belong to the same family.","a) i) Name this family.  ii) State the physical state of fluorine, bromine and iodine at room temperature.","b) Chlorine is made from concentrated hydrochloric acid using manganese(IV) oxide. i) What is the role of MnO₂?  ii) Write the equation for the reaction.","c) Bromine water is added to potassium iodide solution, and iodine solution is added to potassium bromide solution. i) Describe what happens with KI and explain it.  ii) Describe what happens with KBr and explain it."],answer:["a) i) Family = Halogens / Group VII.","a) ii) Fluorine: gas. Bromine: liquid. Iodine: solid.","b) i) MnO₂ = oxidising agent.  ii) MnO₂ + 4HCl → MnCl₂ + Cl₂ + 2H₂O.","c) i) Colour: colourless KI solution turns brown — iodine is liberated. Bromine is more reactive than iodine, so it displaces iodine from KI.","c) ii) No reaction — iodine is less reactive than bromine, so it cannot displace bromine from KBr."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q3 — Redox: CuO + C and CuO + H₂",prompt:["Reaction I: 2CuO + C → 2Cu + CO₂.  Reaction II: CuO + H₂ → Cu + H₂O.","a) i) Define oxidation in terms of oxygen.  ii) Define reduction in terms of hydrogen.","b) i) Name the reducing agent in Reaction I.  ii) Name the oxidising agent in Reaction II.","c) State the oxidation state of copper in CuO and of oxygen in H₂O.","d) Classify each of these as oxidation, reduction, or both (redox): i) Al³⁺ + 3e⁻ → Al  ii) 2O²⁻ → O₂ + 4e⁻  iii) 2H₂ + O₂ → 2H₂O."],answer:["a) i) Oxidation in terms of oxygen = gain of oxygen.  ii) Reduction in terms of hydrogen = gain of hydrogen.","b) i) Reducing agent in I = carbon, C.  ii) Oxidising agent in II = copper(II) oxide, CuO.","c) Oxidation state: Cu in CuO = +2. O in H₂O = −2.","d) i) Al³⁺ + 3e⁻ → Al = reduction (gain of electrons).  ii) 2O²⁻ → O₂ + 4e⁻ = oxidation (loss of electrons).  iii) 2H₂ + O₂ → 2H₂O = both oxidation and reduction / redox."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q4 — Organic: A = C₂H₄, B = C₄H₉OH, C = C₂H₆",prompt:["A is C₂H₄, B is C₄H₉OH, C is C₂H₆.","a) Name the homologous series to which A, B and C belong.","b) i) Define isomerism.  ii) Which compound exhibits isomerism?  iii) Draw / name two isomers of that compound.","c) Describe how C can be converted to A. Name the type of reaction and state the conditions.","d) Give a simple test for B (an alcohol)."],answer:["a) A: alkene. B: alcohol / alkanol. C: alkane.","b) i) Isomerism = same molecular formula, different structural formula.  ii) B exhibits isomerism.  iii) Two structures: butan-1-ol CH₃CH₂CH₂CH₂OH and butan-2-ol CH₃CH(OH)CH₂CH₃.","c) C to A: C₂H₆ → C₂H₄ + H₂. Cracking / dehydrogenation, high temperature / steam cracking / catalyst.","d) Simple test for B (alcohol): add sodium metal — effervescence / hydrogen evolved, or add acidified K₂Cr₂O₇ which turns orange to green on warming (oxidation)."]},{section:"Section A · Answer ALL 5 — best 4 graded",title:"Q5 — Farmer: Soil pH 4.5, Deficient in Main Elements",prompt:["A farmer’s soil has pH 4.5 and is deficient in the main elements plants need.","a) i) Name the three main elements.  ii) Name a substance that contains all three.","b) i) Name (NH₄)₂SO₄.  ii) Which has a higher percentage of nitrogen — NH₄NO₃ or (NH₄)₂SO₄? Show your working.","c) i) What does pH 4.5 tell you about the soil?  ii) How can the farmer raise the pH?"],answer:["a) i) Main elements: nitrogen, phosphorus, potassium (N, P, K).  ii) Substance with all three: NPK fertiliser.","b) i) (NH₄)₂SO₄ = ammonium sulphate.","b) ii) Higher nitrogen: NH₄NO₃. NH₄NO₃ Mr = 80, N = 28/80 × 100 = 35%. (NH₄)₂SO₄ Mr = 132, N = 28/132 × 100 = 21.2%. So NH₄NO₃ is higher.","c) i) pH 4.5 = acidic soil.  ii) Raise pH: add lime / calcium carbonate / calcium hydroxide / wood ash."]},{section:"Section B · Answer ALL 2",title:"Q6 — Unknown Salts X, Y, Compound Z & Mg + HCl Graph",prompt:["A student carried out laboratory tests on two unknown salts X and Y, and on an organic compound Z.","a) X: i) 2 cm³ X + dilute acid gives a colourless gas that turns limewater milky.  ii) Flame test on X gives a brick-red flame.  iii) Using the ions above, name compound X.","b) Y: i) To 2 cm³ Y add a few drops of aqueous NaOH — a blue precipitate forms.  ii) To 2 cm³ Y add 2 cm³ BaCl₂ followed by dilute HCl — a white precipitate is observed, insoluble in excess acid. Identify the precipitate, the anion in Y, and compound Y.","c) Z is a liquid: i) Tested with both red and blue litmus — no colour change in either case.  ii) To 2 cm³ Z add solid sodium metal — effervescence occurs and the gas released burns with a 'pop'. Identify the gas.  iii) Liquid Z ignited in a Bunsen flame burns with a pale blue flame. Name the functional group in Z and suggest one substance that can be Z.","d) Figure 1: graph of volume of hydrogen evolved vs time for Mg ribbon + dilute HCl.  i) At what time did the reaction come to an end?  ii) What was the volume after 3 minutes?","e) The student is to prepare and collect dry ammonia gas in the laboratory.  i) What reagents are used? Give the equation.  ii) What is the reaction condition?  iii) Why is ammonia collected by downward displacement of air?"],answer:["a) i) Gas = carbon dioxide, CO₂; anion in X = carbonate, CO₃²⁻.  ii) Brick-red flame = calcium ions, Ca²⁺.  iii) Compound X = calcium carbonate, CaCO₃.","b) i) Blue precipitate = Cu(OH)₂, so Cu²⁺ ions are present in Y.  ii) White precipitate insoluble in excess acid = barium sulphate, BaSO₄. Anion in Y = sulphate, SO₄²⁻. Compound Y = copper(II) sulphate, CuSO₄.","c) i) No change with red or blue litmus — Z is neutral, neither acidic nor alkaline.  ii) Gas = hydrogen, H₂.  iii) Pale blue flame — functional group in Z = hydroxyl group, –OH / alcohol group. One substance that can be Z: ethanol, C₂H₅OH.","d) i) About 10 minutes — read where the curve becomes flat / reaches a plateau.  ii) About 40 cm³ — read from the graph at 3 minutes (accept the teacher's graph reading, about 35–45 cm³).","e) i) Reagents: ammonium chloride + calcium hydroxide (or sodium hydroxide). Equation: 2NH₄Cl + Ca(OH)₂ → CaCl₂ + 2NH₃ + 2H₂O.  ii) Condition: heat / warm the mixture.  iii) Ammonia is less dense than air and very soluble in water, so it cannot be collected over water; it rises and displaces air downwards."]},{section:"Section B · Answer ALL 2",title:"Q7 — Standard Solution & Titration: Na₂CO₃ vs H₂SO₄",prompt:["Provided: beaker, pipette, 250 cm³ volumetric flask, burette, conical flask, anhydrous sodium carbonate, wash bottle, dilute sulphuric acid, distilled water, phenolphthalein indicator.","Prepare 250 cm³ of 0.1 M Na₂CO₃(aq) and use it to determine the concentration of dilute sulphuric acid.","a) i) Outline 3 key steps to prepare the standard solution.  ii) State one precaution.","b) i) What is the main apparatus for preparing the standard solution?  ii) What mass of solid Na₂CO₃ is needed to prepare 0.1 M solution?  iii) What equipment, NOT given, is used to weigh the solid?","c) i) Name the technique used to determine the concentration.  ii) Why is dilute sulphuric acid put in the burette?  iii) Describe the cleaning procedure for the burette and the pipette.","d) In the experiment, 25 cm³ of 0.1 M Na₂CO₃ exactly neutralised 20 cm³ dilute H₂SO₄.  i) Write the equation.  ii) Calculate the concentration of the dilute sulphuric acid.","e) Separation techniques: sublimation, separating funnel, evaporation to dryness, fractional distillation, filtration, crystallisation.  i) How is salt obtained from sea water?  ii) How is silver chloride separated from its mixture with water?  iii) How is water separated from kerosene?  iv) What property of water and kerosene enables separation by the method in (iii)?  v) Give one example of a mixture separated by chromatography."],answer:["a) i) 3 key steps: 1) Weigh the calculated mass of anhydrous Na₂CO₃ accurately. 2) Dissolve it in distilled water in a beaker, stir until fully dissolved. 3) Transfer the solution + washings into the 250 cm³ volumetric flask, add distilled water up to the mark (meniscus at eye level), stopper and shake to mix.  ii) One precaution: wear goggles / gloves, use distilled water only, ensure all solid is dissolved, do not overshoot the mark, read the meniscus at eye level.","b) i) Main apparatus: 250 cm³ volumetric flask.  ii) Moles = 0.1 × 250/1000 = 0.025 mol. Mass = 0.025 × 106 = 2.65 g.  iii) Equipment NOT given, used to weigh the solid: (electronic) balance / weighing balance.","c) i) Technique: titration.  ii) Acid in the burette: acid is added dropwise from the burette for accurate control, the base is measured accurately with a pipette into the conical flask, and the phenolphthalein end point is sharp.  iii) Cleaning: burette — rinse with distilled water, then rinse with dilute sulphuric acid (the solution it will contain). Pipette — rinse with distilled water, then rinse with sodium carbonate solution (the solution it will contain). Never rinse with the other solution.","d) i) Equation: Na₂CO₃ + H₂SO₄ → Na₂SO₄ + CO₂ + H₂O.  ii) Moles Na₂CO₃ = 0.1 × 25/1000 = 0.0025 mol. Moles H₂SO₄ = 0.0025 mol (1 : 1). Concentration = 0.0025 × 1000/20 = 0.125 mol/dm³.","e) i) Salt from sea water: evaporation to dryness.  ii) Silver chloride from its mixture with water: filtration — AgCl is insoluble and stays on the filter paper.  iii) Water from kerosene: separating funnel.  iv) Property: water and kerosene are immiscible / do not mix, and have different densities — water is denser, so it sinks below the kerosene.  v) Example separated by chromatography: dyes / colours in ink, pigments in leaves, amino acids, food colourings."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q8 — Electrolysis: Purification & Electroplating",prompt:["Electrolysis can be used to purify metals and in electroplating.","Describe, using a specific example and equations, a) the purification of copper and b) electroplating."],answer:["Purification of copper: impure copper anode, pure copper cathode, copper(II) sulphate electrolyte.","Cathode: Cu²⁺ + 2e⁻ → Cu (pure copper deposits).","Anode: Cu → Cu²⁺ + 2e⁻ (impure copper dissolves). Impurities fall as anode sludge.","Electroplating: e.g. silver-plating a spoon — spoon = cathode, silver = anode, silver nitrate electrolyte.","Cathode: Ag⁺ + e⁻ → Ag (thin silver coat on the spoon).","Anode: Ag → Ag⁺ + e⁻."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q9 — Short Notes: Esterification, Saponification, Deliquescence, Chemical Change",prompt:["Write short notes on: (a) esterification, (b) saponification, (c) deliquescence, (d) chemical change."],answer:["(a) Esterification: alcohol + carboxylic acid → ester + water, concentrated H₂SO₄ catalyst, reflux. Example: ethanol + ethanoic acid → ethyl ethanoate + water.","(b) Saponification: hydrolysis of fat / oil with concentrated NaOH → soap (sodium salt of fatty acid) + glycerol. Used to make soap.","(c) Deliquescence: a solid absorbs moisture from the air and dissolves in the absorbed water. Example: sodium hydroxide, calcium chloride.","(d) Chemical change: a change where new substance(s) are formed, usually irreversible, with an energy change. Examples: burning, rusting, neutralisation."]},{section:"Section C · Answer 2 out of 3 — only the first 2 counted if more attempted",title:"Q10 — Bonding: NaCl, H₂, Al",prompt:["Substances: sodium chloride (NaCl), hydrogen gas (H₂), aluminium metal (Al).","a) State the bond type in each, and explain it with diagrams.","b) State one physical property of each and relate it to its bonding."],answer:["a) NaCl — ionic bonding: Na loses 1 electron to Cl, Na⁺ [2,8]⁺, Cl⁻ [2,8]⁻, electrostatic attraction, giant ionic lattice.","a) H₂ — covalent bonding: 2 H atoms share 1 pair of electrons, H–H single covalent bond, simple molecule.","a) Al — metallic bonding: positive Al³⁺ ions in a sea of delocalised electrons, strong electrostatic attraction between ions and electrons.","b) NaCl — high melting point / conducts electricity when molten or dissolved but not as a solid: strong ionic bonds / free ions when molten.","b) H₂ — low melting / boiling point, gas at room temperature: weak intermolecular forces between simple molecules.","b) Al — high melting point, conducts electricity, malleable / ductile: strong metallic bonding, delocalised electrons free to move, layers can slide."]}],Hf=[{q:"A uniform mixture of a solute and a solvent is called…",options:["Mixture","Colloid","Solution","Suspension"],answer:2,explanation:"C — Solution. A solution is a uniform (homogeneous) mixture of a solute dissolved in a solvent."},{q:"Which element is stored under paraffin oil?",options:["Sodium","Potassium","Calcium","Aluminium"],answer:1,explanation:"B — Potassium. Group I metals are reactive with air and water, so they are stored under paraffin oil."},{q:"The reaction between dilute hydrochloric acid and potassium hydroxide is…",options:["Neutralisation reaction","Displacement reaction","Redox reaction","Decomposition reaction"],answer:0,explanation:"A — Neutralisation reaction. Acid + base → salt + water: HCl + KOH → KCl + H₂O."},{q:"Which pair constitutes the major cause of acid rain?",options:["CO and CO₂","NO and CO","SO₂ and CO₂","NO₂ and SO₂"],answer:3,explanation:"D — NO₂ and SO₂. These gases dissolve in rain water to form acids."},{q:"Which hydrocarbon rapidly decolourises bromine water?",options:["Methane","Ethane","Propane","Ethene"],answer:3,explanation:"D — Ethene. Ethene is an alkene — its double bond reacts by addition and decolourises bromine water."},{q:"Which reaction will NOT occur?",options:["Cl₂ + 2KBr → 2KCl + Br₂","Br₂ + 2KI → 2KBr + I₂","I₂ + 2KBr → 2KI + Br₂","Cl₂ + 2KI → 2KCl + I₂"],answer:2,explanation:"C — I₂ + 2KBr → 2KI + Br₂ will NOT occur. Iodine is less reactive than bromine, so it cannot displace bromine."},{q:"Which enzyme converts glucose to ethanol?",options:["Diastase","Zymase","Invertase","Amylase"],answer:1,explanation:"B — Zymase. Zymase converts glucose to ethanol in fermentation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂."},{q:"What is the percentage by mass of water of crystallisation in hydrated copper(II) sulphate, CuSO₄·5H₂O?",options:["18.0%","27.0%","36.0%","45.0%"],answer:2,explanation:"C — 36.0%. 5H₂O = 90, total Mr = 250, 90 / 250 × 100 = 36.0%."},{q:"Equilibrium is attained when…",options:["The rate of the forward reaction is greater than the backward reaction","The rate of the backward reaction is greater than the forward reaction","The rate of the forward and backward reactions are the same","The reaction stops"],answer:2,explanation:"C — The rate of the forward and backward reactions are the same."},{q:"What is the oxidation state of iron in Fe₂O₃?",options:["+2","+3","+6","−3"],answer:1,explanation:"B — +3. 2x + 3(−2) = 0, so 2x = +6 and x = +3."},{q:"Which are the appropriate temperature and reaction conditions for the preparation of Cl₂ in the laboratory?",options:["MnO₂, H₂SO₄, NaCl and heat","MnO₂, NaOH and heat","H₂SO₄, NaCl and cold","MnO₂, HNO₃ and heat"],answer:0,explanation:"A — MnO₂, H₂SO₄, NaCl and heat. HCl is formed in situ and oxidised by MnO₂ to Cl₂."},{q:"NH₃ is collected by…",options:["Upward delivery","Downward delivery","Over water","Downward displacement over water"],answer:0,explanation:"A — Upward delivery. NH₃ is lighter than air, so it rises and displaces air downwards."},{q:"Which is an irritating gas which bleaches damp litmus paper?",options:["Oxygen","Hydrogen","Chlorine","Nitrogen"],answer:2,explanation:"C — Chlorine. Cl₂ is an irritating gas that bleaches damp litmus paper white."},{q:"Which is a colourless, tasteless, poisonous gas?",options:["Carbon dioxide","Carbon monoxide","Sulphur dioxide","Nitrogen dioxide"],answer:1,explanation:"B — Carbon monoxide. CO is colourless, tasteless and poisonous."},{q:"Which gas is used in fire extinguishers?",options:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],answer:2,explanation:"C — Carbon dioxide. CO₂ does not support combustion and is used in fire extinguishers."},{q:"What mass of solid Na₂CO₃ is needed to prepare 250 cm³ of 0.1 M Na₂CO₃?",options:["1.325 g","2.65 g","5.30 g","10.6 g"],answer:1,explanation:"B — 2.65 g. Moles = 0.1 × 0.25 = 0.025 mol. Mass = 0.025 × 106 = 2.65 g."},{q:"Statement 1: Sodium chloride solution is a strong electrolyte. Statement 2: Sodium sulphate solution is completely ionised.",options:["Both statements True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:0,explanation:"A — Both statements True, second is correct explanation. Sodium chloride solution is a strong electrolyte; sodium sulphate solution is completely ionised."},{q:"Statement 1: Concentrated sulphuric acid turns sugar black. Statement 2: Concentrated sulphuric acid is dehydrating.",options:["Both statements True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:0,explanation:"A — Both statements True, second is correct explanation. Concentrated sulphuric acid is dehydrating — it removes the elements of water from sugar, leaving black carbon."},{q:"Statement 1: Vanadium(V) oxide is used in the conversion of SO₂ to SO₃ in the Contact Process. Statement 2: Vanadium(V) oxide is a catalyst.",options:["Both statements True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:0,explanation:"A — Both statements True, second is correct explanation. Vanadium(V) oxide is the catalyst for 2SO₂ + O₂ ⇌ 2SO₃."},{q:"Statement 1: Petrol is a mixture. Statement 2: Fractional distillation is used to isolate petrol from crude oil.",options:["Both statements True, second is correct explanation","Both True, second is NOT correct explanation","First True, second False","Both False"],answer:1,explanation:"B — Both statements True, second is NOT correct explanation. Petrol is a mixture, and fractional distillation does isolate it from crude oil, but that does not explain why petrol is a mixture."},{q:"Which is an amphoteric oxide?",options:["CaO","Al₂O₃","Na₂O","MgO"],answer:1,explanation:"B — Al₂O₃. Aluminium oxide reacts with both acids and alkalis, so it is amphoteric."},{q:"Select the description of a covalent compound:",options:["Made up of ions","Conducts electricity when molten","Made up of molecules","High melting point"],answer:2,explanation:"C — Made up of molecules. Covalent compounds are made up of molecules, not ions."},{q:"Which pair of electronic configurations represents two metal atoms in the same period?",options:["2,8,1 and 2,8,8","2,8,1 and 2,8,2","2,8,2 and 2,8,8","2,8,3 and 2,8,1"],answer:1,explanation:"B — 2,8,1 and 2,8,2. Na and Mg both have 3 shells, so both are in Period 3."},{q:"Condensation is a change of state from…",options:["Gas to liquid","Liquid to gas","Solid to gas","Liquid to solid"],answer:0,explanation:"A — Gas to liquid. Condensation is gas → liquid."},{q:"Charles's law is represented as…",options:["V α 1/T","V α P","V α 1/P","V α T"],answer:3,explanation:"D — V α T. V/T = constant at constant pressure."},{q:"In which substance can hydrogen bonding occur?",options:["Methane","Ethane","Hydrogen chloride","Water"],answer:3,explanation:"D — Water. In H₂O, hydrogen is bonded to oxygen, so hydrogen bonding occurs between water molecules."},{q:"What is the quantity of electricity when a current of 1.5 A is passed through an electrolyte for 20 minutes?",options:["900 C","1200 C","1500 C","1800 C"],answer:3,explanation:"D — 1800 C. Q = It = 1.5 × 1200 = 1800 C."},{q:"Which substances are deliquescent EXCEPT…",options:["NaOH","KCl","MgCl₂","CaCl₂"],answer:1,explanation:"B — KCl. NaOH, MgCl₂ and CaCl₂ are deliquescent; KCl is not."},{q:"What happens when dilute copper(II) sulphate is added to anhydrous copper(II) sulphate?",options:["The white powder stays white","The white powder dissolves to form a blue solution","The blue powder turns white","The white powder dissolves to form a colourless solution"],answer:1,explanation:"B — The white powder dissolves to form a blue solution. Anhydrous CuSO₄ is white; with water it forms blue hydrated CuSO₄."},{q:"The first and second burette readings are 5 cm³ and 17.5 cm³. What is the volume of liquid used to reach the end point?",options:["5 cm³","12 cm³","12.5 cm³","17.5 cm³"],answer:2,explanation:"C — 12.5 cm³. 17.5 − 5 = 12.5 cm³."},{q:"Identify the cation X (golden-yellow flame) and the cation Y (brick-red flame):",options:["X = K⁺, Y = Ca²⁺","X = Na⁺, Y = Ca²⁺","X = Ca²⁺, Y = Na⁺","X = Na⁺, Y = Cu²⁺"],answer:1,explanation:"B — X = Na⁺ (sodium ion), Y = Ca²⁺ (calcium ion). Sodium gives a golden-yellow flame; calcium gives a brick-red flame."},{q:"Identify salt Y: the cation gives a brick-red flame, and BaCl₂ gives a white precipitate. Salt Y is…",options:["CaCO₃","CaCl₂","Ca(NO₃)₂","CaSO₄"],answer:3,explanation:"D — CaSO₄. Ca²⁺ gives a brick-red flame, and BaCl₂ + sulphate gives a white BaSO₄ precipitate, so the salt is calcium sulphate."},{q:"A compound contains 85.5% carbon and 14.3% hydrogen. What is its empirical formula?",options:["CH","CH₂","CH₃","CH₄"],answer:1,explanation:"B — CH₂. C: 85.5/12 = 7.125, H: 14.3/1 = 14.3, ratio 1 : 2."},{q:"44 g of CO₂ is… 1) 2 moles of CO₂. 2) 24,000 cm³ of CO₂ at R.T.P. 3) 6.02 × 10²³ molecules of CO₂. Which are correct?",options:["If only 1 is correct","If only 1 and 2 are correct","If only 1 and 3 are correct","If only 2 and 3 are correct"],answer:3,explanation:"D — If only 2 and 3 are correct. 44 g of CO₂ is 1 mole (not 2 moles), so it is 24,000 cm³ at R.T.P. and contains 6.02 × 10²³ molecules."},{q:"Mole / Volume: 1) 44 g of CO₂ is 2 moles. 2) 22 g of CO₂ occupies 12,000 cm³ at R.T.P. 3) 44 g of CO₂ contains 6.02 × 10²³ molecules. Which are correct?",options:["If only 1 is correct","If only 1 and 2 are correct","If only 1 and 3 are correct","If only 2 and 3 are correct"],answer:3,explanation:"D — If only 2 and 3 are correct. 44 g of CO₂ is 1 mole (not 2 moles); 22 g is 0.5 mol, so 0.5 × 24,000 = 12,000 cm³; 44 g (1 mole) contains 6.02 × 10²³ molecules."},{q:"Calcium carbonate is a raw material used for: 1) extraction of iron, 2) manufacture of ammonia, 3) production of cement. Which are correct?",options:["If only 1 is correct","If only 1 and 3 are correct","If only 2 and 3 are correct","If only 1, 2 and 3 are correct"],answer:1,explanation:"B — If only 1 and 3 are correct. CaCO₃ is used in the extraction of iron and in the production of cement."},{q:"Which gas or gases are responsible for the greenhouse effect? 1) Oxygen, 2) Methane, 3) Carbon dioxide. Which are correct?",options:["If only 1 is correct","If only 1 and 2 are correct","If only 2 and 3 are correct","If only 1, 2 and 3 are correct"],answer:2,explanation:"D — If only 2 and 3 are correct. Methane and carbon dioxide are greenhouse gases."},{q:"For Zn + 2HCl → ZnCl₂ + H₂, the rate will be affected by: 1) temperature, 2) surface area, 3) concentration, 4) light intensity. Which are correct?",options:["If only 1 and 2 are correct","If only 2 and 3 are correct","If only 1, 2 and 3 are correct","If only 1, 2, 3 and 4 are correct"],answer:2,explanation:"C — If only 1, 2 and 3 are correct. Temperature, surface area and concentration affect the rate, but not light intensity."},{q:"What is the electronic configuration of the ²⁶Fe²⁺ ion?",options:["2,8,12","2,8,14","2,8,16","2,8,8,2"],answer:1,explanation:"B — 2,8,14. The Fe atom is 2,8,14,2 and loses its 2 outer electrons to form Fe²⁺."},{q:"How many of each type of atom are present in Al₂(SO₄)₃?",options:["Al 2, O 12, S 3","Al 2, O 8, S 3","Al 3, O 12, S 2","Al 2, O 4, S 3"],answer:0,explanation:"A — Al 2, O 12, S 3. Three sulphate groups give S 3 and O 12, with Al 2."},{q:"What is the most abundant component of air?",options:["Oxygen","Carbon dioxide","N₂","Argon"],answer:2,explanation:"C — N₂. Nitrogen is about 78% of air."},{q:"Which oxidising agent is used in the treatment of water?",options:["Alum","Oxygen","Cl₂","Lime"],answer:2,explanation:"C — Cl₂. Chlorine is used as a disinfectant / oxidising agent in water treatment to kill germs."},{q:"Which is a characteristic of alkaline earth metals?",options:["Their oxides are acidic","Their chlorides are insoluble","Their carbonates are stable to heat","Their nitrates decompose on heating to oxides, nitrogen dioxide and oxygen"],answer:3,explanation:"D — Their nitrates decompose on heating to oxides, nitrogen dioxide and oxygen. Group II nitrates behave this way."},{q:"In an exothermic reaction…",options:["The energy content of the reactants is more than that of the products","The energy content of the products is more than that of the reactants","The energy content of reactants and products is equal","There is no heat change"],answer:0,explanation:"A — The energy content of the reactants is more than that of the products. Heat is released."},{q:"Members of a homologous series have…",options:["The same molecular formula","Similar chemical properties","The same boiling point","Differ by CH₄"],answer:1,explanation:"B — Similar chemical properties. Members share the same functional group and general formula."},{q:"Which statement is NOT true of detergents?",options:["Are synthetic","Are natural polymers","Work in hard water","Are made from petroleum products"],answer:1,explanation:"B — Are natural polymers. Detergents are synthetic, made from petroleum products."},{q:"Which pH value best describes the pH of aqueous NaOH?",options:["2","7","12","9"],answer:2,explanation:"C — 12. Aqueous NaOH is a strong alkali, so its pH is well above 7."},{q:"Which will burn with the most luminous and sooty flame?",options:["C₂H₂","C₂H₄","C₂H₆","CH₄"],answer:0,explanation:"A — C₂H₂. Acetylene has the highest carbon : hydrogen ratio, so it burns with the most luminous, sooty flame."},{q:"Why is it recommended to use a polystyrene cup in determining the heat of reaction?",options:["It is cheap","It keeps the mixture cool","It speeds up the reaction","It reduces heat loss by conduction"],answer:3,explanation:"D — It reduces heat loss by conduction. Polystyrene is an insulator."},{q:"Which fuel is the most environmentally friendly?",options:["Hydrogen","Petrol","Coal","Wood"],answer:0,explanation:"A — Hydrogen. Hydrogen burns to water, with no CO₂ formed."}],Sf=[{q:"Which is NOT a sub-atomic particle?",options:["Proton","Neutron","Nucleus","Electron"],answer:2,explanation:"C — Nucleus. Proton, neutron and electron are sub-atomic particles; the nucleus is a structure."},{q:"Which gas relights a glowing splint?",options:["Oxygen, O₂","Hydrogen","Carbon dioxide","Nitrogen"],answer:0,explanation:"A — Oxygen, O₂. A glowing splint relights in oxygen."},{q:"Ammonia is described as an alkaline gas because…",options:["It turns damp blue litmus paper red","It turns damp red litmus paper blue","It turns damp blue litmus paper blue","It has no effect on litmus paper"],answer:1,explanation:"B — It turns damp red litmus paper blue. Ammonia is an alkaline gas."},{q:"Which fertiliser is made from sulphuric acid?",options:["Ammonium nitrate","Urea","Ammonium sulphate, (NH₄)₂SO₄","Potassium nitrate"],answer:2,explanation:"C — Ammonium sulphate, (NH₄)₂SO₄. 2NH₃ + H₂SO₄ → (NH₄)₂SO₄."},{q:"Which substance causes hardness in water?",options:["Sodium chloride","Magnesium sulphate, MgSO₄","Potassium nitrate","Sodium carbonate"],answer:1,explanation:"B — MgSO₄. Calcium / magnesium salts cause hardness in water."},{q:"How many neutrons are in an atom with mass number 35 and atomic number 17?",options:["17","35","18","52"],answer:2,explanation:"C — 18. Neutrons = 35 − 17 = 18."},{q:"What is chlorine used for in the treatment of water?",options:["To add taste to the water","To make the water blue","To add oxygen to the water","To kill germs"],answer:3,explanation:"D — To kill germs. Chlorine sterilises drinking water."},{q:"In the electrolysis purification of copper, what is the reaction at the anode?",options:["Cu²⁺ + 2e⁻ → Cu","Cu → Cu²⁺ + 2e⁻","2H₂O → O₂ + 4H⁺ + 4e⁻","Cu → Cu⁺ + e⁻"],answer:1,explanation:"B — Cu → Cu²⁺ + 2e⁻. Impure copper dissolves at the anode."},{q:"What mass of pure copper is deposited when 1.5 A flows for 1 hour 30 minutes? (Cu = 64; 1 Faraday = 96,500 C)",options:["1.35 g","2.70 g","5.40 g","0.27 g"],answer:1,explanation:"B — 2.70 g. Q = 1.5 × 5400 = 8100 C. Moles Cu = 8100 / (96,500 × 2) = 0.042 mol. Mass = 0.042 × 64 = 2.70 g."},{q:"In the equation 2CH₃COOH + Na₂CO₃ → 2X + CO₂ + H₂O, X is…",options:["Sodium carbonate","Sodium ethanoate","Ethanoic acid","Sodium hydroxide"],answer:1,explanation:"B — Sodium ethanoate. Ethanoic acid + sodium carbonate → sodium ethanoate + CO₂ + water."},{q:"Elements M (atomic number 12) and P (atomic number 17) combine. What is the formula of the compound?",options:["MP₂","M₂P","MP","M₂P₃"],answer:0,explanation:"A — MP₂. M is magnesium (Mg²⁺) and P is chlorine (Cl⁻), so the compound is MgCl₂."},{q:"A soil sample has pH 4. What does this tell you about the soil?",options:["Neutral","Acidic","Alkaline","Basic"],answer:1,explanation:"B — Acidic. pH 4 is below 7, so the soil is acidic."},{q:"A hydrocarbon contains 85.7% carbon and 14.3%
